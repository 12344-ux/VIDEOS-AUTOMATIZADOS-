<template>
  <style>
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-500.woff2") format("woff2"); font-weight: 500; }
    #root { position: absolute; inset: 0; }
    #a2-subtitulo { position: absolute; left: 0; right: 0; bottom: 118px; text-align: center;
      font: 500 46px/1.2 "Hanken Grotesk", sans-serif; letter-spacing: 0.01em; color: var(--color-ink, #f3ede4);
      text-shadow: 0 2px 22px rgba(0, 0, 0, 0.75); }
    #a2-subtitulo span { display: inline-block; margin: 0 0.12em; }
  </style>
  <div id="root" data-composition-id="toma2" data-width="1920" data-height="1080">
    <div id="a2-subtitulo"><span>Un</span><span>faro</span><span>se</span><span id="a2-acento">enciende.</span></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const palabras = gsap.utils.toArray("#a2-subtitulo span");
      // La frase aparece en gris claro y cada palabra pasa a tinta cuando la voz la dice (tiempos de la escena).
      tl.fromTo("#a2-subtitulo", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.05);
      gsap.set(palabras, { opacity: 0.32 });
      [0.18, 0.31, 0.55, 0.67].forEach((t, i) =>
        tl.fromTo(palabras[i], { opacity: 0.32 }, { opacity: 1, duration: 0.09, ease: "power1.out" }, t));
      tl.fromTo("#a2-acento", { color: "#f3ede4" }, { color: "#e8b66a", duration: 0.25, ease: "power2.out" }, 0.67);
      tl.to("#a2-subtitulo", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 1.47);
      window.__timelines["toma2"] = tl;
    })();
  </script>
</template>
