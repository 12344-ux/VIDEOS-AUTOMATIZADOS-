  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // «A dos»: los objetos se mueven a 12 imágenes por segundo, como en stop-motion. La cámara, no.
      const aDos = (curva, duracion) => {
        const e = gsap.parseEase(curva);
        const pasos = Math.max(1, Math.round(duracion * 12));
        return (p) => (p >= 1 ? 1 : e(Math.floor(p * pasos) / pasos));
      };
      // Cámara: centra el punto (cx, cy) del escritorio con un zoom s; el giro va aparte.
      const encuadre = (cx, cy, s) => ({ x: 960 - cx * s, y: 540 - cy * s, scale: s });
      gsap.set("#c-mundo", encuadre(960, 560, 1.0));
      tl.fromTo("#c-mundo", encuadre(960, 560, 1.0), { ...encuadre(995, 585, 1.035), duration: 3.0, ease: "sine.inOut" }, 0);
      tl.to("#c-mundo", { ...encuadre(2290, 610, 1.06), duration: 0.6, ease: "power2.inOut" }, 3.0);
      tl.to("#c-mundo", { ...encuadre(2300, 620, 1.09), duration: 1.3, ease: "sine.inOut" }, 3.6);
      tl.to("#c-mundo", { ...encuadre(1600, 1420, 0.95), duration: 0.6, ease: "power2.inOut" }, 4.9);
      tl.to("#c-mundo", { ...encuadre(1615, 1428, 0.975), duration: 3.1, ease: "power2.out" }, 5.5);
      tl.fromTo("#c-camara", { rotation: -0.6 }, { rotation: -0.2, duration: 3.0, ease: "sine.inOut" }, 0);
      tl.to("#c-camara", { rotation: 0.45, duration: 1.9, ease: "sine.inOut" }, 3.0);
      tl.to("#c-camara", { rotation: -0.25, duration: 3.7, ease: "power2.out" }, 4.9);

      // Una foto cae sobre la mesa: llega grande, girada y con la sombra suelta; aterriza a dos.
      const caer = (sel, giro, t, dur = 0.34, opacidad = 0) => {
        tl.fromTo(sel, { opacity: opacidad, scale: 1.1, rotation: giro - 4, y: -36, boxShadow: "0 46px 70px rgba(60,40,20,0.16), 0 6px 14px rgba(60,40,20,0.1)" },
          { opacity: 1, scale: 1, rotation: giro, y: 0, boxShadow: "0 16px 36px rgba(60,40,20,0.26), 0 2px 5px rgba(60,40,20,0.2)", duration: dur, ease: aDos("power3.out", dur) }, t);
      };
      const pegar = (sel, giro, t) =>
        tl.fromTo(sel, { opacity: 0, scale: 1.25, rotation: giro + 6 }, { opacity: 1, scale: 1, rotation: giro, duration: 0.17, ease: aDos("power2.out", 0.17) }, t);

      // Toma 1 (0–3 s): Cabo Norte, 1891.
      caer("#c-foto1", -3, 0.12, 0.34, 1);
      pegar("#c-cinta1a", -9, 0.52);
      pegar("#c-cinta1b", 7, 0.64);
      tl.fromTo("#c-tira", { opacity: 0, rotation: 6, y: -20 }, { opacity: 1, rotation: 2, y: 0, duration: 0.17, ease: aDos("power2.out", 0.17) }, 0.62);
      // Máquina de escribir: una letra cada 0,053 s mientras la voz dice «Cabo Norte» (0,80–1,30 s).
      gsap.utils.toArray("#c-tira span").forEach((letra, i) => tl.fromTo(letra, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 0.8 + i * 0.053));
      // Sello: golpe seco cuando el año se completa («uno», 2,58 s).
      tl.fromTo("#c-sello", { opacity: 0, scale: 1.4, rotation: -2 }, { opacity: 0.9, scale: 1, rotation: -6, duration: 0.083, ease: aDos("power2.in", 0.083) }, 2.52);

      // Toma 2 (3–4,8 s): un faro se enciende.
      caer("#c-foto2", 3.5, 3.36);
      pegar("#c-cinta2", 4, 3.74);
      // La nota a pluma se escribe de izquierda a derecha y la flecha señala la llama.
      tl.fromTo("#c-nota", { clipPath: "inset(-20% 100% -20% 0%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: 0.42, ease: aDos("power1.inOut", 0.42) }, 3.92);
      const trazo = document.getElementById("c-flecha-trazo");
      const largo = trazo.getTotalLength();
      const punta = document.getElementById("c-flecha-punta");
      const largoPunta = punta.getTotalLength();
      gsap.set(trazo, { strokeDasharray: largo });
      gsap.set(punta, { strokeDasharray: largoPunta });
      tl.fromTo(trazo, { strokeDashoffset: largo }, { strokeDashoffset: 0, duration: 0.25, ease: aDos("power1.in", 0.25) }, 4.3);
      tl.fromTo(punta, { strokeDashoffset: largoPunta }, { strokeDashoffset: 0, duration: 0.17, ease: aDos("none", 0.17) }, 4.55);

      // Toma 3 (4,8–10 s): desde entonces, ni una sola noche a oscuras.
      caer("#c-foto3", -2.5, 5.3);
      pegar("#c-cinta3", -5, 5.7);
      // El título se imprime palabra a palabra, en la palabra que lo dice: tinta que se asienta.
      const palabras = gsap.utils.toArray("#c-titulo span");
      [6.1, 6.27, 6.49, 6.76, 7.02, 7.08].forEach((t, i) =>
        tl.fromTo(palabras[i], { opacity: 0, filter: "blur(3px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.083, ease: aDos("power1.out", 0.083) }, t));
      // Pie a máquina: «LIBRO DE GUARDIA · 1891–2026», una letra cada 0,05 s desde 7,45 s.
      gsap.utils.toArray("#c-pie span").forEach((letra, i) => tl.fromTo(letra, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 7.45 + i * 0.05));

      window.__timelines["escritorio"] = tl;
    })();
  </script>
</template>
