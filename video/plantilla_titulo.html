<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Título animado</title>
<style>
  @font-face { font-family: Titular; font-weight: 900; src: local("Inter Display Black"), local("InterDisplay-Black"), local("Inter Black"); }
  @font-face { font-family: Texto; font-weight: 500; src: local("Inter Medium"), local("Inter-Medium"); }
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script>
/*
 * Plantilla de título animado para intros y capítulos. Es el contrato que usa
 * video/renderizar_canvas.mjs: window.listo y window.cuadro(t).
 *
 * Parámetros de la URL (todos opcionales):
 *   titulo, subtitulo, fondo (#hex), acento (#hex), duracion (s), w, h
 *   t=2.5 congela ese instante; sin «render» se reproduce en bucle.
 *
 * Todo depende solo de t: dibujar(t) no guarda estado entre cuadros.
 */
const p = new URLSearchParams(location.search);
const W = Number(p.get('w')) || 1920;
const H = Number(p.get('h')) || 1080;
const DURACION = Number(p.get('duracion')) || 5;
const TITULO = (p.get('titulo') || 'EL FARO').toUpperCase();
const SUBTITULO = p.get('subtitulo') || 'Capítulo 1';
const FONDO = p.get('fondo') || '#101820';
const ACENTO = p.get('acento') || '#F2A541';
const CLARO = '#F4EFE8';
const TITULAR = 'Titular, "Inter Display", Inter, system-ui, sans-serif';
const TEXTO = 'Texto, Inter, system-ui, sans-serif';

const lienzo = document.getElementById('lienzo');
lienzo.width = W;
lienzo.height = H;
const ctx = lienzo.getContext('2d');
const u = Math.min(W, H) / 1080;
const cx = W / 2, cy = H / 2;

// ---------- Curvas ----------
const recortar = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const tramo = (t, a, b) => recortar((t - a) / (b - a));
const mezclar = (a, b, k) => a + (b - a) * k;
const salidaCubica = k => 1 - (1 - k) ** 3;
const entradaCubica = k => k ** 3;
const suaveCubica = k => (k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2);
const salidaExpo = k => (k === 1 ? 1 : 1 - 2 ** (-10 * k));
const salidaRebote = (k, s = 1.70158) => 1 + (s + 1) * (k - 1) ** 3 + s * (k - 1) ** 2;

function semilla(n) {
  return () => {
    n = (n + 0x6d2b79f5) | 0;
    let t = Math.imul(n ^ (n >>> 15), 1 | n);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// x de cada letra respetando el kerning: lo que mide el texto hasta ella.
function posicionesLetras(texto, tracking) {
  const xs = [];
  for (let i = 0; i < texto.length; i++) xs.push(ctx.measureText(texto.slice(0, i)).width + i * tracking);
  return { xs, ancho: ctx.measureText(texto).width + (texto.length - 1) * tracking };
}

// Letras que suben desde detrás del renglón, una tras otra.
function textoCinetico(t, texto, tam, y, entra, color) {
  ctx.font = `900 ${tam}px ${TITULAR}`;
  const tracking = tam * 0.02;
  const { xs, ancho } = posicionesLetras(texto, tracking);
  const x0 = cx - ancho / 2;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, y - tam * 0.98, W, tam * 1.24);
  ctx.clip();
  ctx.fillStyle = color;
  for (let i = 0; i < texto.length; i++) {
    const k = salidaRebote(tramo(t, entra + i * 0.035, entra + i * 0.035 + 0.45), 1.2);
    if (k > 0) ctx.fillText(texto[i], x0 + xs[i], y + (1 - k) * tam * 1.05);
  }
  ctx.restore();
  return ancho;
}

const azar = semilla(3);
const motas = Array.from({ length: 40 }, () => ({ x: azar(), y: azar(), r: 1 + azar() * 3, v: 10 + azar() * 30, f: azar() * 6.28 }));

let tamTitulo = 0;
function preparar() {
  ctx.font = `900 100px ${TITULAR}`;
  tamTitulo = Math.min(200 * u, (0.8 * W) / (posicionesLetras(TITULO, 2).ancho / 100));
}

function dibujar(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  // Fondo con un leve degradado radial y motas que suben despacio.
  const fondo = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(W, H) / 2);
  fondo.addColorStop(0, FONDO);
  fondo.addColorStop(1, '#000000');
  ctx.fillStyle = FONDO;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.65;
  ctx.fillStyle = fondo;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.35 * tramo(t, 0, 1);
  ctx.fillStyle = CLARO;
  for (const m of motas) {
    const y = ((m.y * H - t * m.v * u) % H + H) % H;
    ctx.beginPath();
    ctx.arc(m.x * W + Math.sin(t + m.f) * 8 * u, y, m.r * u, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Acercamiento lento de cámara para que nada quede quieto.
  const zoom = 1 + 0.04 * suaveCubica(tramo(t, 0, DURACION));
  ctx.translate(cx, cy);
  ctx.scale(zoom, zoom);
  ctx.translate(-cx, -cy);

  // Aro de acento que se abre detrás del título.
  const kAro = salidaExpo(tramo(t, 0.1, 1.2));
  ctx.beginPath();
  ctx.arc(cx, cy - tamTitulo * 0.3, mezclar(0, Math.min(W, H) * 0.42, kAro), 0, Math.PI * 2);
  ctx.lineWidth = 6 * u * (1 - 0.6 * kAro);
  ctx.strokeStyle = ACENTO;
  ctx.globalAlpha = 0.9 - 0.6 * kAro;
  ctx.stroke();
  ctx.globalAlpha = 1;

  const yTitulo = cy + tamTitulo * 0.2;
  const ancho = textoCinetico(t, TITULO, tamTitulo, yTitulo, 0.35, CLARO);

  // Subrayado que crece desde el centro.
  const kLinea = salidaExpo(tramo(t, 0.9, 1.6));
  ctx.fillStyle = ACENTO;
  ctx.fillRect(cx - (ancho / 2) * kLinea, yTitulo + tamTitulo * 0.16, ancho * kLinea, Math.max(6 * u, tamTitulo * 0.04));

  // Subtítulo.
  const kSub = salidaCubica(tramo(t, 1.2, 1.8));
  ctx.font = `500 ${Math.round(tamTitulo * 0.24)}px ${TEXTO}`;
  ctx.textAlign = 'center';
  ctx.fillStyle = CLARO;
  ctx.globalAlpha = kSub * 0.85;
  ctx.fillText(SUBTITULO, cx, yTitulo + tamTitulo * 0.55 + (1 - kSub) * 20 * u);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;

  // Fundido a negro al final, para encadenar con la escena siguiente.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = entradaCubica(tramo(t, DURACION - 0.6, DURACION));
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

window.listo = Promise.all([
  document.fonts.load(`900 100px ${TITULAR}`),
  document.fonts.load(`500 100px ${TEXTO}`),
]).then(preparar);

window.cuadro = t => {
  dibujar(t);
  return lienzo.toDataURL('image/png');
};

window.listo.then(() => {
  if (p.has('render')) return;
  if (p.has('t')) return dibujar(Number(p.get('t')));
  const origen = performance.now();
  const bucle = ahora => {
    dibujar(((ahora - origen) / 1000) % (DURACION + 0.5));
    requestAnimationFrame(bucle);
  };
  requestAnimationFrame(bucle);
});
</script>
</body>
</html>
