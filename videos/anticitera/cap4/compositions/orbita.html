<template>
  <style>
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-500.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-600.woff2") format("woff2"); font-weight: 600; }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #orbita-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #orbita-svg .l { fill: none; stroke: #e8b66a; stroke-width: 2; }
    #orbita-svg .rotulo { font: 600 28px "Hanken Grotesk", sans-serif; letter-spacing: 0.3em; fill: #f3ede4; }
  </style>
  <div id="root" data-composition-id="orbita" data-width="1920" data-height="1080">
    <!-- La órbita de la Luna, con la excentricidad exagerada para que se vea: la Luna recorre la elipse según la
         ley de Kepler y deja una marca cada mismo intervalo de tiempo; las marcas se separan cerca de la Tierra
         (perigeo, donde va más deprisa) y se juntan lejos (apogeo). -->
    <svg id="orbita-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <path id="orbita-elipse" class="l" pathLength="100"/>
      <g id="orbita-marcas"></g>
      <circle id="orbita-tierra" r="22" style="fill:#f3ede4"/>
      <circle id="orbita-luna" r="13" style="fill:#e8b66a"/>
      <text id="orbita-peri" class="rotulo" text-anchor="middle">PERIGEO</text>
      <text id="orbita-apo" class="rotulo" text-anchor="middle">APOGEO</text>
    </svg>
  </div>
  <script>
    (function () {
      // Ayudas comunes de los gráficos (kit/ayuda.js, las inserta kit/montar.py). Todo es función del tiempo
      // local t: el mismo cuadro en cada render.
      const AY = {
        // Valor de una lista de claves [t, v, curva] (la curva va de la clave anterior a esta).
        valor(claves, t) {
          if (t <= claves[0][0]) return claves[0][1];
          for (let i = 1; i < claves.length; i++) {
            const [t1, v1, curva] = claves[i], [t0, v0] = claves[i - 1];
            if (t <= t1) return v0 + (v1 - v0) * gsap.parseEase(curva || "none")(t1 > t0 ? (t - t0) / (t1 - t0) : 1);
          }
          return claves[claves.length - 1][1];
        },
        // Avance 0 → 1 de algo que empieza en t0 y dura d, con su curva.
        paso(t, t0, d, curva) { return gsap.parseEase(curva || "power2.out")(Math.min(1, Math.max(0, (t - t0) / d))); },
        // Trazo que se dibuja (path con pathLength="100"): p de 0 a 1.
        trazo(el, p) { el.setAttribute("stroke-dasharray", "100 120"); el.setAttribute("stroke-dashoffset", (110 * (1 - p)).toFixed(2)); },
        // Entra con desenfoque y sale con fundido: opacidad y blur de un elemento entre a (entra) y s (sale).
        visible(el, t, a, s, max) {
          const e = AY.paso(t, a, 0.25, "power2.out"), f = 1 - AY.paso(t, s, 0.2, "power2.in");
          el.style.opacity = ((max == null ? 1 : max) * e * f).toFixed(3);
        },
        rad: (g) => (g * Math.PI) / 180,
        pol: (cx, cy, r, g) => [cx + r * Math.cos((g * Math.PI) / 180), cy + r * Math.sin((g * Math.PI) / 180)],
        circulo: (cx, cy, r) => `M${cx + r},${cy}a${r},${r} 0 1,0 ${-2 * r},0a${r},${r} 0 1,0 ${2 * r},0`,
        // Corona de dientes triangulares (n dientes, radio r) con la fase en grados.
        dientes(cx, cy, r, n, fase) {
          const alto = Math.min(14, (2 * r / n) * 1.1), pts = [];
          for (let k = 0; k < n; k++) {
            const a0 = AY.rad(fase) + (2 * Math.PI * k) / n, a1 = a0 + Math.PI / n;
            pts.push([r + alto / 2, a0], [r - alto / 2, a1]);
          }
          return "M" + pts.map(([q, a]) => `${(cx + q * Math.cos(a)).toFixed(1)},${(cy + q * Math.sin(a)).toFixed(1)}`).join("L") + "Z";
        },
        // De un punto de la plancha (u, v en fracciones del cuadro) a la pantalla, con el zoom y el paneo que la
        // plancha tiene en el instante tAbs del capítulo (sin el paralaje, que aquí es de unos pocos píxeles).
        enPantalla(u, v, tAbs) {
          const e = window.__planchasEstado ? window.__planchasEstado(tAbs) : { zoom: 1, panX: 0, panY: 0, centro: [0.5, 0.5] };
          return [((u - e.centro[0] - e.panX) * e.zoom + e.centro[0]) * 1920, ((v - e.centro[1] - e.panY) * e.zoom + e.centro[1]) * 1080, e.zoom];
        },
        // Cámara de un gráfico: el punto (x, y) queda en el centro de la pantalla con escala s.
        camara(el, s, x, y) { el.setAttribute("transform", `translate(960 540) scale(${s.toFixed(4)}) translate(${(-x).toFixed(2)} ${(-y).toFixed(2)})`); },
      };
      const T0 = 12.317;
      function alBuscar(dibujar) {
        window.addEventListener("hf-seek", (ev) => dibujar(ev.detail.time - T0));
        dibujar(0);
      }

      const $ = (s) => document.getElementById("orbita-" + s);
      const CX = 1180, CY = 560, A = 420, EXC = 0.62, B = A * Math.sqrt(1 - EXC * EXC), FX = CX - A * EXC;
      const W = { orbita: 1.690, elipse: 2.450, cerca: 4.390, deprisa: 6.050 };
      const P = 2 * (W.cerca + 0.1 - W.elipse);     // sale del apogeo en «elipse» y pasa por el perigeo en «cerca»
      const N = 20;                                  // marcas por vuelta, a intervalos iguales de tiempo
      $("elipse").setAttribute("d", `M${CX + A},${CY}a${A},${B} 0 1,0 ${-2 * A},0a${A},${B} 0 1,0 ${2 * A},0`);
      $("tierra").setAttribute("cx", FX); $("tierra").setAttribute("cy", CY);
      $("peri").setAttribute("x", CX - A - 34); $("peri").setAttribute("y", CY + 10); $("peri").setAttribute("text-anchor", "end");
      $("apo").setAttribute("x", CX + A + 34); $("apo").setAttribute("y", CY + 10); $("apo").setAttribute("text-anchor", "start");
      // Posición tras una fracción f de vuelta contada desde el apogeo (ecuación de Kepler por Newton).
      function pos(f) {
        const M = 2 * Math.PI * f + Math.PI;
        let E = M;
        for (let i = 0; i < 8; i++) E -= (E - EXC * Math.sin(E) - M) / (1 - EXC * Math.cos(E));
        return [CX - A * Math.cos(E), CY - B * Math.sin(E)];
      }
      const marcas = [];
      for (let k = 0; k <= N; k++) {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        const [x, y] = pos(k / N);
        c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.setAttribute("r", "5");
        c.setAttribute("style", "fill:#f3ede4");
        $("marcas").appendChild(c);
        marcas.push(c);
      }
      function dibujar(t) {
        AY.trazo($("elipse"), AY.paso(t, W.orbita - 0.3, 0.9, "power2.inOut"));
        $("tierra").style.opacity = AY.paso(t, W.orbita - 0.2, 0.4).toFixed(3);
        const f = Math.max(0, (t - W.elipse) / P);
        const [x, y] = pos(Math.min(f, 1.5));
        $("luna").setAttribute("cx", x.toFixed(1)); $("luna").setAttribute("cy", y.toFixed(1));
        $("luna").style.opacity = AY.paso(t, W.elipse - 0.3, 0.3).toFixed(3);
        marcas.forEach((c, k) => { c.style.opacity = (f >= k / N ? 0.75 * AY.paso(t, W.elipse + (k / N) * P, 0.15) : 0).toFixed(3); });
        $("peri").style.opacity = (0.85 * AY.paso(t, W.cerca - 0.2, 0.3)).toFixed(3);
        $("apo").style.opacity = (0.85 * AY.paso(t, W.elipse + 0.2, 0.3)).toFixed(3);
        $("svg").style.opacity = (1 - AY.paso(t, 7.196 - 0.25, 0.22, "power2.in")).toFixed(3);
      }
      alBuscar(dibujar);
      window.__timelines["orbita"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
