<template>
  <style>
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-500.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-600.woff2") format("woff2"); font-weight: 600; }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #perno-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #perno-svg .l { fill: none; stroke: #e8b66a; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    #perno-svg .tinta { fill: none; stroke: #f3ede4; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    #perno-svg .rotulo { font: 600 28px "Hanken Grotesk", sans-serif; letter-spacing: 0.24em; fill: #f3ede4; }
  </style>
  <div id="root" data-composition-id="perno" data-width="1920" data-height="1080">
    <!-- El perno y la ranura (reconstrucción de Freeth et al., 2006): dos ruedas iguales, la de abajo (tinta) y la
         de arriba (acento), con los ejes algo separados. Un perno de la primera entra en una ranura de la segunda:
         la de abajo gira a ritmo constante y la de arriba se adelanta y se retrasa ±6,5°, como la Luna. Al final
         el conjunto aparece montado sobre una rueda mayor que gira despacio (el giro del perigeo). -->
    <svg id="perno-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <g id="perno-cam">
        <g id="perno-e3"><path id="perno-e3d" class="tinta" pathLength="100"/><path id="perno-e3c" class="tinta" pathLength="100"/></g>
        <g id="perno-par">
          <path id="perno-k1" class="tinta" pathLength="100"/>
          <path id="perno-k2" class="l" pathLength="100"/>
          <path id="perno-ranura" class="l"/>
          <circle id="perno-perno" r="9" style="fill:#f3ede4"/>
          <path id="perno-fantasma" class="tinta" style="stroke-dasharray:6 10;opacity:0.5"/>
          <path id="perno-aguja" class="l" style="stroke-width:3"/>
          <path id="perno-arco" class="l" style="stroke-width:6;opacity:0.8"/>
          <circle id="perno-eje1" r="6" style="fill:#f3ede4"/><circle id="perno-eje2" r="6" style="fill:#e8b66a"/>
          <path id="perno-cota" class="l" style="stroke-width:1.5"/>
        </g>
        <text id="perno-mm" class="rotulo" text-anchor="middle">1,1 mm</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      // Ayudas comunes de los gráficos (kit/ayuda.js, las inserta kit/montar.py). Todo es función del tiempo
      // local t: el mismo cuadro en cada render.
      const AY = {
        // Valor de una lista de claves [t, v, curva] (la curva va de la clave anterior a esta).
        valor(claves, t) {
          if (t <= claves[0][0]) return claves[0][1];
          for (let i = 1; i < claves.length; i++) {
            const [t1, v1, curva] = claves[i], [t0, v0] = claves[i - 1];
            if (t <= t1) return v0 + (v1 - v0) * gsap.parseEase(curva || "none")(t1 > t0 ? (t - t0) / (t1 - t0) : 1);
          }
          return claves[claves.length - 1][1];
        },
        // Avance 0 → 1 de algo que empieza en t0 y dura d, con su curva.
        paso(t, t0, d, curva) { return gsap.parseEase(curva || "power2.out")(Math.min(1, Math.max(0, (t - t0) / d))); },
        // Trazo que se dibuja (path con pathLength="100"): p de 0 a 1.
        trazo(el, p) { el.setAttribute("stroke-dasharray", "100 120"); el.setAttribute("stroke-dashoffset", (110 * (1 - p)).toFixed(2)); },
        // Entra con desenfoque y sale con fundido: opacidad y blur de un elemento entre a (entra) y s (sale).
        visible(el, t, a, s, max) {
          const e = AY.paso(t, a, 0.25, "power2.out"), f = 1 - AY.paso(t, s, 0.2, "power2.in");
          el.style.opacity = ((max == null ? 1 : max) * e * f).toFixed(3);
        },
        rad: (g) => (g * Math.PI) / 180,
        pol: (cx, cy, r, g) => [cx + r * Math.cos((g * Math.PI) / 180), cy + r * Math.sin((g * Math.PI) / 180)],
        circulo: (cx, cy, r) => `M${cx + r},${cy}a${r},${r} 0 1,0 ${-2 * r},0a${r},${r} 0 1,0 ${2 * r},0`,
        // Corona de dientes triangulares (n dientes, radio r) con la fase en grados.
        dientes(cx, cy, r, n, fase) {
          const alto = Math.min(14, (2 * r / n) * 1.1), pts = [];
          for (let k = 0; k < n; k++) {
            const a0 = AY.rad(fase) + (2 * Math.PI * k) / n, a1 = a0 + Math.PI / n;
            pts.push([r + alto / 2, a0], [r - alto / 2, a1]);
          }
          return "M" + pts.map(([q, a]) => `${(cx + q * Math.cos(a)).toFixed(1)},${(cy + q * Math.sin(a)).toFixed(1)}`).join("L") + "Z";
        },
        // De un punto de la plancha (u, v en fracciones del cuadro) a la pantalla, con el zoom y el paneo que la
        // plancha tiene en el instante tAbs del capítulo (sin el paralaje, que aquí es de unos pocos píxeles).
        enPantalla(u, v, tAbs) {
          const e = window.__planchasEstado ? window.__planchasEstado(tAbs) : { zoom: 1, panX: 0, panY: 0, centro: [0.5, 0.5] };
          return [((u - e.centro[0] - e.panX) * e.zoom + e.centro[0]) * 1920, ((v - e.centro[1] - e.panY) * e.zoom + e.centro[1]) * 1080, e.zoom];
        },
        // Cámara de un gráfico: el punto (x, y) queda en el centro de la pantalla con escala s.
        camara(el, s, x, y) { el.setAttribute("transform", `translate(960 540) scale(${s.toFixed(4)}) translate(${(-x).toFixed(2)} ${(-y).toFixed(2)})`); },
      };
      const T0 = 27.066;
      function alBuscar(dibujar) {
        window.addEventListener("hf-seek", (ev) => dibujar(ev.detail.time - T0));
        dibujar(0);
      }

      const $ = (s) => document.getElementById("perno-" + s);
      const W = { dos: 2.197, ejes: 5.257, milimetro: 6.817, perno: 7.958, ranura: 9.778,
        girar: 11.882, adelanta: 13.762, retrasa: 14.402, punto: 19.267,
        desplaza: 21.947, conjunto: 26.761, despacio: 29.561 };
      const C = [1200, 560];                       // centro del par (antes de montarlo en la rueda mayor)
      const R = 230, NK = 50, RP = 150;            // radio de las ruedas, sus dientes y el radio del perno
      const D = RP * Math.sin(AY.rad(6.5));        // separación de ejes que da ±6,5° (en el bronce, 1,1 mm)
      const E3 = [960, 560], RE3 = 520;            // la rueda mayor (e3, 223 dientes) sobre la que va montado
      const ORBITA = Math.hypot(C[0] - E3[0], C[1] - E3[1]);
      function dibujar(t) {
        // Giro de la rueda mayor (el perigeo que se desplaza): arrastra al par alrededor de su centro.
        const giro3 = AY.valor([[W.conjunto, 0], [W.conjunto + 30, 150]], t);
        const a3 = Math.atan2(C[1] - E3[1], C[0] - E3[0]) + AY.rad(giro3);
        const c1 = [E3[0] + ORBITA * Math.cos(a3), E3[1] + ORBITA * Math.sin(a3)];
        const c2 = [c1[0] + D * Math.cos(a3), c1[1] + D * Math.sin(a3)];
        // La rueda de abajo gira a ritmo constante; la de arriba sigue al perno por su ranura.
        const th1 = AY.valor([[W.girar, 0], [W.girar + 40, 40 * 52]], t) + giro3;
        const p = AY.pol(c1[0], c1[1], RP, th1);
        const th2 = (Math.atan2(p[1] - c2[1], p[0] - c2[0]) * 180) / Math.PI;
        $("k1").setAttribute("d", AY.dientes(c1[0], c1[1], R, NK, th1) + AY.circulo(c1[0], c1[1], R * 0.84));
        $("k2").setAttribute("d", AY.dientes(c2[0], c2[1], R - 16, NK, th2) + AY.circulo(c2[0], c2[1], R * 0.8));
        AY.trazo($("k1"), AY.paso(t, W.dos - 0.2, 0.9, "power2.inOut"));
        AY.trazo($("k2"), AY.paso(t, W.dos + 0.5, 0.9, "power2.inOut"));
        // La ranura (radial, en la de arriba) y el perno (en la de abajo).
        const [r0x, r0y] = AY.pol(c2[0], c2[1], RP - 34, th2), [r1x, r1y] = AY.pol(c2[0], c2[1], RP + 34, th2);
        const nx = -Math.sin(AY.rad(th2)) * 13, ny = Math.cos(AY.rad(th2)) * 13;
        $("ranura").setAttribute("d", `M${(r0x + nx).toFixed(1)},${(r0y + ny).toFixed(1)}L${(r1x + nx).toFixed(1)},${(r1y + ny).toFixed(1)}` +
          `A13,13 0 0,0 ${(r1x - nx).toFixed(1)},${(r1y - ny).toFixed(1)}L${(r0x - nx).toFixed(1)},${(r0y - ny).toFixed(1)}A13,13 0 0,0 ${(r0x + nx).toFixed(1)},${(r0y + ny).toFixed(1)}`);
        $("ranura").style.opacity = AY.paso(t, W.ranura - 0.2, 0.4).toFixed(3);
        $("perno").setAttribute("cx", p[0].toFixed(1)); $("perno").setAttribute("cy", p[1].toFixed(1));
        $("perno").style.opacity = AY.paso(t, W.perno - 0.1, 0.3).toFixed(3);
        // Ejes, y la cota entre ellos.
        $("eje1").setAttribute("cx", c1[0]); $("eje1").setAttribute("cy", c1[1]);
        $("eje2").setAttribute("cx", c2[0]); $("eje2").setAttribute("cy", c2[1]);
        const pe = AY.paso(t, W.dos, 0.4);
        $("eje1").style.opacity = pe; $("eje2").style.opacity = AY.paso(t, W.dos + 0.7, 0.4);
        const cota = AY.paso(t, W.ejes + 0.3, 0.5, "power2.out") * (1 - AY.paso(t, W.perno - 0.4, 0.3, "power2.in"));
        $("cota").setAttribute("d", `M${c1[0]},${c1[1] - 30}L${c1[0]},${c1[1] - 46}M${c2[0]},${c2[1] - 30}L${c2[0]},${c2[1] - 46}M${c1[0]},${c1[1] - 38}L${c2[0]},${c2[1] - 38}`);
        $("cota").style.opacity = cota.toFixed(3);
        $("mm").setAttribute("x", ((c1[0] + c2[0]) / 2).toFixed(1)); $("mm").setAttribute("y", (c1[1] - 58).toFixed(1));
        $("mm").setAttribute("font-size", "16"); $("mm").style.opacity = cota.toFixed(3);
        // Agujas: la de arriba (acento) frente a la de ritmo constante (a trazos); el arco marca la diferencia.
        const pa = AY.paso(t, W.girar + 0.3, 0.5, "expo.out");
        const [ax, ay] = AY.pol(c2[0], c2[1], R + 60, th2), [fx, fy] = AY.pol(c1[0], c1[1], R + 60, th1);
        $("aguja").setAttribute("d", `M${c2[0]},${c2[1]}L${ax.toFixed(1)},${ay.toFixed(1)}`);
        $("fantasma").setAttribute("d", `M${c1[0]},${c1[1]}L${fx.toFixed(1)},${fy.toFixed(1)}`);
        $("aguja").style.opacity = pa; $("fantasma").style.opacity = 0.5 * pa;
        const ra = R + 40, [qx, qy] = AY.pol(c1[0], c1[1], ra, th1), [wx, wy] = AY.pol(c1[0], c1[1], ra, th2);
        const dif = ((th2 - th1 + 540) % 360) - 180;
        $("arco").setAttribute("d", `M${qx.toFixed(1)},${qy.toFixed(1)}A${ra},${ra} 0 0,${dif > 0 ? 1 : 0} ${wx.toFixed(1)},${wy.toFixed(1)}`);
        $("arco").style.opacity = (0.85 * AY.paso(t, W.adelanta - 0.2, 0.4)).toFixed(3);
        // La rueda mayor aparece cuando el conjunto se monta sobre ella.
        $("e3d").setAttribute("d", AY.dientes(E3[0], E3[1], RE3, 223, giro3));
        $("e3c").setAttribute("d", AY.circulo(E3[0], E3[1], RE3 - 22) + AY.circulo(E3[0], E3[1], 34));
        const p3 = AY.paso(t, W.desplaza + 0.2, 1.2, "power2.inOut");
        AY.trazo($("e3d"), p3); AY.trazo($("e3c"), p3);
        $("e3").style.opacity = (0.55 * Math.min(1, p3 * 3)).toFixed(3);
        // Cámara: de lejos al par; muy cerca de los ejes en «separados»; vuelta; y lejos para ver la rueda mayor.
        const s = AY.valor([[0, 0.95], [W.ejes - 0.1, 1.0, "sine.inOut"], [W.ejes + 0.6, 4.2, "power2.inOut"], [W.perno - 0.5, 4.2],
                             [W.perno + 0.4, 1.12, "power2.inOut"], [W.girar + 1, 1.15, "sine.inOut"], [W.desplaza, 1.15],
                             [W.desplaza + 1.4, 0.7, "power2.inOut"]], t);
        const mx = (c1[0] + c2[0]) / 2;
        const x = AY.valor([[0, 980], [W.ejes - 0.1, 980], [W.ejes + 0.6, mx, "power2.inOut"], [W.perno - 0.5, mx],
                             [W.perno + 0.4, 960, "power2.inOut"], [W.desplaza, 960], [W.desplaza + 1.4, 760, "power2.inOut"]], t);
        const y = AY.valor([[0, 560], [W.ejes - 0.1, 560], [W.ejes + 0.6, c1[1] - 30, "power2.inOut"], [W.perno - 0.5, c1[1] - 30],
                             [W.perno + 0.4, 560, "power2.inOut"]], t);
        AY.camara($("cam"), s, x, y);
        $("svg").style.opacity = (1 - AY.paso(t, 30.890 - 0.25, 0.22, "power2.in")).toFixed(3);
      }
      alBuscar(dibujar);
      window.__timelines["perno"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
