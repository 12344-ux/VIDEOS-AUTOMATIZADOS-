<template>
  <style>
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-500.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-600.woff2") format("woff2"); font-weight: 600; }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #frente-b-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #frente-b-svg .l { fill: none; stroke: #e8b66a; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    #frente-b-svg .tinta { fill: none; stroke: #f3ede4; stroke-width: 1.6; stroke-linecap: round; }
    #frente-b-svg .rotulo { font: 600 28px "Hanken Grotesk", sans-serif; letter-spacing: 0.2em; fill: #f3ede4; }
  </style>
  <div id="root" data-composition-id="frente-b" data-width="1920" data-height="1080">
    <!-- El frente de la máquina (reconstrucción): la rueda mayor (223 dientes, una vuelta al año), el anillo del
         zodíaco, el de los 365 días del calendario egipcio, las agujas del Sol y de la Luna, la esfera de las
         fases y la fila de agujeros bajo el anillo de los días. Todo se dibuja en función del tiempo. -->
    <svg id="frente-b-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs><path id="frente-b-zpath" d=""/></defs>
      <g id="frente-b-cam">
        <g id="frente-b-b1"><path id="frente-b-b1d" class="l" pathLength="100"/><path id="frente-b-b1c" class="l" pathLength="100"/></g>
        <path id="frente-b-zod" class="l" pathLength="100"/>
        <path id="frente-b-zdiv" class="tinta" pathLength="100"/>
        <g id="frente-b-zlab"></g>
        <path id="frente-b-cal" class="l" pathLength="100"/>
        <path id="frente-b-ticks" class="tinta" pathLength="100"/>
        <path id="frente-b-agujeros" pathLength="100" style="fill:none;stroke:#e8b66a;stroke-width:4;stroke-linecap:round"/>
        <g id="frente-b-sol"><path id="frente-b-solp" class="l" pathLength="100"/><circle id="frente-b-sold" r="13" style="fill:#e8b66a"/></g>
        <g id="frente-b-luna"><path id="frente-b-lunap" class="tinta" pathLength="100"/>
          <circle id="frente-b-bola" r="30" style="fill:#0d1114;stroke:#f3ede4;stroke-width:1.6"/>
          <path id="frente-b-luz" style="fill:#f3ede4"/></g>
        <circle id="frente-b-eje" cx="1260" cy="540" r="7" style="fill:#e8b66a"/>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      // Ayudas comunes de los gráficos (kit/ayuda.js, las inserta kit/montar.py). Todo es función del tiempo
      // local t: el mismo cuadro en cada render.
      const AY = {
        // Valor de una lista de claves [t, v, curva] (la curva va de la clave anterior a esta).
        valor(claves, t) {
          if (t <= claves[0][0]) return claves[0][1];
          for (let i = 1; i < claves.length; i++) {
            const [t1, v1, curva] = claves[i], [t0, v0] = claves[i - 1];
            if (t <= t1) return v0 + (v1 - v0) * gsap.parseEase(curva || "none")(t1 > t0 ? (t - t0) / (t1 - t0) : 1);
          }
          return claves[claves.length - 1][1];
        },
        // Avance 0 → 1 de algo que empieza en t0 y dura d, con su curva.
        paso(t, t0, d, curva) { return gsap.parseEase(curva || "power2.out")(Math.min(1, Math.max(0, (t - t0) / d))); },
        // Trazo que se dibuja (path con pathLength="100"): p de 0 a 1.
        trazo(el, p) { el.setAttribute("stroke-dasharray", "100 120"); el.setAttribute("stroke-dashoffset", (110 * (1 - p)).toFixed(2)); },
        // Entra con desenfoque y sale con fundido: opacidad y blur de un elemento entre a (entra) y s (sale).
        visible(el, t, a, s, max) {
          const e = AY.paso(t, a, 0.25, "power2.out"), f = 1 - AY.paso(t, s, 0.2, "power2.in");
          el.style.opacity = ((max == null ? 1 : max) * e * f).toFixed(3);
        },
        rad: (g) => (g * Math.PI) / 180,
        pol: (cx, cy, r, g) => [cx + r * Math.cos((g * Math.PI) / 180), cy + r * Math.sin((g * Math.PI) / 180)],
        circulo: (cx, cy, r) => `M${cx + r},${cy}a${r},${r} 0 1,0 ${-2 * r},0a${r},${r} 0 1,0 ${2 * r},0`,
        // Corona de dientes triangulares (n dientes, radio r) con la fase en grados.
        dientes(cx, cy, r, n, fase) {
          const alto = Math.min(14, (2 * r / n) * 1.1), pts = [];
          for (let k = 0; k < n; k++) {
            const a0 = AY.rad(fase) + (2 * Math.PI * k) / n, a1 = a0 + Math.PI / n;
            pts.push([r + alto / 2, a0], [r - alto / 2, a1]);
          }
          return "M" + pts.map(([q, a]) => `${(cx + q * Math.cos(a)).toFixed(1)},${(cy + q * Math.sin(a)).toFixed(1)}`).join("L") + "Z";
        },
        // De un punto de la plancha (u, v en fracciones del cuadro) a la pantalla, con el zoom y el paneo que la
        // plancha tiene en el instante tAbs del capítulo (sin el paralaje, que aquí es de unos pocos píxeles).
        enPantalla(u, v, tAbs) {
          const e = window.__planchasEstado ? window.__planchasEstado(tAbs) : { zoom: 1, panX: 0, panY: 0, centro: [0.5, 0.5] };
          return [((u - e.centro[0] - e.panX) * e.zoom + e.centro[0]) * 1920, ((v - e.centro[1] - e.panY) * e.zoom + e.centro[1]) * 1080, e.zoom];
        },
        // Cámara de un gráfico: el punto (x, y) queda en el centro de la pantalla con escala s.
        camara(el, s, x, y) { el.setAttribute("transform", `translate(960 540) scale(${s.toFixed(4)}) translate(${(-x).toFixed(2)} ${(-y).toFixed(2)})`); },
      };
      const T0 = 32.703;
      function alBuscar(dibujar) {
        window.addEventListener("hf-seek", (ev) => dibujar(ev.detail.time - T0));
        dibujar(0);
      }

      const $ = (s) => document.getElementById("frente-b-" + s);
      const CX = 1260, CY = 540;
      // Anclas en la voz (segundos locales).
      const W = { gira: -22.095, vuelta: -20.048, ano: -18.528, frente: -17.021, zod: -13.581,
        cal: -11.861, dias: -9.741, sol: -5.609, luna: -4.295, esfera: -3.020, giraf: -0.500,
        crec: 1.400, llena: 2.060, meng: 2.820, nueva: 3.520, debajo: 4.933,
        agujeros: 7.613, volv: 9.256 };
      const MODO = "b";   // "a": la rueda y los anillos; "b": las fases y los agujeros

      // Geometría fija.
      const circ = AY.circulo;
      $("b1c").setAttribute("d", circ(CX, CY, 300) + circ(CX, CY, 40) + [0, 90, 180, 270].map((g) => {
        const [x0, y0] = AY.pol(CX, CY, 40, g), [x1, y1] = AY.pol(CX, CY, 300, g);
        return `M${x0.toFixed(1)},${y0.toFixed(1)}L${x1.toFixed(1)},${y1.toFixed(1)}`;
      }).join(""));
      $("zod").setAttribute("d", circ(CX, CY, 300) + circ(CX, CY, 352));
      let zd = "";
      for (let k = 0; k < 12; k++) {
        const [x0, y0] = AY.pol(CX, CY, 300, k * 30 - 90), [x1, y1] = AY.pol(CX, CY, 352, k * 30 - 90);
        zd += `M${x0.toFixed(1)},${y0.toFixed(1)}L${x1.toFixed(1)},${y1.toFixed(1)}`;
      }
      $("zdiv").setAttribute("d", zd);
      // Rótulos del zodíaco en su anillo (abreviados, como en el bronce, de Aries en adelante).
      $("zpath").setAttribute("d", `M${CX},${CY - 316}a316,316 0 1,1 -0.1,0`);  // radio: la línea base de los rótulos
      const SIGNOS = ["ARI", "TAU", "GÉM", "CÁN", "LEO", "VIR", "LIB", "ESC", "SAG", "CAP", "ACU", "PIS"];
      // Un rótulo centrado en cada sector (el camino empieza arriba y gira como el reloj).
      SIGNOS.forEach((s, k) => {
        const tx = document.createElementNS("http://www.w3.org/2000/svg", "text");
        tx.setAttribute("class", "rotulo");
        tx.setAttribute("text-anchor", "middle");
        const tp = document.createElementNS("http://www.w3.org/2000/svg", "textPath");
        tp.setAttribute("href", "#frente-b-zpath");
        tp.setAttribute("startOffset", (((k * 30 + 15) / 360) * 100).toFixed(3) + "%");
        tp.textContent = s;
        tx.appendChild(tp);
        $("zlab").appendChild(tx);
      });
      $("cal").setAttribute("d", circ(CX, CY, 362) + circ(CX, CY, 410));
      let td = "", ad = "";
      for (let k = 0; k < 365; k++) {
        const g = (k * 360) / 365 - 90, largo = k % 5 === 0 ? 20 : 10;
        const [x0, y0] = AY.pol(CX, CY, 362, g), [x1, y1] = AY.pol(CX, CY, 362 + largo, g);
        td += `M${x0.toFixed(1)},${y0.toFixed(1)}L${x1.toFixed(1)},${y1.toFixed(1)}`;
        const [hx, hy] = AY.pol(CX, CY, 396, g);
        ad += `M${hx.toFixed(1)},${hy.toFixed(1)}l0.01,0`;
      }
      $("ticks").setAttribute("d", td);
      $("agujeros").setAttribute("d", ad);

      // Fase de la Luna: la parte iluminada de la esfera según su distancia al Sol (e, en grados).
      function luz(x, y, r, e) {
        e = ((e % 360) + 360) % 360;
        const creciente = e < 180, k = Math.cos(AY.rad(e)), rx = Math.abs(r * k);
        const top = `${x},${y - r}`, bot = `${x},${y + r}`;
        if (creciente) return `M${top}A${r},${r} 0 0,1 ${bot}A${rx},${r} 0 0,${k > 0 ? 0 : 1} ${top}Z`;
        return `M${top}A${r},${r} 0 0,0 ${bot}A${rx},${r} 0 0,${k > 0 ? 1 : 0} ${top}Z`;
      }

      function dibujar(t) {
        // La rueda mayor: se dibuja, da una vuelta entera (un año) y queda al fondo cuando llega el frente.
        const giro = AY.valor([[W.gira - 0.3, 0], [W.vuelta, 18, "sine.inOut"], [W.ano + 0.7, 378, "power2.inOut"], [W.ano + 40, 378 + 160]], t);
        $("b1d").setAttribute("d", AY.dientes(CX, CY, 330, 223, giro));
        $("b1c").setAttribute("transform", `rotate(${giro.toFixed(2)} ${CX} ${CY})`);
        const pb = MODO === "a" ? AY.paso(t, W.gira - 0.25, 1.0, "power2.inOut") : 1;
        AY.trazo($("b1d"), pb); AY.trazo($("b1c"), pb);
        $("b1").style.opacity = (0.92 - 0.76 * AY.paso(t, W.frente, 0.9, "power2.inOut")).toFixed(3);
        // Los dos anillos.
        const pz = MODO === "a" ? AY.paso(t, W.frente - 0.1, 0.9, "power2.inOut") : 1;
        AY.trazo($("zod"), pz); AY.trazo($("cal"), pz);
        AY.trazo($("zdiv"), MODO === "a" ? AY.paso(t, W.zod - 0.8, 0.8, "power2.out") : 1);
        $("zlab").style.opacity = (MODO === "a" ? AY.paso(t, W.zod - 0.5, 0.7, "power1.out") : 1) * 0.9;
        AY.trazo($("ticks"), MODO === "a" ? AY.paso(t, W.cal - 0.1, W.dias - W.cal + 0.3, "power1.inOut") : 1);
        // Bajo el anillo de los días: el anillo se aparta y aparece la fila de agujeros.
        const pa = AY.paso(t, W.debajo, 0.8, "power2.inOut");
        $("ticks").style.opacity = (1 - 0.7 * pa).toFixed(3);
        $("cal").style.opacity = (1 - 0.6 * pa).toFixed(3);
        AY.trazo($("agujeros"), AY.paso(t, W.agujeros - 0.35, 1.3, "power1.inOut"));
        // Agujas: el Sol y la Luna; la Luna da una vuelta respecto al Sol con las fases que nombra la voz.
        const e = AY.valor([[W.luna, 40], [W.giraf, 48], [W.crec, 90, "power1.inOut"], [W.llena, 180, "power1.inOut"],
                            [W.meng, 270, "power1.inOut"], [W.nueva + 0.1, 360, "power1.inOut"]], t);
        const sol = -64 + (e - 40) / 12.4, luna = sol + e;
        const [sx, sy] = AY.pol(CX, CY, 350, sol), [dx, dy] = AY.pol(CX, CY, 330, sol);
        $("solp").setAttribute("d", `M${CX},${CY}L${sx.toFixed(1)},${sy.toFixed(1)}`);
        $("sold").setAttribute("cx", dx.toFixed(1)); $("sold").setAttribute("cy", dy.toFixed(1));
        const ps = MODO === "a" ? AY.paso(t, W.sol - 0.2, 0.6, "expo.out") : 1;
        AY.trazo($("solp"), ps); $("sold").style.opacity = ps.toFixed(3);
        const [lx, ly] = AY.pol(CX, CY, 300, luna), [bx, by] = AY.pol(CX, CY, 262, luna);
        $("lunap").setAttribute("d", `M${CX},${CY}L${lx.toFixed(1)},${ly.toFixed(1)}`);
        $("bola").setAttribute("cx", bx.toFixed(1)); $("bola").setAttribute("cy", by.toFixed(1));
        $("luz").setAttribute("d", luz(bx, by, 30, e));
        const pl = MODO === "a" ? AY.paso(t, W.luna - 0.2, 0.6, "expo.out") : 1;
        AY.trazo($("lunap"), pl);
        const pe = MODO === "a" ? AY.paso(t, W.esfera - 0.3, 0.4, "power2.out") : 1;
        $("bola").style.opacity = pe.toFixed(3); $("luz").style.opacity = pe.toFixed(3);
        $("eje").style.opacity = Math.max(ps, pl).toFixed(3);
        // Cámara: en «a» se acerca poco a poco; en «b» empieza cerca de la esfera y se aleja hasta los agujeros.
        let cam;
        if (MODO === "a") cam = [AY.valor([[W.gira, 0.9], [W.frente, 0.96, "sine.inOut"], [W.dias, 1.0, "sine.inOut"], [W.sol, 1.0], [W.luna + 1.2, 1.16, "power2.inOut"]], t),
          AY.valor([[W.gira, 1040], [W.sol, 1040], [W.luna + 1.2, 1150, "power2.inOut"]], t), 540];
        else cam = [AY.valor([[0, 1.62], [W.nueva + 0.6, 1.5, "sine.inOut"], [W.debajo + 1.2, 1.0, "power2.inOut"], [W.volv + 1.5, 1.06, "sine.inOut"]], t),
          AY.valor([[0, 1235], [W.nueva + 0.6, 1235], [W.debajo + 1.2, 1040, "power2.inOut"]], t), 540];
        AY.camara($("cam"), cam[0], cam[1], cam[2]);
        $("svg").style.opacity = (1 - AY.paso(t, 10.936 - 0.25, 0.22, "power2.in")).toFixed(3);
      }
      alBuscar(dibujar);
      window.__timelines["frente-b"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
