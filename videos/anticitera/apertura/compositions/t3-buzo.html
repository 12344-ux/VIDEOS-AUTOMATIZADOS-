<template>
  <style>
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-600.woff2") format("woff2"); font-weight: 600; }
    #root { position: absolute; inset: 0; }
    #t3-bloque { position: absolute; left: 150px; top: 330px; color: var(--color-ink, #f3ede4); }
    #t3-etiqueta { display: flex; align-items: center; gap: 22px; font: 600 28px/1 "Hanken Grotesk", sans-serif;
      letter-spacing: 0.32em; color: var(--color-accent, #e8b66a); }
    #t3-linea { display: block; width: 72px; height: 2px; background: var(--color-accent, #e8b66a); transform-origin: left center; }
    #t3-etiqueta span { display: inline-block; }
    #t3-cifra { margin: 14px 0 0 -10px; display: flex; align-items: baseline; gap: 18px;
      font: 500 236px/0.9 "Cormorant Garamond", serif; font-variant-numeric: lining-nums tabular-nums;
      text-shadow: 0 6px 40px rgba(0, 0, 0, 0.45); }
    #t3-unidad { font: italic 500 120px/1 "Cormorant Garamond", serif; }
  </style>
  <div id="root" data-composition-id="t3" data-width="1920" data-height="1080">
    <div id="t3-bloque">
      <div id="t3-etiqueta" data-layout-ignore>
        <i id="t3-linea"></i>
        <span>P</span><span>R</span><span>O</span><span>F</span><span>U</span><span>N</span><span>D</span><span>I</span><span>D</span><span>A</span><span>D</span>
      </div>
      <div id="t3-cifra"><span id="t3-numero">0</span><span id="t3-unidad">m</span></div>
    </div>
  </div>
  <script>
    (function () {
      // Tiempos locales: la escena empieza en 13,8 s. Voz (absolutos): «baja» 13,77; «metros» 15,11.
      const tl = gsap.timeline({ paused: true });
      const T = (absoluto) => absoluto - 13.8;
      tl.fromTo("#t3-linea", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, T(13.95));
      tl.fromTo("#t3-etiqueta span", { opacity: 0, filter: "blur(4px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: 0.035 }, T(14.0));
      tl.fromTo("#t3-cifra", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, T(14.0));
      // Contador de 1,3 s que frena y aterriza en 45 con «metros».
      const numero = document.getElementById("t3-numero");
      const cuenta = { m: 0 };
      tl.fromTo(cuenta, { m: 0 }, {
        m: 45, duration: 1.3, ease: "power2.out",
        onUpdate: () => { numero.textContent = String(Math.round(cuenta.m)); },
      }, T(13.85));
      // Se apaga con la luz al llegar al fondo.
      tl.to("#t3-bloque", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, T(15.95));
      window.__timelines["t3"] = tl;
    })();
  </script>
</template>
