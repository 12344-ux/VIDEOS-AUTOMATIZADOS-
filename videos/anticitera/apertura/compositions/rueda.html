<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    /* La capa va a la escala de la plancha: los contornos salen de la propia imagen (videos/anticitera/
       lineas_rueda.py), así que el zoom y el centro tienen que ser los de la toma «fragmento» de planchas.html. */
    #rueda-capa { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 1403px 502px; }
    #rueda-lineas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #rueda-revelado { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; clip-path: inset(0 100% 0 0); }
    /* La línea del escáner: un trazo fino con una estela tenue, a la altura de la rueda. */
    #rueda-escaner { position: absolute; top: 96px; height: 880px; width: 120px; left: 840px; }
    #rueda-escaner i { position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: #f6d79c; }
    #rueda-escaner b { position: absolute; right: 2px; top: 0; bottom: 0; width: 118px;
      background: linear-gradient(90deg, rgba(232, 182, 106, 0), rgba(232, 182, 106, 0.16)); }
  </style>
  <div id="root" data-composition-id="rueda" data-width="1920" data-height="1080" data-layout-allow-overflow>
    <div id="rueda-capa">
      <div id="rueda-revelado"><img id="rueda-lineas" src="assets/img/fragmento_lineas.png" alt=""></div>
      <div id="rueda-escaner"><b></b><i></i></div>
    </div>
  </div>
  <script>
    (function () {
      // Tiempos locales: la escena empieza en 21,5 s. Voz (absolutos): «Dentro» 23,94; «dentadas» 24,68.
      // El zoom copia las claves de la toma «fragmento»: 1,04 → 1,12 (power2.out) hasta 23,85; quieto;
      // 1,12 → 2,6 (power3.in) de 26,2 a 26,7 para atravesar el buje.
      const tl = gsap.timeline({ paused: true });
      const T = (absoluto) => absoluto - 21.5;
      tl.set("#rueda-capa", { scale: 1.04 }, 0);
      tl.to("#rueda-capa", { scale: 1.12, duration: 23.85 - 21.5, ease: "power2.out" }, 0);
      tl.to("#rueda-capa", { scale: 2.6, duration: 0.5, ease: "power3.in" }, T(26.2));
      // El escáner barre de izquierda a derecha y deja dibujada la rueda tras de sí.
      const X0 = 900, X1 = 1880;
      tl.fromTo("#rueda-escaner", { x: X0 - 960, opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, T(23.92));
      tl.to("#rueda-escaner", { x: X1 - 960, duration: 0.72, ease: "power2.inOut" }, T(23.95));
      tl.fromTo("#rueda-revelado", { clipPath: `inset(0 ${1920 - X0}px 0 0)` },
        { clipPath: `inset(0 ${1920 - X1}px 0 0)`, duration: 0.72, ease: "power2.inOut" }, T(23.95));
      tl.to("#rueda-escaner", { opacity: 0, duration: 0.18, ease: "power2.in" }, T(24.67));
      // Atravesando el buje, las líneas se van con el paso de la cámara.
      tl.to("#rueda-revelado", { opacity: 0, duration: 0.22, ease: "power2.in" }, T(26.48));
      window.__timelines["rueda"] = tl;
    })();
  </script>
</template>
