<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #{{id}}-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  </style>
  <div id="root" data-composition-id="{{id}}" data-width="1920" data-height="1080">
    <!-- Lo que se conserva: la máquina entera como un círculo; dos tercios a trazos (perdidos) y uno que se
         llena (los 82 fragmentos y sus 30 ruedas). Dentro del tercio, las 30 ruedas como puntos. -->
    <svg id="{{id}}-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <path id="{{id}}-perdido" pathLength="100" style="fill:none;stroke:#f3ede4;stroke-width:2;stroke-dasharray:4 12;opacity:0.5"/>
      <path id="{{id}}-sector" style="fill:#e8b66a;fill-opacity:0.18"/>
      <path id="{{id}}-borde" pathLength="100" style="fill:none;stroke:#e8b66a;stroke-width:2.5;stroke-linejoin:round"/>
      <g id="{{id}}-ruedas"></g>
    </svg>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const $ = (s) => document.getElementById("{{id}}-" + s);
      const CX = 1310, CY = 540, R = 330, A0 = -90, A1 = 30;      // el tercio va de las 12 a las 4
      const W = { son: {{w:Son}}, ruedas: {{w:treinta}}, tercio: {{w:tercio}} };
      const [x0, y0] = AY.pol(CX, CY, R, A0), [x1, y1] = AY.pol(CX, CY, R, A1);
      $("perdido").setAttribute("d", `M${x1.toFixed(1)},${y1.toFixed(1)}A${R},${R} 0 1,1 ${x0.toFixed(1)},${y0.toFixed(1)}`);
      const sector = `M${CX},${CY}L${x0.toFixed(1)},${y0.toFixed(1)}A${R},${R} 0 0,1 ${x1.toFixed(1)},${y1.toFixed(1)}Z`;
      $("sector").setAttribute("d", sector); $("borde").setAttribute("d", sector);
      // 30 ruedas repartidas por el tercio (posiciones fijas, sin azar).
      const ruedas = [];
      for (let k = 0; k < 30; k++) {
        const f = (k + 0.5) / 30, r = R * (0.28 + 0.62 * ((k * 7) % 10) / 10), g = A0 + 12 + (A1 - A0 - 24) * ((k * 0.618) % 1);
        const [x, y] = AY.pol(CX, CY, r, g), c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.setAttribute("r", String(5 + (k % 3) * 3));
        c.setAttribute("style", "fill:none;stroke:#e8b66a;stroke-width:1.6");
        $("ruedas").appendChild(c);
        ruedas.push([c, f]);
      }
      function dibujar(t) {
        AY.trazo($("perdido"), AY.paso(t, W.son - 0.3, 1.2, "power2.inOut"));
        AY.trazo($("borde"), AY.paso(t, W.son, 1.0, "power2.inOut"));
        $("sector").style.opacity = AY.paso(t, W.tercio - 0.1, 0.6, "power2.out").toFixed(3);
        ruedas.forEach(([c, f]) => { c.style.opacity = AY.paso(t, W.ruedas - 0.2 + f * 0.9, 0.2).toFixed(3); });
        $("svg").style.opacity = (1 - AY.paso(t, {{dur}} - 0.8, 0.7, "power2.in")).toFixed(3);
      }
      alBuscar(dibujar);
      window.__timelines["{{id}}"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
