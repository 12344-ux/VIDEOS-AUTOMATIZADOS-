<template>
  <style>
/*FUENTES*/
    #root { position: absolute; inset: 0; overflow: hidden; }
    #{{id}}-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #{{id}}-svg .rotulo { font: 600 28px "Hanken Grotesk", sans-serif; letter-spacing: 0.24em; fill: #f3ede4; }
  </style>
  <div id="root" data-composition-id="{{id}}" data-width="1920" data-height="1080">
    <!-- El frente según el modelo de la UCL (Freeth et al., 2021): anillos concéntricos en el orden del cosmos
         griego (Luna, Mercurio, Venus, Sol, Marte, Júpiter, Saturno), cada uno con su marcador. Los planetas
         avanzan y a ratos retroceden (un epiciclo simplificado); la leyenda, a la izquierda, con líneas guía. -->
    <svg id="{{id}}-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <g id="{{id}}-anillos"></g><g id="{{id}}-guias"></g><g id="{{id}}-nombres"></g><g id="{{id}}-marcas"></g>
    </svg>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const $ = (s) => document.getElementById("{{id}}-" + s);
      const NS = "http://www.w3.org/2000/svg";
      const W = { anillos: {{w:anillos}}, sol: {{w:Sol}}, marcador: {{w:marcador}}, girando: {{w:girando}} };
      const CX = 1280, CY = 560;
      // nombre, radio, velocidad media (°/s), amplitud y periodo del retroceso, ángulo inicial
      const P = [["LUNA", 70, 60, 0, 1, 20], ["MERCURIO", 125, 25, 20, 1.3, 140], ["VENUS", 180, 18, 18, 2.0, 250],
                 ["SOL", 235, 12, 0, 1, 330], ["MARTE", 290, 7, 10, 3.0, 60], ["JÚPITER", 345, 3, 5, 4.0, 190], ["SATURNO", 400, 1.5, 3, 5.0, 290]];
      const el = (tipo, attrs, padre) => { const e = document.createElementNS(NS, tipo); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };
      const filas = P.map(([n, r, w, a, per, g0], i) => {
        const sol = n === "SOL";
        const anillo = el("path", { d: AY.circulo(CX, CY, r), pathLength: 100,
          style: `fill:none;stroke:${sol ? "#e8b66a" : "#f3ede4"};stroke-width:${sol ? 2 : 1.4};opacity:${sol ? 0.9 : 0.55}` }, $("anillos"));
        const y = CY - r * 0.7, xr = CX - r * Math.sqrt(1 - 0.49);
        const yl = 250 + (6 - i) * 46;   // la leyenda en columna, de Saturno (arriba) a Luna: las guías no se cruzan
        const guia = el("path", { d: `M560,${yl - 9}L640,${yl - 9}L${xr.toFixed(1)},${y.toFixed(1)}`, pathLength: 100,
          style: "fill:none;stroke:#e8b66a;stroke-width: 2.2;opacity:0.7" }, $("guias"));
        const tx = el("text", { x: 545, y: yl, class: "rotulo", "text-anchor": "end" }, $("nombres"));
        tx.textContent = n;
        const marca = el("circle", { r: sol ? 14 : n === "LUNA" ? 10 : 8, style: sol ? "fill:#e8b66a" : "fill:#f3ede4" }, $("marcas"));
        return { anillo, guia, tx, marca, r, w, a, per, g0, i };
      });
      function dibujar(t) {
        const tau = Math.max(0, t - W.girando);
        filas.forEach((f) => {
          AY.trazo(f.anillo, AY.paso(t, W.anillos - 0.3 + f.i * 0.12, 0.9, "power2.inOut"));
          AY.trazo(f.guia, AY.paso(t, W.sol - 0.2 + f.i * 0.22, 0.5, "power2.out"));
          f.tx.style.opacity = AY.paso(t, W.sol + f.i * 0.22, 0.3).toFixed(3);
          const g = f.g0 + f.w * tau + f.a * Math.sin((2 * Math.PI * tau) / f.per);
          const [x, y] = AY.pol(CX, CY, f.r, g);
          f.marca.setAttribute("cx", x.toFixed(1)); f.marca.setAttribute("cy", y.toFixed(1));
          f.marca.style.opacity = AY.paso(t, W.marcador - 0.4 + f.i * 0.06, 0.3).toFixed(3);
        });
        $("svg").style.opacity = (1 - AY.paso(t, {{dur}} - 0.25, 0.22, "power2.in")).toFixed(3);
      }
      alBuscar(dibujar);
      window.__timelines["{{id}}"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
