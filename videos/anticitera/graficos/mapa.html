<template>
  <style>
/*FUENTES*/
    #root { position: absolute; inset: 0; overflow: hidden; }
    #{{id}}-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #{{id}}-svg .rotulo { font: 600 28px "Hanken Grotesk", sans-serif; letter-spacing: 0.24em; fill: #f3ede4; }
    #{{id}}-svg .sub { font: 500 24px "Hanken Grotesk", sans-serif; letter-spacing: 0.04em; fill: #e8b66a; }
  </style>
  <div id="root" data-composition-id="{{id}}" data-width="1920" data-height="1080">
    <!-- El Mediterráneo oriental: costas de Natural Earth (dominio público, graficos/datos/costa.txt, de mapa.py),
         que se descubren desde el primer punto; luego los lugares y las rutas, cada uno en la palabra que lo nombra.
         Proyección equirectangular: el cuadro a escala 1 va de 9° a 31° E. -->
    <svg id="{{id}}-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs><clipPath id="{{id}}-clip"><circle id="{{id}}-rev" cx="0" cy="0" r="0"/></clipPath></defs>
      <g id="{{id}}-cam">
        <path id="{{id}}-costa" clip-path="url(#{{id}}-clip)" style="fill:rgba(243,237,228,0.1);stroke:rgba(243,237,228,0.5);stroke-width:1.2;stroke-linejoin:round"
          d="/*DATOS:costa*/"/>
        <g id="{{id}}-arcos"></g>
        <g id="{{id}}-puntos"></g>
      </g>
    </svg>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const $ = (s) => document.getElementById("{{id}}-" + s);
      const NS = "http://www.w3.org/2000/svg";
      const PUNTOS = {{p:puntos}}, ARCOS = {{p:arcos}}, CAMARA = {{p:camara}}, REVELA = {{p:revela}};
      const el = (tipo, attrs, padre) => { const e = document.createElementNS(NS, tipo); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };
      // Los lugares: punto, anillo que se dibuja y su nombre (con una segunda línea en el acento).
      const P = PUNTOS.map((p) => {
        const g = el("g", {}, $("puntos"));
        const anillo = el("path", { d: AY.circulo(p.x, p.y, 15), pathLength: 100, style: "fill:none;stroke:#e8b66a;stroke-width:2" }, g);
        el("circle", { cx: p.x, cy: p.y, r: 6, style: "fill:#e8b66a" }, g);
        const dx = p.lado === "izq" ? -30 : 30, ancla = p.lado === "izq" ? "end" : "start";
        const dy = p.lado === "arr" ? -40 : p.lado === "aba" ? 52 : 10;
        const x = p.lado === "arr" || p.lado === "aba" ? p.x : p.x + dx, a2 = p.lado === "arr" || p.lado === "aba" ? "middle" : ancla;
        const t1 = el("text", { x, y: p.y + dy, class: "rotulo", "text-anchor": a2 }, g);
        t1.textContent = p.n;
        let t2 = null;
        if (p.s) { t2 = el("text", { x, y: p.y + dy + 34, class: "sub", "text-anchor": a2 }, g); t2.textContent = p.s; }
        return { g, anillo, t1, t2, t: p.t - T0 };
      });
      const A = ARCOS.map((a) => {
        const mx = (a.de[0] + a.a[0]) / 2, my = (a.de[1] + a.a[1]) / 2 - Math.hypot(a.a[0] - a.de[0], a.a[1] - a.de[1]) * 0.22;
        const c = el("path", { d: `M${a.de[0]},${a.de[1]}Q${mx.toFixed(1)},${my.toFixed(1)} ${a.a[0]},${a.a[1]}`, pathLength: 100,
          style: "fill:none;stroke:#e8b66a;stroke-width:2;stroke-linecap:round" }, $("arcos"));
        return { c, t: a.t - T0 };
      });
      $("rev").setAttribute("cx", REVELA.x); $("rev").setAttribute("cy", REVELA.y);
      function dibujar(t) {
        $("rev").setAttribute("r", (2300 * AY.paso(t, REVELA.t - T0, 1.6, "power2.inOut")).toFixed(1));
        P.forEach((p) => {
          AY.trazo(p.anillo, AY.paso(t, p.t - 0.05, 0.5, "expo.out"));
          p.g.style.opacity = AY.paso(t, p.t - 0.1, 0.2).toFixed(3);
          p.t1.style.opacity = AY.paso(t, p.t + 0.1, 0.25).toFixed(3);
          if (p.t2) p.t2.style.opacity = AY.paso(t, p.t + 0.35, 0.3).toFixed(3);
        });
        A.forEach((a) => AY.trazo(a.c, AY.paso(t, a.t, 0.9, "power2.inOut")));
        const k = CAMARA.map((c) => [c[0] - T0].concat(c.slice(1)));
        const cam = [1, 2, 3].map((i) => AY.valor(k.map((c) => [c[0], c[i], c[4]]), t));
        AY.camara($("cam"), cam[0], cam[1], cam[2]);
        $("svg").style.opacity = (1 - AY.paso(t, {{dur}} - 0.25, 0.22, "power2.in")).toFixed(3);
      }
      alBuscar(dibujar);
      window.__timelines["{{id}}"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
