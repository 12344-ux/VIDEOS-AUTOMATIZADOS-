<template>
  <style>
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-500.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/hanken-600.woff2") format("woff2"); font-weight: 600; }
    @font-face { font-family: "GFS Didot"; src: url("assets/fonts/didot-griego.woff2") format("woff2"); font-weight: 400; }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #inscripcion-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #inscripcion-svg .gr { font: 400 34px "GFS Didot", serif; letter-spacing: 0.08em; }
    #inscripcion-svg .tr { font: 500 46px "Hanken Grotesk", sans-serif; fill: #f3ede4; }
    #inscripcion-svg .gg { font: 400 64px "GFS Didot", serif; fill: #f3ede4; letter-spacing: 0.06em; }
  </style>
  <div id="root" data-composition-id="inscripcion" data-width="1920" data-height="1080">
    <!-- Letras griegas grabadas en el bronce que aparecen al pasar una luz rasante (como la técnica de 2005). El texto es
         ilustrativo: palabras de la astronomía griega (Sol, Luna, los planetas, meses, eclipse), no la inscripción real.
         Al final se destaca una palabra con su traducción. -->
    <svg id="inscripcion-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs>
        <linearGradient id="inscripcion-luz" x1="0" x2="1"><stop offset="0" stop-color="#ffe2a8" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#ffe2a8" stop-opacity="0.22"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></linearGradient>
        <clipPath id="inscripcion-clip"><rect id="inscripcion-ventana" x="0" y="0" width="0" height="1080"/></clipPath>
      </defs>
      <g id="inscripcion-cam"><g clip-path="url(#inscripcion-clip)"><g id="inscripcion-sombra" class="gr" style="fill:rgba(255,236,200,0.22)"></g><g id="inscripcion-filas" class="gr" style="fill:rgba(12,22,18,0.88)"></g></g>
      <rect id="inscripcion-haz" y="0" width="420" height="1080" fill="url(#inscripcion-luz)"/>
      <g id="inscripcion-dest"><rect id="inscripcion-marco" style="fill:none;stroke:#e8b66a;stroke-width:3.5" rx="6"/>
        <text id="inscripcion-gg" class="gg"></text><text id="inscripcion-tr" class="tr"></text></g></g>
    </svg>
  </div>
  <script>
    (function () {
      // Ayudas comunes de los gráficos (kit/ayuda.js, las inserta kit/montar.py). Todo es función del tiempo
      // local t: el mismo cuadro en cada render.
      const AY = {
        // Valor de una lista de claves [t, v, curva] (la curva va de la clave anterior a esta).
        valor(claves, t) {
          if (t <= claves[0][0]) return claves[0][1];
          for (let i = 1; i < claves.length; i++) {
            const [t1, v1, curva] = claves[i], [t0, v0] = claves[i - 1];
            if (t <= t1) return v0 + (v1 - v0) * gsap.parseEase(curva || "none")(t1 > t0 ? (t - t0) / (t1 - t0) : 1);
          }
          return claves[claves.length - 1][1];
        },
        // Avance 0 → 1 de algo que empieza en t0 y dura d, con su curva.
        paso(t, t0, d, curva) { return gsap.parseEase(curva || "power2.out")(Math.min(1, Math.max(0, (t - t0) / d))); },
        // Trazo que se dibuja (path con pathLength="100"): p de 0 a 1.
        trazo(el, p) { el.setAttribute("stroke-dasharray", "100 120"); el.setAttribute("stroke-dashoffset", (110 * (1 - p)).toFixed(2)); },
        // Entra con desenfoque y sale con fundido: opacidad y blur de un elemento entre a (entra) y s (sale).
        visible(el, t, a, s, max) {
          const e = AY.paso(t, a, 0.25, "power2.out"), f = 1 - AY.paso(t, s, 0.2, "power2.in");
          el.style.opacity = ((max == null ? 1 : max) * e * f).toFixed(3);
        },
        rad: (g) => (g * Math.PI) / 180,
        pol: (cx, cy, r, g) => [cx + r * Math.cos((g * Math.PI) / 180), cy + r * Math.sin((g * Math.PI) / 180)],
        circulo: (cx, cy, r) => `M${cx + r},${cy}a${r},${r} 0 1,0 ${-2 * r},0a${r},${r} 0 1,0 ${2 * r},0`,
        // Corona de dientes triangulares (n dientes, radio r) con la fase en grados.
        dientes(cx, cy, r, n, fase) {
          const alto = Math.min(14, (2 * r / n) * 1.1), pts = [];
          for (let k = 0; k < n; k++) {
            const a0 = AY.rad(fase) + (2 * Math.PI * k) / n, a1 = a0 + Math.PI / n;
            pts.push([r + alto / 2, a0], [r - alto / 2, a1]);
          }
          return "M" + pts.map(([q, a]) => `${(cx + q * Math.cos(a)).toFixed(1)},${(cy + q * Math.sin(a)).toFixed(1)}`).join("L") + "Z";
        },
        // De un punto de la plancha (u, v en fracciones del cuadro) a la pantalla, con el zoom y el paneo que la
        // plancha tiene en el instante tAbs del capítulo (sin el paralaje, que aquí es de unos pocos píxeles).
        enPantalla(u, v, tAbs) {
          const e = window.__planchasEstado ? window.__planchasEstado(tAbs) : { zoom: 1, panX: 0, panY: 0, centro: [0.5, 0.5] };
          return [((u - e.centro[0] - e.panX) * e.zoom + e.centro[0]) * 1920, ((v - e.centro[1] - e.panY) * e.zoom + e.centro[1]) * 1080, e.zoom];
        },
        // Cámara de un gráfico: el punto (x, y) queda en el centro de la pantalla con escala s.
        camara(el, s, x, y) { el.setAttribute("transform", `translate(960 540) scale(${s.toFixed(4)}) translate(${(-x).toFixed(2)} ${(-y).toFixed(2)})`); },
      };
      const T0 = 52.549;
      function alBuscar(dibujar) {
        window.addEventListener("hf-seek", (ev) => dibujar(ev.detail.time - T0));
        dibujar(0);
      }

      const $ = (s) => document.getElementById("inscripcion-" + s);
      const NS = "http://www.w3.org/2000/svg";
      const AREA = [160, 300, 1600, 680], T1 = 1.080, T2 = 4.260, SALE = 11.236, DEST = {"g": "\u0397\u039b\u0399\u039f\u03a3", "trad": "\u00abSol\u00bb", "x": 1180, "y": 560, "w": 330, "t": 59.595};
      const PALABRAS = ["ΗΛΙΟΣ", "ΣΕΛΗΝΗ", "ΑΦΡΟΔΙΤΗ", "ΕΡΜΗΣ", "ΑΡΗΣ", "ΖΕΥΣ", "ΚΡΟΝΟΣ", "ΖΩΙΔΙΑΚΟΣ", "ΜΗΝΕΣ",
        "ΕΤΗ", "ΚΥΚΛΟΣ", "ΑΣΤΕΡΕΣ", "ΕΚΛΕΙΨΙΣ", "ΗΜΕΡΑΙ", "ΣΦΑΙΡΑ", "ΧΡΟΝΟΣ", "ΠΛΑΝΗΤΑΙ", "ΓΝΩΜΩΝ", "ΚΑΙ", "ΤΟΥ", "ΤΗΣ"];
      // Filas de palabras (orden fijo, sin azar), recortadas al ancho del área.
      const [ax, ay, aw, ah] = AREA, alto = 52, filas = Math.floor(ah / alto);
      let k = 0;
      for (let f = 0; f < filas; f++) {
        let linea = "";
        while (linea.length < aw / 26) { linea += PALABRAS[(k * 7 + f * 3) % PALABRAS.length] + " "; k++; }
        for (const [g, dx] of [["sombra", 1.5], ["filas", 0]]) {
          const tx = document.createElementNS(NS, "text");
          tx.setAttribute("x", ax + dx); tx.setAttribute("y", ay + f * alto + dx);
          tx.setAttribute("textLength", aw); tx.setAttribute("lengthAdjust", "spacingAndGlyphs");
          tx.textContent = linea.trim();
          $(g).appendChild(tx);
        }
      }
      if (DEST) { $("gg").textContent = DEST.g; $("tr").textContent = DEST.trad; }
      function dibujar(t) {
        const [x0, y0, z] = AY.enPantalla(0, 0, t + T0);
        $("cam").setAttribute("transform", `translate(${x0.toFixed(1)} ${y0.toFixed(1)}) scale(${z.toFixed(4)})`);
        const p = AY.paso(t, T1, T2 - T1, "power1.inOut"), x = -420 + p * (1920 + 420);
        $("ventana").setAttribute("width", Math.max(0, x + 210).toFixed(1));
        $("haz").setAttribute("x", x.toFixed(1));
        $("haz").style.opacity = (AY.paso(t, T1 - 0.1, 0.2) * (1 - AY.paso(t, T2, 0.4))).toFixed(3);
        if (DEST) {
          const a = DEST.t - T0, pd = AY.paso(t, a, 0.5, "power2.out");
          $("marco").setAttribute("x", DEST.x - 20); $("marco").setAttribute("y", DEST.y - 70);
          $("marco").setAttribute("width", DEST.w); $("marco").setAttribute("height", 96);
          $("gg").setAttribute("x", DEST.x); $("gg").setAttribute("y", DEST.y);
          $("tr").setAttribute("x", DEST.x); $("tr").setAttribute("y", DEST.y + 90);
          $("dest").style.opacity = pd.toFixed(3);
          $("filas").style.opacity = (1 - 0.45 * pd).toFixed(3); $("sombra").style.opacity = (1 - 0.45 * pd).toFixed(3);
        } else $("dest").style.display = "none";
        $("svg").style.opacity = (1 - AY.paso(t, SALE, 0.25, "power2.in")).toFixed(3);
      }
      alBuscar(dibujar);
      window.__timelines["inscripcion"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
