<template>
  <!-- El encuentro visto desde arriba (recreación en esquema del relato de Fravor ante el Congreso, 2023): el caza baja en
       círculo en el sentido de las agujas del reloj; el objeto, sobre la mancha blanca, se alinea con él y sube girando
       por el lado contrario del círculo, como si lo imitara (de 0 a unos 3.700 m; el caza, de 6.100 a 4.600). «kilómetro»:
       el caza va a por él (800 m); «acelera»: el objeto sale disparado; «desaparece»: destello y ya no está. -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} .fondo { background: radial-gradient(ellipse at 50% 42%, #0d1c22 0%, #06090c 70%); }
    #{{ID}} .rej { background: repeating-linear-gradient(90deg, rgba(98, 245, 155, 0.06) 0 1px, rgba(0, 0, 0, 0) 1px 90px),
      repeating-linear-gradient(0deg, rgba(98, 245, 155, 0.06) 0 1px, rgba(0, 0, 0, 0) 1px 90px); }
    #{{ID}} .rec { position: absolute; left: 80px; top: 214px; font: 700 30px/1 "JetBrains Mono", monospace; letter-spacing: 0.08em;
      color: rgba(232, 238, 240, 0.6); }
    #{{ID}} .alt { position: absolute; left: 80px; top: 262px; font: 700 44px/1.3 "JetBrains Mono", monospace; color: #e8eef0; }
    #{{ID}} .alt .q { display: inline-block; width: 210px; color: rgba(232, 238, 240, 0.6); }
    #{{ID}} .alt .ob .q, #{{ID}} .alt .ob .v { color: #62f59b; }
    #{{ID}} svg.s { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    #{{ID}} .circ { fill: none; stroke: rgba(232, 238, 240, 0.28); stroke-width: 2.5; stroke-dasharray: 10 10; }
    #{{ID}} .agua { fill: url(#agua-{{ID}}); }
    #{{ID}} .caza { fill: #e8eef0; stroke: #06090c; stroke-width: 1.5; }
    #{{ID}} .tic { fill: #f4fbf7; filter: drop-shadow(0 0 10px rgba(220, 255, 235, 0.9)); }
    #{{ID}} .estela { stroke: rgba(220, 255, 235, 0.85); stroke-width: 6; stroke-linecap: round; opacity: 0; }
    #{{ID}} .dist { stroke: #62f59b; stroke-width: 3; stroke-dasharray: 8 8; opacity: 0; }
    #{{ID}} .dist-t { font: 700 40px "JetBrains Mono", monospace; fill: #62f59b; paint-order: stroke; stroke: #06090c; stroke-width: 6px; opacity: 0; }
    #{{ID}} .flash { background: #f2fff8; opacity: 0; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc">
      <div class="capa fondo"></div>
      <div class="capa rej"></div>
      <div class="visor"><i></i><i></i><i></i><i></i></div>
      <div class="rec">RECREACIÓN · VISTA DESDE ARRIBA</div>
      <div class="alt num"><div><span class="q">CAZA</span><span class="v vc">6.100 m</span></div>
        <div class="ob"><span class="q">OBJETO</span><span class="v vo">0 m</span></div></div>
      <svg class="s" viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="agua-{{ID}}"><stop offset="0" stop-color="rgba(235,250,245,0.85)" /><stop offset="0.55" stop-color="rgba(200,235,225,0.35)" />
            <stop offset="1" stop-color="rgba(200,235,225,0)" /></radialGradient>
        </defs>
        <circle class="circ" cx="540" cy="780" r="300" />
        <ellipse class="agua" cx="540" cy="780" rx="70" ry="52" />
        <line class="dist" x1="0" y1="0" x2="0" y2="0" />
        <text class="dist-t" text-anchor="middle">800 m</text>
        <line class="estela" x1="0" y1="0" x2="0" y2="0" />
        <rect class="tic" x="-30" y="-12" width="60" height="24" rx="12" />
        <path class="caza" d="M0,-30 L5,-12 L24,4 L24,9 L5,4 L4,18 L11,24 L11,28 L0,25 L-11,28 L-11,24 L-4,18 L-5,4 L-24,9 L-24,4 L-5,-12 Z" />
      </svg>
      <div class="capa flash"></div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const CX = 540, CY = 780, R = 300, r = 150;
      const tg = w("girando") - 0.6, tk = w("kilómetro") - 0.3, ta = w("acelera") - 0.05, td = w("desaparece") - 0.05;
      const caza = $(".caza"), tic = $(".tic");
      const mil = (v) => fmt(v);   // «4.880»: el es-ES de JavaScript no agrupa las cifras de cuatro dígitos
      // El caza da la vuelta al círculo (en el sentido de las agujas del reloj) hasta «kilómetro»; luego va a por el objeto.
      const OM = (Math.PI * 2 * 1.15) / Math.max(1, tk);
      const posCaza = (t) => { const a = -Math.PI / 2 + OM * Math.min(t, tk); return [CX + R * Math.cos(a), CY + R * Math.sin(a), a + Math.PI]; };
      // El objeto: sobre la mancha, a saltos; desde «girando», al otro lado del círculo y subiendo.
      const posTic = (t) => {
        if (t < tg) return [CX + 14 * Math.sin(t * 5.3), CY + 9 * Math.sin(t * 7.1 + 1), 0];
        const u = paso(t, tg, 1.2, "power2.out"), a = -Math.PI / 2 + OM * Math.min(t, tk) + Math.PI;
        return [CX + (14 * Math.sin(t * 5.3)) * (1 - u) + u * r * Math.cos(a), CY + u * r * Math.sin(a), u * (a + Math.PI / 2)];
      };
      alBuscar((t) => {
        let [cx, cy, ca] = posCaza(t);
        let [ox, oy, oa] = posTic(Math.min(t, ta));
        // «kilómetro»: el caza deja el círculo y apunta al objeto, hasta quedarse a 800 m (en esquema, 120 px).
        if (t >= tk) {
          const [kx, ky] = posCaza(tk), u = paso(t, tk, ta - tk, "power1.inOut");
          const dx = ox - kx, dy = oy - ky, d = Math.hypot(dx, dy), q = Math.max(0, (d - 120) / d);
          cx = kx + dx * q * u; cy = ky + dy * q * u; ca = Math.atan2(dy, dx) + Math.PI / 2;   // el morro mira al objeto
        }
        caza.setAttribute("transform", `translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${(ca * 180 / Math.PI).toFixed(1)})`);
        // «acelera»: el objeto sale disparado en la dirección en la que mira, con su estela; en «desaparece» ya no está.
        if (t >= ta) {
          const v = paso(t, ta, Math.max(0.2, td - ta), "power4.in"), dir = Math.atan2(oy - cy, ox - cx);
          const nx = ox + Math.cos(dir) * 1400 * v, ny = oy + Math.sin(dir) * 1400 * v;
          const e = $(".estela"); e.setAttribute("x1", ox.toFixed(1)); e.setAttribute("y1", oy.toFixed(1));
          e.setAttribute("x2", nx.toFixed(1)); e.setAttribute("y2", ny.toFixed(1));
          e.style.opacity = t < td ? (0.85 * v).toFixed(2) : Math.max(0, 0.85 - (t - td) * 3).toFixed(2);
          ox = nx; oy = ny; oa = dir;   // el eje largo, en la dirección en la que se va
          tic.style.opacity = t < td ? "1" : "0";
        } else { tic.style.opacity = "1"; $(".estela").style.opacity = "0"; }
        tic.setAttribute("transform", `translate(${ox.toFixed(1)},${oy.toFixed(1)}) rotate(${(oa * 180 / Math.PI).toFixed(1)})`);
        // La línea de 800 m, mientras el caza se acerca.
        const ld = $(".dist"), lt = $(".dist-t"), vis = t >= tk + 0.3 && t < ta + 0.1;
        ld.setAttribute("x1", cx.toFixed(1)); ld.setAttribute("y1", cy.toFixed(1)); ld.setAttribute("x2", ox.toFixed(1)); ld.setAttribute("y2", oy.toFixed(1));
        lt.setAttribute("x", ((cx + ox) / 2 + 60).toFixed(1)); lt.setAttribute("y", ((cy + oy) / 2).toFixed(1));
        ld.style.opacity = lt.style.opacity = vis ? "1" : "0";
        // Las alturas: el caza baja de 6.100 a 4.600 m; el objeto sube de 0 a 3.700 m.
        $(".vc").textContent = mil(6100 - 1500 * paso(t, 0, tk, "none")) + " m";
        $(".vo").textContent = t >= td ? "—" : mil(3700 * paso(t, tg, tk - tg, "power1.inOut")) + " m";
      });
      tl.fromTo($(".agua"), { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.in" }, td + 0.1);
      tl.fromTo($(".flash"), { opacity: 0 }, { keyframes: [{ opacity: 0.7, duration: 0.05 }, { opacity: 0, duration: 0.4 }], immediateRender: false }, td);
      fin();
    })();
  </script>
</template>
