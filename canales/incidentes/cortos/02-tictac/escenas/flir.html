  <script>
    (function () {
/*AYUDA*/
      const obj = $(".obj"), ret = $(".ret"), aro = $(".aro");
      const tc = w("calor") - 0.1, ts = DUR - 0.55;
      alBuscar((t) => {
        // El objeto deriva despacio cerca del centro (540, 760), con un temblor de la imagen; al final se va por la izquierda.
        let x = 540 + 26 * Math.sin(t * 0.9) - 10 * t, y = 760 + 10 * Math.sin(t * 1.7 + 0.5);
        const v = paso(t, ts, 0.5, "power4.in"); x -= 1300 * v;
        gsap.set(obj, { x: x - 75, y: y - 32, rotation: -8 + 3 * Math.sin(t * 1.3) });
        gsap.set(ret, { x: 540 - 150 + 0.35 * (x - 540) * (1 - v), y: 760 - 150 + 0.35 * (y - 760) });
        gsap.set(aro, { x: x + 40, y: y - 80 });
        obj.style.opacity = (0.92 + 0.08 * Math.sin(t * 23)).toFixed(3);
      });
      tl.fromTo(aro, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, tc);
      tl.to(aro, { opacity: 0, duration: 0.2 }, ts);
      const e = $(".lab"); e.querySelector("span").innerHTML = "Ningún chorro de calor"; gsap.set(e, { left: 80, top: 960 });
      tl.fromTo(e, { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, tc + 0.1);
      fin();
    })();
