<template>
  <!-- Plantilla común del canal de incidentes: el expediente. Una hoja de archivo con su cabecera y una línea a máquina, y
       debajo lo que se tapa (el bucle abierto de cada caso) o el sello del informe. Parámetros (conf): cab, linea, tapada
       (admite <br>), sello (el texto del sello del modo informe), fondo (imagen detrás, opcional), modo y las anclas:
         oculta   en (entra la hoja), escribe [desde, hasta] (la línea, a máquina), barra (la tapa), late (la barra late)
         revela   en (vuelve la hoja, ya escrita y tapada), quita (la barra se va), fondo_en (aparece la imagen)
         informe  en, escribe [desde, hasta] y en_sello (el sello cae sobre la hoja)
       Un ancla es un número (segundos desde que empieza la escena) o ["palabra", n, desfase]. -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} .fondo { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; visibility: hidden; filter: brightness(0.42) saturate(0.8); }
    #{{ID}} .hoja { position: absolute; left: 60px; top: 330px; width: 960px; padding: 52px 60px 64px; background: #e6ebe8; color: #0d1316;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.65); visibility: hidden; }
    #{{ID}} .hoja::after { content: ""; position: absolute; inset: 0; background: url("assets/img/grano.png"); opacity: 0.16; mix-blend-mode: multiply; }
    #{{ID}} .cab { font: 700 34px/1.2 "JetBrains Mono", monospace; letter-spacing: 0.08em; color: #3c4d55; text-transform: uppercase;
      padding-bottom: 22px; border-bottom: 3px solid #0d1316; }
    #{{ID}} .cab .punto { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #18a45a; margin-right: 14px; vertical-align: 2px; }
    #{{ID}} .linea { font: 500 54px/1.3 "JetBrains Mono", monospace; margin-top: 34px; min-height: 70px; white-space: nowrap; }
    #{{ID}} .tapada { position: relative; display: inline-block; font: 800 136px/0.95 "Big Shoulders Display", sans-serif; text-transform: uppercase;
      margin-top: 26px; color: #0f5c3c; }
    /* La barra sube por encima de la línea: que no asome la tilde de una mayúscula. */
    #{{ID}} .barra { position: absolute; left: -12px; right: -12px; top: -24px; bottom: 0; background: #0d1316; transform-origin: right center; }
    #{{ID}} .sello { display: none; margin: 40px 0 0 6px; padding: 0.08em 0.22em 0.02em; border: 9px solid #0f5c3c; color: #0f5c3c;
      font: 800 112px/1 "Big Shoulders Display", sans-serif; text-transform: uppercase; transform: rotate(-4deg); visibility: hidden;
      mask-image: url("assets/img/desgaste.png"); -webkit-mask-image: url("assets/img/desgaste.png"); mask-size: 380px; -webkit-mask-size: 380px; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc">
      <img class="fondo" src="assets/img/{{p:fondo}}.jpg" alt="" />
      <div class="hoja">
        <div class="cab"><span class="punto"></span><span class="ct"></span></div>
        <div class="linea"><span class="t"></span></div>
        <div class="tapada"><span class="txt"></span><div class="barra"></div></div>
        <div class="sello"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const C = {{p:conf}};
      const A = (a) => (typeof a === "number" ? a : (a[3] === "fin" ? f(a[0], a[1] || 1) : w(a[0], a[1] || 1)) + (a[2] || 0));
      $(".ct").textContent = C.cab;
      const linea = $(".linea .t");
      const escribe = () => {
        const [e0, e1] = C.escribe.map(A);
        alBuscar((t) => { linea.textContent = C.linea.slice(0, Math.round(C.linea.length * Math.min(1, Math.max(0, (t - e0) / (e1 - e0))))); });
      };
      if (C.tapada) $(".tapada .txt").innerHTML = C.tapada; else $(".tapada").style.display = "none";
      if (C.modo === "oculta") {
        // Lo tapado no se escribe: la barra cubre la caja del texto, que no está (ni se puede leer, ni lo mide el check).
        $(".tapada .txt").style.visibility = "hidden";
        tl.fromTo($(".hoja"), { autoAlpha: 0, y: 60, rotation: -2 }, { autoAlpha: 1, y: 0, rotation: -1, duration: 0.45, ease: "expo.out" }, A(C.en));
        escribe();
        // La barra tapa el secreto antes de que se pueda leer: nace tapado y la barra solo se marca.
        tl.fromTo($(".barra"), { scaleY: 1.0 }, { keyframes: [{ scaleY: 1.12, duration: 0.08 }, { scaleY: 1.0, duration: 0.12 }] }, A(C.barra));
        if (C.late != null) {
          tl.fromTo($(".barra"), { backgroundColor: "#0d1316" }, { keyframes: [{ backgroundColor: "#18a45a", duration: 0.2 }, { backgroundColor: "#0d1316", duration: 0.25 },
            { backgroundColor: "#18a45a", duration: 0.2 }, { backgroundColor: "#0d1316", duration: 0.25 }], immediateRender: false }, A(C.late));
        }
      } else if (C.modo === "revela") {
        linea.textContent = C.linea;
        if (C.fondo_en != null) tl.fromTo($(".fondo"), { autoAlpha: 0, scale: 1.08 }, { autoAlpha: 1, scale: 1.0, duration: 1.2, ease: "power2.out" }, A(C.fondo_en));
        tl.fromTo($(".hoja"), { autoAlpha: 0, y: 40, rotation: -1 }, { autoAlpha: 1, y: 0, rotation: -1, duration: 0.35, ease: "expo.out" }, A(C.en));
        tl.fromTo($(".barra"), { scaleX: 1 }, { scaleX: 0, duration: 0.35, ease: "power3.inOut", immediateRender: false }, A(C.quita) - 0.08);
        tl.fromTo($(".tapada"), { scale: 1 }, { scale: 1.05, duration: 0.15, yoyo: true, repeat: 1, transformOrigin: "left center", immediateRender: false }, A(C.quita) + 0.25);
      } else {
        // informe: la hoja entra, la línea se escribe y el sello cae.
        if (C.fondo_en != null) tl.fromTo($(".fondo"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power2.out" }, A(C.fondo_en));
        tl.fromTo($(".hoja"), { autoAlpha: 0, y: 60, rotation: -2 }, { autoAlpha: 1, y: 0, rotation: -1, duration: 0.45, ease: "expo.out" }, A(C.en));
        escribe();
        $(".sello").innerHTML = C.sello; $(".sello").style.display = "inline-block";
        const ts = A(C.en_sello);
        tl.fromTo($(".sello"), { autoAlpha: 0, scale: 1.6, rotation: -4 }, { autoAlpha: 1, scale: 1, rotation: -4, duration: 0.2, ease: "power4.in" }, ts - 0.1);
        tl.fromTo($(".hoja"), { x: 0 }, { keyframes: [{ x: -8, duration: 0.05 }, { x: 6, duration: 0.05 }, { x: 0, duration: 0.06 }] }, ts + 0.1);
      }
      fin();
    })();
  </script>
</template>
