<template>
  <!-- Razón 1, la muralla: el centro de Chile de cerca. «los Andes»: la frontera se dibuja como una cresta blanca;
       «montañas de casi siete mil metros»: la foto de la cordillera y 6.893 m; «al oeste, el Pacífico»: el océano se mueve;
       «solo queda una franja»: la pinza, en el punto más estrecho. -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} .cresta { fill: none; stroke: #f5f1e8; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(245, 241, 232, 0.7)); }
    #{{ID}} .picos path { fill: #e8eef4; stroke: #081521; stroke-width: 1.5; }
    #{{ID}} .olas path { fill: none; stroke: #2f6f9a; stroke-width: 3; stroke-linecap: round; opacity: 0.8; }
    #{{ID}} .foto { visibility: hidden; }
    #{{ID}} .alto { position: absolute; left: 80px; top: 520px; font: 900 190px/0.9 "Archivo", sans-serif; letter-spacing: -0.04em;
      text-shadow: 0 4px 34px rgba(8, 21, 33, 0.85); visibility: hidden; }
    #{{ID}} .alto small { display: block; width: 760px; font: 500 32px/1.3 "Plex Mono", monospace; letter-spacing: 0.08em; margin-top: 18px;
      color: #f5f1e8; white-space: normal; }
    #{{ID}} .r-andes { left: 700px; top: 300px; }
    #{{ID}} .r-pac { left: 80px; top: 980px; }
    #{{ID}} .r-arg { left: 700px; top: 960px; font-size: 38px; letter-spacing: 0; color: #b9cadb; }   /* lejos de las cumbres y dentro de x ≤ 940 */
    #{{ID}} .franja { position: absolute; left: 0; width: 1080px; top: 640px; text-align: center; visibility: hidden; text-shadow: none; }
    #{{ID}} .franja span { background: #081521; padding: 0.2em 0.4em 0.14em; }
    #{{ID}} .pz { stroke: #081521; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc">
      <svg class="mapa" viewBox="0 0 1080 1920">
        <g class="olas"></g>
        <path class="tierra" d="{{p:tierra}}" />
        <path class="vecino" d="{{p:argentina}}" />
        <path class="prota" d="{{p:chile}}" />
        <path class="cresta" d="{{p:frontera}}" pathLength="100" stroke-dasharray="100 100" />
        <g class="picos"></g>
        <path class="regla pz" style="stroke-width: 6; visibility: hidden" />
      </svg>
      <div class="rotulo r-andes" style="visibility: hidden">Andes</div>
      <div class="rotulo r-arg" style="visibility: hidden">Argentina</div>
      <div class="rotulo r-pac" style="visibility: hidden">Pacífico</div>
      <img class="foto" src="assets/img/andes.jpg" alt="" />
      <div class="capa velo foto-velo" style="visibility: hidden"></div>
      <div class="alto num"><span class="n">0</span> m<small>Ojos del Salado</small></div>
      <div class="rotulo franja"><span>Una franja · 90 km</span></div>
      <div class="cabecera"><b>1</b> · Una muralla</div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const E = {{p:estrecho}};
      entra($(".cabecera"), Math.max(0, w("primera") - 0.1), 0.35, 14);
      // Olas del Pacífico: líneas cortas que se desplazan (en función del tiempo).
      const olas = $(".olas");
      for (let i = 0; i < 26; i++) {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const x = 40 + (i % 4) * 70 + (Math.floor(i / 4) % 2) * 35, y = 300 + Math.floor(i / 4) * 150 + (i % 3) * 22;
        p.setAttribute("d", `M${x},${y} q14,-10 28,0 t28,0`);
        olas.appendChild(p);
      }
      alBuscar((t) => { olas.setAttribute("transform", `translate(${(t * 18) % 70},0)`); });
      // «los Andes»: la cresta y, sobre ella, una hilera de picos que nace de norte a sur: la muralla.
      traza($(".cresta"), w("Andes") - 0.2, 0.9, "power2.inOut");
      const cr = $(".cresta"), largo = cr.getTotalLength(), picos = [];
      for (let d = 0; d < largo; d += 30) {
        const p = cr.getPointAtLength(d);
        if (p.y < -40 || p.y > 1960) continue;
        const h = 30 + ((d * 7) % 22);
        const tri = document.createElementNS("http://www.w3.org/2000/svg", "path");
        tri.setAttribute("d", `M${p.x - 22},${p.y + 12} L${p.x + 3},${p.y - h} L${p.x + 24},${p.y + 12} Z`);
        $(".picos").appendChild(tri);
        picos.push(tri);
      }
      tl.fromTo(picos, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.9 / Math.max(1, picos.length) }, w("Andes") - 0.1);
      entra($(".r-andes"), w("Andes") - 0.05, 0.35, 14);
      entra($(".r-arg"), w("Andes") + 0.2, 0.35, 14);
      // «montañas de casi siete mil metros»: la foto de la cordillera, con su cifra.
      tl.fromTo([$(".foto"), $(".foto-velo")], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.18 }, w("montañas") - 0.1);
      tl.fromTo($(".foto"), { scale: 1.12 }, { scale: 1.0, duration: 2.4, ease: "power1.out" }, w("montañas") - 0.1);
      tl.set($(".alto"), { visibility: "visible" }, w("montañas") - 0.05);
      cuenta($(".alto .n"), 0, 6893, w("montañas") - 0.05, f("metros") - w("montañas"), { ease: "power3.out" });
      tl.to([$(".foto"), $(".foto-velo"), $(".alto")], { autoAlpha: 0, duration: 0.2 }, w("Al", 2) - 0.15);
      // «Al oeste, el Pacífico».
      entra($(".r-pac"), w("oeste") - 0.05, 0.35, 14);
      tl.fromTo(olas, { opacity: 0.2 }, { opacity: 1, duration: 0.4 }, w("oeste") - 0.1);
      // «solo queda una franja»: la pinza en el punto más estrecho.
      const [a, b] = E, y = (a[1] + b[1]) / 2;
      $(".pz").setAttribute("d", `M${a[0]},${y} L${b[0]},${y} M${a[0]},${y - 22} L${a[0]},${y + 22} M${b[0]},${y - 22} L${b[0]},${y + 22}`);
      gsap.set($(".franja"), { top: y - 140 });
      tl.fromTo($(".pz"), { autoAlpha: 0, scaleX: 0.2, transformOrigin: "50% 50%" }, { autoAlpha: 1, scaleX: 1, duration: 0.3, ease: "expo.out" }, w("franja") - 0.1);
      entra($(".franja"), w("dos") - 0.05, 0.35, 14);
      fin();
    })();
  </script>
</template>
