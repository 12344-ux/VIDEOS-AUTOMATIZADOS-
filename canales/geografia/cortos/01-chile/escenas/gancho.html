<template>
  <!-- Gancho: Sudamérica con Chile en amarillo y la pregunta ya escrita (es la miniatura). «4.270 km»: la regla se dibuja
       de punta a punta y la cifra cuenta; «en su punto más estrecho»: la cámara baja hasta 31,6° S y una pinza mide 90 km. -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} .tit { position: absolute; left: 330px; top: 226px; width: 610px; font: 900 88px/0.98 "Archivo", sans-serif;
      letter-spacing: -0.03em; text-transform: uppercase; text-shadow: 0 4px 30px rgba(8, 21, 33, 0.9); white-space: nowrap; }
    #{{ID}} .tit .bloque { display: inline-block; padding: 0.02em 0.1em 0; text-shadow: none; }
    #{{ID}} .velo-tit { position: absolute; left: 300px; top: 190px; width: 780px; height: 520px;
      background: radial-gradient(ellipse at 40% 45%, rgba(8, 21, 33, 0.85) 0%, rgba(8, 21, 33, 0.55) 55%, rgba(8, 21, 33, 0) 75%); }
    #{{ID}} .cifra { position: absolute; left: 330px; top: 640px; font: 900 150px/0.9 "Archivo", sans-serif; letter-spacing: -0.04em;
      color: #ffc531; text-shadow: 0 4px 30px rgba(8, 21, 33, 0.9); visibility: hidden; }
    #{{ID}} .cifra small { font-size: 0.42em; letter-spacing: 0; margin-left: 0.12em; }
    #{{ID}} .bajo { position: absolute; left: 336px; top: 790px; visibility: hidden; }
    #{{ID}} .noventa { position: absolute; left: 0; width: 1080px; top: 930px; text-align: center; font: 900 170px/0.9 "Archivo", sans-serif;
      letter-spacing: -0.04em; color: #f5f1e8; visibility: hidden; }
    #{{ID}} .noventa span { display: inline-block; background: #081521; padding: 0.06em 0.16em 0.02em; }
    #{{ID}} .noventa small { font-size: 0.4em; letter-spacing: 0; margin-left: 0.1em; }
    #{{ID}} .donde { position: absolute; left: 0; width: 1080px; top: 640px; text-align: center; visibility: hidden; }
    #{{ID}} .donde span { background: #081521; color: #f5f1e8; padding: 0.3em 0.6em; }
    #{{ID}} .pz { stroke-width: 7; stroke: #081521; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc">
      <svg class="mapa" viewBox="0 0 1080 1920">
        <g class="cam" transform="translate(0,0) scale(1)">
          <path class="tierra" d="{{p:tierra}}" />
          <path class="vecino" d="{{p:vecinos}}" />
          <path class="prota" d="{{p:chile}}" />
          <g class="regla-g">
            <path class="regla linea" pathLength="100" stroke-dasharray="100 100" />
            <path class="regla topes" />
          </g>
          <g class="pinza" style="visibility: hidden">
            <path class="regla pz" />
          </g>
        </g>
      </svg>
      <div class="velo-tit"></div>
      <div class="tit">¿Por qué<br>Chile es<br>tan <span class="bloque">largo</span>?</div>
      <div class="cifra num"><span class="n">0</span><small>KM</small></div>
      <div class="mono bajo">de punta a punta</div>
      <div class="mono donde"><span>Lo más estrecho · 31,6° S</span></div>
      <div class="noventa num"><span>90<small>KM</small></span></div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const N = {{p:norte}}, S = {{p:sur}}, E = {{p:estrecho}};
      const cam = $(".cam");
      // La regla, a la izquierda de Chile, sobre el océano; con un tope en cada punta.
      const xr = Math.min(N[0], S[0]) - 70;
      $(".linea").setAttribute("d", `M${xr},${N[1]} L${xr},${S[1]}`);
      $(".topes").setAttribute("d", `M${xr - 18},${N[1]} L${xr + 18},${N[1]} M${xr - 18},${S[1]} L${xr + 18},${S[1]}`);
      tl.fromTo($(".topes"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15 }, w("cuatro") - 0.1);
      traza($(".linea"), w("cuatro") - 0.1, f("kilómetros") - w("cuatro"), "power2.inOut");
      tl.set($(".cifra"), { visibility: "visible" }, w("cuatro") - 0.1);
      cuenta($(".cifra .n"), 0, 4270, w("cuatro") - 0.1, w("kilómetros") - w("cuatro") + 0.1, { ease: "power3.out" });
      entra($(".bajo"), w("cuatro"), 0.35, 14);
      // «Y en su punto más estrecho»: la pregunta se va; la cámara baja hasta 31,6° S.
      const mx = (E[0][0] + E[1][0]) / 2, my = (E[0][1] + E[1][1]) / 2, s = 7.5;
      tl.to([$(".tit"), $(".velo-tit"), $(".cifra"), $(".bajo")], { autoAlpha: 0, y: -24, duration: 0.25, ease: "power2.in" }, w("punto") - 0.15);
      tl.to($(".regla-g"), { autoAlpha: 0, duration: 0.2 }, w("punto") - 0.15);
      tl.to(cam, { attr: { transform: `translate(${540 - s * mx},${860 - s * my}) scale(${s})` }, duration: 0.9, ease: "expo.inOut" }, w("punto") - 0.15);
      // La pinza: de la costa a la frontera, con sus topes.
      const [a, b] = E, y = my;
      $(".pz").setAttribute("d", `M${a[0]},${y} L${b[0]},${y} M${a[0]},${y - 4} L${a[0]},${y + 4} M${b[0]},${y - 4} L${b[0]},${y + 4}`);
      tl.fromTo($(".pinza"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, w("estrecho") + 0.25);
      entra($(".donde"), w("punto") + 0.2, 0.35, 16);
      tl.fromTo($(".noventa"), { autoAlpha: 0, scale: 1.25 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "expo.out" }, w("noventa") - 0.06);
      fin();
    })();
  </script>
</template>
