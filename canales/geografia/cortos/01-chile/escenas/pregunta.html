<template>

  <style>

/*CORTO*/
    #{{ID}} svg.mapa { opacity: 0.16; }

    #{{ID}} .cas { position: absolute; top: 860px; width: 200px; height: 200px; border: 6px solid #8fa6bd; box-sizing: border-box;

  <script>
    (function () {
/*AYUDA*/
      const ps = trocea($(".q"));

      ps.forEach((p, i) => sube(p, (tq[i] ?? tq[tq.length - 1]) - 0.08, 0.4));
