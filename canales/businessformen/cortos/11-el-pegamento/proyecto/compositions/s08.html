        tl.fromTo(o.frente || ".frente25", { scale: o.s0 || 1, x: 0, y: 0 }, { scale: o.s1 || 1.13, x: o.sx || 0, y: o.sy || 0, duration: d, ease: o.ease || "none" }, t0);
      };
      const fin = () => { entradaEscena(); tl.set({}, {}, DUR); window.__timelines["s08"] = tl; };

      const C = {"etq": {"palabra": "un", "n": 7, "grande": true}, "b1": {"palabra": "es", "y": 360, "tam": 110}, "b2": {"palabra": "que", "n": 5, "y": 560, "tam": 92, "sube": -24}, "firma": true, "firma_t": 3.7};
      // Corte a rojo: el campo entra un poco grande y se asienta (la causa del corte es la frase que llega).
      tl.fromTo(RAIZ, { scale: 1.035 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);
      const bloque = (sel, c) => {
        const el = $(sel);
        el.style.top = c.y + "px";
        el.style.fontSize = c.tam + "px";
        const ps = trocea(el);
        serie(c.palabra, ps.length, c.n || 1).forEach((t, i) => sube(ps[i], Math.max(0, t - 0.07), 0.42));
        return el;
      };
      if (C.etq && C.etq.grande) {
        $(".etq").classList.add("grande");
        const pe = trocea(".etq b");
        serie(C.etq.palabra, pe.length, C.etq.n || 1).forEach((t, i) => sube(pe[i], Math.max(0, t - 0.07), 0.4));
      } else if (C.etq) entra(".etq", w(C.etq.palabra, C.etq.n || 1) - 0.1, 0.35, 10);
      else $(".etq").remove();
      bloque(".b1", C.b1);
      if (C.b2) {
        bloque(".b2", C.b2);
        // El segundo bloque empuja al primero: sube y se queda a media luz.
        const t2 = w(C.b2.palabra, C.b2.n || 1) - 0.12;
        tl.to(".b1", { y: C.b2.sube != null ? C.b2.sube : -40, opacity: 0.42, duration: 0.45, ease: "expo.out" }, t2);
      } else {
        $(".b2").remove();
      }
      if (C.firma) entra(".firma", C.firma_t != null ? C.firma_t : Math.min(DUR - 0.9, 1.2), 0.45, 14);
      else $(".firma").remove();
      fin();
    })();
  </script>
