<template>
  <!-- La carta de 1948 (el dibujo que explica la idea), sobre el puesto en penumbra: «veinticinco»: la carta, con sus 25
       productos (rayas, como en una carta vista de lejos) y el contador; «hamburguesa»: la primera línea se enciende (la
       mayor parte del dinero); «tacharon»: una raya roja tacha 16, una tras otra, y el contador baja de 25 a 9;
       «dieciséis»: −16. Las líneas son un esquema: no se inventan los platos de aquella carta. -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} .foto { filter: brightness(0.22) saturate(0.6); transform: scale(1.06); }
    #{{ID}} .cont { position: absolute; left: 80px; top: 236px; }
    #{{ID}} .cont small { display: block; font: 500 34px/1.2 "Plex Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
    #{{ID}} .cont .n { font: 800 190px/0.86 "Inter Tight", sans-serif; letter-spacing: -0.05em; }
    #{{ID}} .menos { position: absolute; left: 400px; top: 330px; font: 800 96px/1 "Inter Tight", sans-serif; visibility: hidden; }
    #{{ID}} .menos span { display: inline-block; background: #b0122f; color: #f4f3f0; padding: 0.06em 0.16em 0.02em; }
    #{{ID}} .carta { position: absolute; left: 80px; top: 560px; width: 920px; height: 560px; box-sizing: border-box;
      background: rgba(10, 11, 13, 0.74); border: 3px solid rgba(244, 243, 240, 0.45); padding: 26px 34px; visibility: hidden; }
    #{{ID}} .carta .cab { font: 500 28px/1 "Plex Mono", monospace; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(244, 243, 240, 0.7); margin-bottom: 22px; }
    #{{ID}} .estrella { position: relative; height: 54px; display: flex; align-items: center; gap: 22px; margin-bottom: 14px; }
    #{{ID}} .estrella b { display: inline-block; font: 800 44px/1 "Inter Tight", sans-serif; text-transform: uppercase; letter-spacing: -0.01em;
      padding: 0.1em 0.18em 0.04em; }
    #{{ID}} .estrella small { font: 500 24px/1.1 "Plex Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase;
      color: #f4f3f0; visibility: hidden; }
    #{{ID}} .filas { display: grid; grid-template-columns: 1fr 1fr; column-gap: 46px; row-gap: 0; }
    #{{ID}} .fila { position: relative; height: 32px; display: flex; align-items: center; }
    #{{ID}} .fila i { display: block; height: 9px; background: rgba(244, 243, 240, 0.62); }
    #{{ID}} .fila .raya { position: absolute; left: -6px; top: 13px; height: 6px; background: #b0122f; transform-origin: left center; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc">
      <img class="foto" src="assets/img/puesto.jpg" alt="" />
      <div class="cont num"><small>Productos en la carta</small><span class="n">0</span></div>
      <div class="menos num"><span>−16</span></div>
      <div class="carta">
        <div class="cab">La carta · 1948</div>
        <div class="estrella"><b>Hamburguesa</b><small>La mayor parte<br>del dinero</small></div>
        <div class="filas"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      // 24 líneas más (la hamburguesa es la 25): rayas de largo distinto, en dos columnas de 12.
      const largos = [300, 220, 340, 260, 190, 310, 240, 280, 200, 330, 250, 210, 290, 230, 320, 180, 270, 300, 210, 260, 340, 230, 190, 280];
      const quedan = new Set([1, 4, 8, 13, 17, 20, 22, 10]);   // las otras 8 que se quedan (9 con la hamburguesa)
      const filas = largos.map((l, i) => {
        const d = document.createElement("div");
        d.className = "fila";
        d.innerHTML = `<i style="width:${l}px"></i><span class="raya" style="width:${l + 12}px"></span>`;
        $(".filas").appendChild(d);
        return d;
      });
      tl.fromTo(".foto", { scale: 1.06 }, { scale: 1.12, duration: DUR, ease: "none" }, 0);
      tl.fromTo(".carta", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.05);
      tl.fromTo(filas, { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.25, stagger: 0.012, ease: "power2.out" }, 0.12);
      tl.set(filas.map((d) => d.querySelector(".raya")), { scaleX: 0 }, 0);
      // «veinticinco»: el contador sube a 25 con la voz.
      cuenta($(".cont .n"), 0, 25, Math.max(0.1, w("veinticinco") - 0.1), 0.45, { ease: "power2.out", crudo: true });
      // «hamburguesa»: la primera línea se enciende.
      const th = w("hamburguesa") - 0.05;
      tl.fromTo(".estrella b", { backgroundColor: "rgba(176, 18, 47, 0)" }, { backgroundColor: "rgba(176, 18, 47, 1)", duration: 0.2, ease: "power2.out" }, th);
      tl.fromTo(".estrella b", { scale: 1 }, { keyframes: [{ scale: 1.08, duration: 0.14 }, { scale: 1, duration: 0.25 }], transformOrigin: "left center" }, th);
      tl.fromTo(".estrella small", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, th + 0.15);
      // «tacharon dieciséis»: 16 rayas rojas, una tras otra, y el contador baja de 25 a 9.
      const t0 = w("tacharon") - 0.05, t1 = f("dieciséis") + 0.25;
      const tachadas = filas.filter((d, i) => !quedan.has(i));
      tachadas.forEach((d, i) => {
        const t = t0 + (t1 - t0) * i / tachadas.length;
        tl.to(d.querySelector(".raya"), { scaleX: 1, duration: 0.1, ease: "power2.out" }, t);
        tl.to(d.querySelector("i"), { opacity: 0.22, duration: 0.15 }, t + 0.08);
      });
      cuenta($(".cont .n"), 25, 9, t0, t1 - t0, { ease: "none", crudo: true });
      tl.fromTo(".menos", { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power4.in" }, w("dieciséis") - 0.1);
      fin();
    })();
  </script>
</template>
