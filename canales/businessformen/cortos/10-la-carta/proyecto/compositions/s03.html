      const quedan = new Set([1, 4, 8, 13, 17, 20, 22, 10]);   // las otras 8 que se quedan (9 con la hamburguesa)
      const filas = largos.map((l, i) => {
        const d = document.createElement("div");
        d.className = "fila";
        d.innerHTML = `<i style="width:${l}px"></i><span class="raya" style="width:${l + 12}px"></span>`;
        $(".filas").appendChild(d);
        return d;
      });
      tl.fromTo(".foto", { scale: 1.06 }, { scale: 1.12, duration: DUR, ease: "none" }, 0);
      tl.fromTo(".carta", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.05);
      tl.fromTo(filas, { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.25, stagger: 0.012, ease: "power2.out" }, 0.12);
      tl.set(filas.map((d) => d.querySelector(".raya")), { scaleX: 0 }, 0);
      // «veinticinco»: el contador sube a 25 con la voz.
      cuenta($(".cont .n"), 0, 25, Math.max(0.1, w("veinticinco") - 0.1), 0.45, { ease: "power2.out", crudo: true });
      // «hamburguesa»: la primera línea se enciende.
      const th = w("hamburguesa") - 0.05;
      tl.fromTo(".estrella b", { backgroundColor: "rgba(176, 18, 47, 0)" }, { backgroundColor: "rgba(176, 18, 47, 1)", duration: 0.2, ease: "power2.out" }, th);
      tl.fromTo(".estrella b", { scale: 1 }, { keyframes: [{ scale: 1.08, duration: 0.14 }, { scale: 1, duration: 0.25 }], transformOrigin: "left center" }, th);
      tl.fromTo(".estrella small", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, th + 0.15);
      // «tacharon dieciséis»: 16 rayas rojas, una tras otra, y el contador baja de 25 a 9.
      const t0 = w("tacharon") - 0.05, t1 = f("dieciséis") + 0.25;
      const tachadas = filas.filter((d, i) => !quedan.has(i));
      tachadas.forEach((d, i) => {
        const t = t0 + (t1 - t0) * i / tachadas.length;
        tl.to(d.querySelector(".raya"), { scaleX: 1, duration: 0.1, ease: "power2.out" }, t);
        tl.to(d.querySelector("i"), { opacity: 0.22, duration: 0.15 }, t + 0.08);
      });
      cuenta($(".cont .n"), 25, 9, t0, t1 - t0, { ease: "none", crudo: true });
      tl.fromTo(".menos", { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power4.in" }, w("dieciséis") - 0.1);
      fin();
    })();
  </script>
</template>
