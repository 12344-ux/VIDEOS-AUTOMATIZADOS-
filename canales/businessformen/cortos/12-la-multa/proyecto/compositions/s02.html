      tl.fromTo(".foto", { scale: 1.06 }, { scale: 1.12, duration: DUR, ease: "none" }, 0);
      if (modo === "multas") {
        $(".n2").remove();
        // «ochocientos»: la barra crece con su contador.
        const t = Math.max(0.1, w("ochocientos") - 0.1);
        tl.fromTo(".b1", { scaleY: 0 }, { scaleY: 1, duration: f("millones") - t + 0.2, ease: "power2.out" }, t);
        cuenta($(".c1 .n"), 0, 800, t, f("millones") - t + 0.2, { ease: "power2.out", crudo: true });
        tl.fromTo(".c1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, t);
        // «odiaban»: el sello.
        tl.fromTo(".sello", { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power4.in" }, w("odiaban") - 0.1);
        tl.fromTo(RAIZ, { x: 0 }, { keyframes: [{ x: -7, duration: 0.05 }, { x: 5, duration: 0.05 }, { x: 0, duration: 0.06 }] }, w("odiaban") + 0.12);
      } else {
        $(".sello").remove();
        // La de las multas ya está (se ha dicho antes): entra a media luz.
        tl.fromTo([".b1", ".c1"], { autoAlpha: 0 }, { autoAlpha: 0.5, duration: 0.3 }, 0.02);
        // «cincuenta»: la de Netflix, que apenas se levanta del suelo, y su cifra.
        const t = w("cincuenta") - 0.08;
        tl.fromTo(".b2", { scaleY: 0, autoAlpha: 1 }, { scaleY: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, t);
        tl.fromTo(".c2", { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "power4.in" }, t + 0.05);
        // «no»: el sello NO, con un golpe.
        const tn = w("no") - 0.05;
        tl.fromTo(".no", { autoAlpha: 0, scale: 1.5 }, { autoAlpha: 1, scale: 1, duration: 0.2, ease: "power4.in" }, tn);
        tl.fromTo(RAIZ, { x: 0 }, { keyframes: [{ x: -9, duration: 0.05 }, { x: 7, duration: 0.05 }, { x: 0, duration: 0.06 }] }, tn + 0.2);
      }
      fin();
    })();
  </script>
</template>
