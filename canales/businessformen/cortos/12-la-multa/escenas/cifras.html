<template>
  <!-- Dos cifras del año 2000 en barras a la misma escala, sobre una foto en penumbra. Modos:
       multas  «ochocientos»: la barra de las multas crece con su contador hasta 800 M$; «odiaban»: LO QUE MÁS ODIABAN
       oferta  la barra de las multas, quieta y a media luz; «cincuenta»: la de Netflix (50 M$), que casi no se levanta;
               «no»: el sello NO encima, con un golpe -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} .foto { filter: brightness(0.22) saturate(0.6); transform: scale(1.06); }
    #{{ID}} .tit { position: absolute; left: 80px; top: 236px; font: 500 36px/1.25 "Plex Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; }
    #{{ID}} .barra { position: absolute; bottom: 860px; width: 300px; transform-origin: 50% 100%; }
    #{{ID}} .b1 { left: 140px; height: 600px; background: #f4f3f0; }
    #{{ID}} .b2 { left: 620px; height: 38px; background: #b0122f; visibility: hidden; }
    #{{ID}} .cifra { position: absolute; font: 800 110px/1 "Inter Tight", sans-serif; letter-spacing: -0.04em; white-space: nowrap; }
    #{{ID}} .cifra small { font: 800 56px/1 "Inter Tight", sans-serif; letter-spacing: -0.02em; margin-left: 10px; }
    #{{ID}} .c1 { left: 140px; top: 330px; }
    #{{ID}} .c2 { left: 620px; top: 880px; visibility: hidden; }
    #{{ID}} .c2 span { background: #b0122f; padding: 0.04em 0.12em 0; }
    #{{ID}} .nom { position: absolute; top: 1080px; width: 300px; text-align: center; font: 500 36px/1.1 "Plex Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    #{{ID}} .eje { position: absolute; left: 100px; top: 1060px; width: 880px; height: 4px; background: rgba(244, 243, 240, 0.6); }
    #{{ID}} .sello { position: absolute; left: 80px; top: 760px; font: 800 92px/1 "Inter Tight", sans-serif; text-transform: uppercase; visibility: hidden; }
    #{{ID}} .sello span { display: inline-block; background: #b0122f; color: #f4f3f0; padding: 0.06em 0.16em 0.02em; }
    #{{ID}} .no { position: absolute; left: 560px; top: 640px; font: 800 220px/1 "Inter Tight", sans-serif; color: #b0122f; letter-spacing: -0.04em;
      border: 16px solid #b0122f; padding: 0.02em 0.14em 0; transform: rotate(-10deg); background: rgba(10, 11, 13, 0.55); visibility: hidden; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc" data-modo="{{p:modo}}">
      <img class="foto" src="assets/img/{{p:foto}}.jpg" alt="" />
      <div class="tit">{{p:titulo}}</div>
      <div class="barra b1"></div><div class="barra b2"></div>
      <div class="eje"></div>
      <div class="cifra c1 num"><span class="n">800</span><small>M$</small></div>
      <div class="cifra c2 num"><span>50<small>M$</small></span></div>
      <div class="nom" style="left: 140px">Multas</div><div class="nom n2" style="left: 620px">Netflix</div>
      <div class="sello"><span>Lo que más<br>odiaban</span></div>
      <div class="no">No</div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const modo = RAIZ.dataset.modo;
      tl.fromTo(".foto", { scale: 1.06 }, { scale: 1.12, duration: DUR, ease: "none" }, 0);
      if (modo === "multas") {
        $(".n2").remove();
        // «ochocientos»: la barra crece con su contador.
        const t = Math.max(0.1, w("ochocientos") - 0.1);
        tl.fromTo(".b1", { scaleY: 0 }, { scaleY: 1, duration: f("millones") - t + 0.2, ease: "power2.out" }, t);
        cuenta($(".c1 .n"), 0, 800, t, f("millones") - t + 0.2, { ease: "power2.out", crudo: true });
        tl.fromTo(".c1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, t);
        // «odiaban»: el sello.
        tl.fromTo(".sello", { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power4.in" }, w("odiaban") - 0.1);
        tl.fromTo(RAIZ, { x: 0 }, { keyframes: [{ x: -7, duration: 0.05 }, { x: 5, duration: 0.05 }, { x: 0, duration: 0.06 }] }, w("odiaban") + 0.12);
      } else {
        $(".sello").remove();
        // La de las multas ya está (se ha dicho antes): entra a media luz.
        tl.fromTo([".b1", ".c1"], { autoAlpha: 0 }, { autoAlpha: 0.5, duration: 0.3 }, 0.02);
        // «cincuenta»: la de Netflix, que apenas se levanta del suelo, y su cifra.
        const t = w("cincuenta") - 0.08;
        tl.fromTo(".b2", { scaleY: 0, autoAlpha: 1 }, { scaleY: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, t);
        tl.fromTo(".c2", { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "power4.in" }, t + 0.05);
        // «no»: el sello NO, con un golpe.
        const tn = w("no") - 0.05;
        tl.fromTo(".no", { autoAlpha: 0, scale: 1.5 }, { autoAlpha: 1, scale: 1, duration: 0.2, ease: "power4.in" }, tn);
        tl.fromTo(RAIZ, { x: 0 }, { keyframes: [{ x: -9, duration: 0.05 }, { x: 7, duration: 0.05 }, { x: 0, duration: 0.06 }] }, tn + 0.2);
      }
      fin();
    })();
  </script>
</template>
