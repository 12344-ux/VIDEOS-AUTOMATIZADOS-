        tl.fromTo(o.fondo || ".fondo25", { scale: o.f0 || 1, x: 0, y: 0 }, { scale: o.f1 || 1.05, x: o.fx || 0, y: o.fy || 0, duration: d, ease: o.ease || "none" }, t0);
        tl.fromTo(o.frente || ".frente25", { scale: o.s0 || 1, x: 0, y: 0 }, { scale: o.s1 || 1.13, x: o.sx || 0, y: o.sy || 0, duration: d, ease: o.ease || "none" }, t0);
      };
      const fin = () => { entradaEscena(); tl.set({}, {}, DUR); window.__timelines["s02"] = tl; };

      tl.fromTo(".foto", { scale: 1.06 }, { scale: 1.12, duration: DUR, ease: "none" }, 0);
      tl.fromTo([".v1", ".v2"], { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, stagger: 0.08, ease: "expo.out" }, 0.02);
      cuenta($(".cont .n"), 0, 200000, w("doscientas") - 0.1, f("catas") - w("doscientas") + 0.3, { ease: "power2.out" });
      // «La nueva» (dicha antes que el número): el vaso B se adelanta y gana.
      const tn = Math.max(0.3, w("catas") - 0.2);
      tl.to(".v2", { scale: 1.08, transformOrigin: "50% 100%", duration: 0.3, ease: "back.out(2)" }, tn);
      tl.fromTo(".gana", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, tn);
      // «uno de los mayores errores»: el sello.
      tl.fromTo(".error", { autoAlpha: 0, scale: 1.4 }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power4.in" }, w("errores") - 0.15);
      tl.fromTo(RAIZ, { x: 0 }, { keyframes: [{ x: -8, duration: 0.05 }, { x: 6, duration: 0.05 }, { x: 0, duration: 0.06 }] }, w("errores") + 0.07);
      fin();
    })();
  </script>
