      const as = $$(".rej .a");
      // Los cien anillos se dibujan de golpe al decir «menos»; cuatro se encienden (menos del 5 %).
      tl.fromTo(".rej", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35 }, 0.02);
      [0, 1, 2, 3].forEach((i) => tl.to(as[i], { fill: "#f4f3f0", stroke: "#f4f3f0", duration: 0.12 }, w("cinco") + i * 0.06));

      entra(".novias", 0.1, 0.35, 8);
      // 1967 → 1981: las dos últimas cifras ruedan hacia arriba.
      tl.fromTo(".ano .rueda b", { yPercent: 0 }, { yPercent: -100, duration: 0.45, ease: "power3.inOut" }, w("ochenta") - 0.15);
      // «El sesenta por ciento»: se encienden en ola hasta sesenta, en rojo.
      const t0 = w("sesenta", 2) - 0.05;
      for (let i = 0; i < 60; i++) tl.to(as[i], { fill: "#b0122f", stroke: "#b0122f", duration: 0.1 }, t0 + i * 0.012);
      tl.to(".dato .d1", { autoAlpha: 0, duration: 0.12 }, t0);
      tl.fromTo(".dato .d2", { autoAlpha: 0, scaleX: 0.3 }, { autoAlpha: 1, scaleX: 1, duration: 0.3, ease: "expo.out", transformOrigin: "left center" }, t0 + 0.1);
