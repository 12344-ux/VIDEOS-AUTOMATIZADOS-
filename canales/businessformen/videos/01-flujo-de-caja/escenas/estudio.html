<template>

       nombra y la figura se dibuja en «estudiaron sus números». En «conclusión», la hoja sale y queda la línea de

  <div data-composition-id="{{ID}}" data-width="1920" data-height="1080">
    <div id="{{ID}}" class="esc">
      <div class="hoja">
        <div class="cab"><span>RECREACIÓN</span><span>ESTUDIO · 1980</span></div>

          <div class="col"><i></i><i style="width: 90%"></i><i></i><i style="width: 76%"></i><i></i><i></i><i style="width: 62%"></i><i></i><i style="width: 84%"></i></div>
          <div class="fig"><svg viewBox="0 0 560 290" preserveAspectRatio="none">

            <path class="f1" d="M30,62 L101,60 L173,58 L244,56 L316,56 L387,58 L459,60 L530,54" pathLength="100" stroke-dasharray="100 100" style="fill:none;stroke:#141414;stroke-width:4"/>
            <path class="f2" d="M30,118 L101,114 L173,104 L244,106 L316,128 L387,140 L459,152 L530,262" pathLength="100" stroke-dasharray="100 100" style="fill:none;stroke:#b0122f;stroke-width:5"/>

  <script>
    (function () {
/*AYUDA*/
      const X = (a) => 180 + (a - 1965) * 146, NS = "http://www.w3.org/2000/svg";
      const marcas = $(".marcas"), senal = $(".senal");
      for (let a = 1965; a <= 1975; a++) {
        const m = document.createElementNS(NS, "path"); m.setAttribute("d", `M${X(a)},628 L${X(a)},652`); m.setAttribute("style", "stroke:#f4f3f0;stroke-width:3"); marcas.appendChild(m);
        const d = document.createElement("div"); d.className = "mono anio num"; d.style.left = X(a) + "px"; d.textContent = a; RAIZ.appendChild(d);
      }
      [1966, 1967, 1970, 1971, 1972, 1973, 1974].forEach((a) => {
        const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", X(a)); c.setAttribute("cy", 640); c.setAttribute("r", 13); c.setAttribute("fill", "#b0122f");
        c.setAttribute("stroke", "#0a0b0d"); c.setAttribute("stroke-width", 4); senal.appendChild(c);
      });
      // La hoja entra de lado y se asienta; los autores, subrayados al nombrarlos; la figura, en «números».
      tl.fromTo(".hoja", { x: 1300, rotation: 8 }, { x: 0, rotation: -1.5, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(".hoja", { scale: 1 }, { scale: 1.05, duration: w("conclusión") - 0.7, ease: "none", immediateRender: false }, 0.7);
      tl.fromTo(".a1 u", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, w("Yeims") - 0.05);
      tl.fromTo(".a2 u", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, w("Cláid") - 0.05);
      traza(".f1", w("estudiaron") - 0.1, 0.8);
      traza(".f2", w("estudiaron") + 0.2, 0.9, "power2.in");
      // «Su conclusión»: sale la hoja y queda la línea de tiempo.
      tl.to(".hoja", { y: -1150, rotation: -4, duration: 0.6, ease: "power3.in" }, w("conclusión") - 0.35);
      entra(".conc", w("conclusión") - 0.05, 0.4, 10);
      traza(".linea", w("conclusión") + 0.1, 0.7, "power3.out");
      tl.fromTo(".marcas path, .anio", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, stagger: 0.04 }, w("conclusión") + 0.2);
      tl.fromTo(".qb", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "expo.out" }, w("conclusión") + 0.6);
      tl.fromTo(".senal circle", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2.5)", stagger: 0.12 }, w("señales") - 0.05);
      entra(".ley", w("flujo") - 0.1, 0.4, 10);
      // «Hasta diez años antes»: la llave vuelve desde la quiebra hasta 1965.
      traza(".llave", w("hasta", 3) - 0.1, 0.8, "power2.inOut");
      const p = $$(".diez .pal > span");
      sube(p[0], w("diez", 2) - 0.08, 0.4); sube(p[1], w("años", 3) - 0.08, 0.4); sube(p[2], w("antes", 2) - 0.08, 0.4);
      fin();
    })();
  </script>
</template>
