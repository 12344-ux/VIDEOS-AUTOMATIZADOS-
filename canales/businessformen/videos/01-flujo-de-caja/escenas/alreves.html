<template>

  <style>
/*MARCA*/
    #{{ID}} .rev { position: absolute; left: 0; width: 1920px; top: 430px; text-align: center; font: 800 220px/1 "Inter Tight", sans-serif; letter-spacing: -0.045em; white-space: nowrap; }

    #{{ID}} .sub { position: absolute; left: 150px; top: 268px; }

    #{{ID}} .bar { position: absolute; top: 432px; width: 100px; background: #b0122f; transform-origin: top center; }
    #{{ID}} .anio { position: absolute; top: 380px; width: 120px; margin-left: -60px; text-align: center; font-size: 28px; }

  <div data-composition-id="{{ID}}" data-width="1920" data-height="1080">
    <div id="{{ID}}" class="esc">
      <div class="rev">AL REVÉS.</div>
      <div class="graf">
        <div class="nombre">AMAZON</div>
        <div class="mono sub"><b>Beneficio neto</b> · sus primeros años</div>
        <svg viewBox="0 0 1920 1080"><path class="cero" d="M300,430 L1620,430" pathLength="100" stroke-dasharray="100 100" style="fill:none;stroke:#f4f3f0;stroke-width:3"/></svg>
        <div class="mono nota">1995–2002 · forma aproximada · informes anuales</div>
      </div>

  </div>
  <script>
    (function () {
/*AYUDA*/
      // Pérdidas netas en millones de dólares, 1995–2002, a escala (la mayor, 480 px).
      const PERD = [0.3, 6, 31, 125, 720, 1411, 567, 149], graf = $(".graf");
      PERD.forEach((v, i) => {
        const x = 380 + i * 160;
        const b = document.createElement("div"); b.className = "bar"; b.style.left = x + "px"; b.style.height = Math.max(2, (v / 1411) * 480).toFixed(1) + "px"; graf.appendChild(b);
        const a = document.createElement("div"); a.className = "mono anio num"; a.style.left = x + 50 + "px"; a.textContent = 1995 + i; graf.appendChild(a);
      });
      // «Al revés»: entra boca abajo y se da la vuelta.
      tl.fromTo(".rev", { autoAlpha: 0, rotation: 180, scale: 0.8, transformOrigin: "50% 50%" }, { autoAlpha: 1, rotation: 0, scale: 1, duration: 0.65, ease: "expo.out" }, w("al", 2) - 0.25);
      tl.to(".rev", { autoAlpha: 0, scale: 0.9, duration: 0.3, ease: "power2.in" }, w("Ámazon") - 0.35);
      // Amazon y sus pérdidas, año a año.
      trocea(".nombre").forEach((s) => sube(s, w("Ámazon") - 0.1, 0.45));
      entra(".sub", w("perdió") - 0.1, 0.4, 10);
      traza(".cero", w("perdió") - 0.2, 0.5);
      tl.fromTo(".anio", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, stagger: 0.06 }, w("perdió"));
      tl.fromTo(".bar", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "expo.out", stagger: (f("años", 5) - w("dinero", 11)) / 8 }, w("dinero", 11) - 0.1);
      aparece(".nota", w("perdió"), 0.4, 0.9);
      // «Pero tenía algo a su favor».
      tl.to(".bar, .anio, .cero, .sub", { autoAlpha: 0.2, duration: 0.4, ease: "power2.inOut" }, w("Pero", 4) - 0.1);
      fin();
    })();
  </script>
</template>
