<template>
  <!-- R6 · 1966–1973: la línea blanca del beneficio, plana y tranquila (unos 35 M$ al año), y la roja de la caja de sus
       operaciones, que se hunde hasta −120 M$. Lo que queda entre las dos es el dinero atrapado: clientes y almacenes,
       los ladrones 1 y 2 del ciclo. Forma aproximada; solo se rotulan los extremos, que tienen fuente. -->
  <style>
/*MARCA*/
    #{{ID}} .graf { position: absolute; inset: 0; transform-origin: 960px 560px; }
    #{{ID}} svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #{{ID}} .cab { position: absolute; left: 150px; top: 110px; }
    #{{ID}} .lb { position: absolute; left: 300px; top: 236px; font: 800 64px/1 "Inter Tight", sans-serif; letter-spacing: -0.02em; }
    #{{ID}} .lbn { position: absolute; left: 680px; top: 256px; }
    #{{ID}} .fb { position: absolute; left: 1592px; top: 330px; font: 800 48px/1 "Inter Tight", sans-serif; letter-spacing: -0.02em; }
    #{{ID}} .lcj { position: absolute; left: 300px; top: 516px; }
    #{{ID}} .fc { position: absolute; right: 410px; top: 800px; padding: 10px 18px; background: #b0122f; font: 800 56px/1 "Inter Tight", sans-serif; letter-spacing: -0.02em; white-space: nowrap; }
    #{{ID}} .cero { position: absolute; left: 196px; top: 455px; font-size: 28px; }
    #{{ID}} .anio { position: absolute; top: 975px; width: 120px; margin-left: -60px; text-align: center; font-size: 28px; }
    #{{ID}} .atr { position: absolute; left: 1120px; top: 424px; padding: 6px 12px; background: #0a0b0d; }

  </style>
  <div data-composition-id="{{ID}}" data-width="1920" data-height="1080">
    <div id="{{ID}}" class="esc">
      <div class="graf">
        <svg viewBox="0 0 1920 1080">
          <defs><pattern id="{{ID}}-rayas" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">

          <polygon class="hueco" fill="url(#{{ID}}-rayas)"/>
          <path class="eje" d="M280,470 L1600,470" pathLength="100" stroke-dasharray="100 100" style="fill:none;stroke:#8a8d93;stroke-width:2"/>
          <path class="lp" pathLength="100" stroke-dasharray="100 100" style="fill:none;stroke:#f4f3f0;stroke-width:6;stroke-linejoin:round;stroke-linecap:round"/>
          <path class="lc" pathLength="100" stroke-dasharray="100 100" style="fill:none;stroke:#b0122f;stroke-width:8;stroke-linejoin:round;stroke-linecap:round"/>
        </svg>
        <div class="mono cero">0</div>
        <div class="lb">BENEFICIO</div>
        <div class="mono lbn"><b>≈ 35 M$</b> al año</div>
        <div class="fb num">+38 M$</div>
        <div class="mono lcj"><i>Caja</i> de sus operaciones</div>
        <div class="fc num">−120 M$</div>
        <div class="mono atr"><b>Atrapado</b></div>
        <div class="chip c1" style="top: 760px"><span class="lad">1</span>Lo que le debían los clientes</div>

    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      // Años 1966–1973; el cero en y = 470 y 3 px por millón. Forma aproximada (Largay y Stickney, 1980).
      const X = (i) => 300 + i * 180, Y = (v) => 470 - v * 3;
      const BEN = [34, 35, 36, 37, 37, 36, 35, 38], CAJ = [-5, -3, 3, 2, -14, -22, -30, -120];
      const camino = (vs) => vs.map((v, i) => (i ? "L" : "M") + X(i) + "," + Y(v)).join(" ");
      $(".lp").setAttribute("d", camino(BEN));
      $(".lc").setAttribute("d", camino(CAJ));
      $(".hueco").setAttribute("points", BEN.map((v, i) => X(i) + "," + Y(v)).concat(CAJ.map((v, i) => X(i) + "," + Y(v)).reverse()).join(" "));
      const graf = $(".graf");
      for (let i = 0; i < 8; i++) { const d = document.createElement("div"); d.className = "mono anio num"; d.style.left = X(i) + "px"; d.textContent = 1966 + i; graf.appendChild(d); }

      tl.fromTo(".graf", { scale: 1 }, { scale: 1.035, duration: DUR, ease: "none" }, 0);
      entra(".cab", 0.05, 0.4, 10);
      traza(".eje", 0.1, 0.6);
      aparece(".cero", 0.4, 0.3);
      tl.fromTo(".anio", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.05 }, 0.3);
      // «Todo iba bien»: el beneficio, plano, de 1966 a 1973.
      trocea(".lb").forEach((s) => sube(s, w("cuentas", 2) - 0.1, 0.45));
      traza(".lp", w("sesenta", 4) - 0.1, f("tres", 3) - w("sesenta", 4) + 0.2, "power1.inOut");
      entra(".lbn", w("treinta", 6) - 0.1, 0.4, 10);
      entra(".fb", f("tres", 3) - 0.1, 0.4, 10);
      // «Pero sus operaciones no generaron caja»: la línea roja se hunde.
      entra(".lcj", w("Pero", 3) - 0.1, 0.4, 10);
      traza(".lc", w("operaciones", 2) - 0.1, f("año", 3) - w("operaciones", 2) + 0.1, "power2.in");
      tl.fromTo(".fc", { autoAlpha: 0, scale: 1.25, transformOrigin: "right center" }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "expo.out" }, f("año", 3) - 0.05);
      // Lo que queda entre las dos líneas: el dinero atrapado.
      aparece(".hueco", w("atrapado") - 0.2, 0.6);
      entra(".atr", w("atrapado") - 0.05, 0.35, 8);
      entra(".c1", w("clientes", 2) - 0.2, 0.45, 16);
      entra(".c2", w("almacenes", 2) - 0.2, 0.45, 16);
      fin();
    })();
  </script>
