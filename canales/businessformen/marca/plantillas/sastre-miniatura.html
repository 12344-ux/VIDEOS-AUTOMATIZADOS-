<!doctype html>
<!-- BusinessForMen · miniatura de prueba de la ruta Sastre (se diseña a 1920 × 1080 y se entrega a 1280 × 720).
     Plantilla: la monta ../montar.py en miniaturas/sastre/. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>BusinessForMen · miniatura Sastre</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bodoni Moda"; src: url("assets/fonts/bodoni-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
      @font-face { font-family: "Bodoni Moda"; src: url("assets/fonts/bodoni-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Jost"; src: url("assets/fonts/jost-500.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .capa { position: absolute; inset: 0; }
      #foto { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; transform: scale(1.3); transform-origin: 78% 58%; }
      #root { background: #0e0c0c; color: #efe8dd; }
      #foto { filter: saturate(0.5) sepia(0.2) contrast(1.05) brightness(1.1); }
      #velo { background: linear-gradient(90deg, rgba(14, 12, 12, 0.97) 0%, rgba(14, 12, 12, 0.85) 42%, rgba(14, 12, 12, 0) 72%); }
      #ceja { position: absolute; left: 124px; top: 214px; display: flex; align-items: center; gap: 26px; font: 500 40px/1 "Jost", sans-serif; letter-spacing: 0.3em; }
      #ceja i { display: block; width: 90px; height: 3px; background: #8e1b2c; }
      #uno { position: absolute; left: 116px; top: 290px; font: italic 500 170px/1 "Bodoni Moda", serif; }
      #dos { position: absolute; left: 110px; top: 470px; font: 700 330px/0.9 "Bodoni Moda", serif; letter-spacing: -0.015em; }
      #raya { position: absolute; left: 124px; top: 800px; width: 860px; height: 16px; background: #8e1b2c; }
      #sello { position: absolute; left: 124px; top: 880px; width: 230px; height: 100px; background: #8e1b2c; display: flex; align-items: center; justify-content: center;
        font: italic 500 54px/1 "Bodoni Moda", serif; color: #efe8dd; outline: 2px dashed rgba(239, 232, 221, 0.5); outline-offset: -10px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <img id="foto" src="assets/img/mesa.jpg" alt="" />
      <div id="velo" class="capa"></div>
      <div id="ceja"><i></i>TU MAAN</div>
      <div id="uno">Deja de</div>
      <div id="dos">PEDIR.</div>
      <div id="raya"></div>
      <div id="sello">BfM</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 1);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
