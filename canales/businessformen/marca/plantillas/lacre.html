<!doctype html>
<!-- BusinessForMen · ruta 3, «Lacre»: editorial y contundente. Archivo Narrow en mayúsculas grandes (titulares),
     Instrument Serif en cursiva (el acento) y Archivo (etiquetas); negro, papel y un rojo lacre propio. Tipografía
     cinética al ritmo de la voz, un sello que se estampa y, de logo, un sello de lacre con las iniciales.
     Plantilla: la monta ../montar.py. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>BusinessForMen · ruta Lacre</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo Narrow"; src: url("assets/fonts/archivonarrow-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Archivo"; src: url("assets/fonts/archivo-500.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Archivo"; src: url("assets/fonts/archivo-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-400.woff2") format("woff2"); font-weight: 400; }
      :root { --negro: #0b0a0a; --papel: #f1ebe1; --rojo: #b3261e; --gris: #8e877d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--negro); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--negro); color: var(--papel); }
      .capa { position: absolute; inset: 0; }
      #b2, #b3, #b4 { opacity: 0; visibility: hidden; }
      #grano { background: url("assets/img/grano.png"); opacity: 0.09; mix-blend-mode: overlay; }
      .ceja { position: absolute; display: flex; align-items: center; gap: 22px; font: 600 28px/1 "Archivo", sans-serif;
        letter-spacing: 0.3em; color: var(--papel); }
      .ceja i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--rojo); }
      .grande { font: 700 196px/0.9 "Archivo Narrow", sans-serif; text-transform: uppercase; letter-spacing: 0.002em; white-space: nowrap; }
      .serif { font: italic 400 124px/1 "Instrument Serif", serif; white-space: nowrap; }
      .pal { display: inline-block; margin-right: 0.18em; }
      /* 1 · la mesa */
      #foto { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; transform-origin: 70% 52%;
        filter: saturate(0.65) sepia(0.28) contrast(1.08) brightness(0.98); }
      #tinte { background: rgba(120, 22, 16, 0.16); mix-blend-mode: multiply; }
      #velo { background: linear-gradient(90deg, rgba(11, 10, 10, 0.93) 0%, rgba(11, 10, 10, 0.6) 42%, rgba(11, 10, 10, 0) 72%); }
      #punto { display: inline-block; width: 0.2em; height: 0.2em; border-radius: 50%; background: var(--rojo); margin-left: 0.04em; }
      /* 2 · la MAAN */
      .col { position: absolute; top: 300px; width: 400px; text-align: center; }
      .letra { display: block; font: 700 400px/0.86 "Archivo Narrow", sans-serif; color: var(--papel); }
      .sig { display: block; margin-top: 34px; font: italic 400 70px/1 "Instrument Serif", serif; color: var(--papel); }
      #aun { position: absolute; top: 790px; left: 900px; width: 120px; text-align: center; font: italic 400 46px/1 "Instrument Serif", serif; color: var(--gris); }
      #nota { position: absolute; left: 150px; top: 990px; font: 500 24px/1 "Archivo", sans-serif; letter-spacing: 0.24em; color: var(--gris); }
      /* 3 · negociar o pedir */
      #pre { position: absolute; left: 150px; top: 170px; font: 700 84px/1 "Archivo Narrow", sans-serif; letter-spacing: 0.02em; color: var(--gris); }
      #neg { position: absolute; left: 150px; top: 270px; font-size: 150px; }
      #n3 { position: relative; }
      #tacha { position: absolute; left: -0.02em; right: -0.02em; top: 46%; height: 20px; background: var(--rojo); transform-origin: left center; }
      #estas { position: absolute; left: 150px; top: 540px; }
      #sello { position: absolute; left: 760px; top: 528px; padding: 18px 40px 10px; border: 10px solid var(--rojo); border-radius: 10px;
        font: 700 230px/0.9 "Archivo Narrow", sans-serif; text-transform: uppercase; color: var(--rojo); transform: rotate(-5deg);
        -webkit-mask-image: url("assets/img/desgaste.png"); mask-image: url("assets/img/desgaste.png"); -webkit-mask-size: 360px; mask-size: 360px; }
      /* 4 · el logo: un sello de lacre */
      #lacre { position: absolute; left: 810px; top: 190px; width: 300px; height: 300px; }
      #lacre svg { width: 300px; height: 300px; overflow: visible; }
      #lacre .ini { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font: italic 400 112px/1 "Instrument Serif", serif; color: #6d120c; letter-spacing: -0.01em;
        text-shadow: 0 2px 0 rgba(255, 190, 170, 0.28), 0 -2px 2px rgba(0, 0, 0, 0.45); }
      #nombre { position: absolute; left: 0; width: 1920px; top: 560px; text-align: center; font: 700 120px/1 "Archivo Narrow", sans-serif;
        letter-spacing: 0.08em; text-transform: uppercase; }
      #nombre span { display: inline-block; }
      #lema { position: absolute; left: 0; width: 1920px; top: 712px; text-align: center; font: italic 400 58px/1 "Instrument Serif", serif; color: var(--gris); }
      #ia { position: absolute; right: 64px; bottom: 50px; font: 500 28px/1 "Archivo", sans-serif; letter-spacing: 0.06em; color: var(--gris); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1920" data-height="1080">
      <!-- 1 · «Gana quien puede levantarse de la mesa»: palabras grandes, una a una, y el punto de lacre -->
      <div id="b1" class="capa">
        <img id="foto" src="assets/img/mesa.jpg" alt="" />
        <div id="tinte" class="capa"></div>
        <div id="velo" class="capa"></div>
        <div id="c1" class="ceja" style="left: 154px; top: 286px"><i></i><span>NEGOCIACIÓN</span></div>
        <div class="grande" style="position: absolute; left: 150px; top: 350px"><span id="w1" class="pal">Gana</span><span id="w2" class="pal">quien</span><span id="w3" class="pal">puede</span></div>
        <div class="serif" style="position: absolute; left: 156px; top: 560px"><span id="w4" class="pal">levantarse</span><span id="w5" class="pal">de la mesa<span id="punto"></span></span></div>
      </div>
      <!-- 2 · la MAAN: cuatro letras enormes; cada una se enciende en rojo cuando la voz dice su palabra -->
      <div id="b2" class="capa">
        <div id="c2" class="ceja" style="left: 154px; top: 170px"><i></i><span>PROYECTO DE NEGOCIACIÓN DE HARVARD</span></div>
        <div class="col" style="left: 110px"><span id="l1" class="letra">M</span><span id="s1" class="sig">mejor</span></div>
        <div class="col" style="left: 520px"><span id="l2" class="letra">A</span><span id="s2" class="sig">alternativa</span></div>
        <div class="col" style="left: 1000px"><span id="l3" class="letra">A</span><span id="s3" class="sig">acuerdo</span></div>
        <div class="col" style="left: 1410px"><span id="l4" class="letra">N</span><span id="s4" class="sig">negociado</span></div>
        <div id="aun">a un</div>
        <div id="nota">EN INGLÉS, BATNA</div>
      </div>
      <!-- 3 · «Si no la conoces, no estás negociando. Estás pidiendo.»: se tacha y se estampa el sello -->
      <div id="b3" class="capa">
        <div id="pre">SI NO LA CONOCES,</div>
        <div id="neg" class="grande"><span id="n1" class="pal">no</span><span id="n2" class="pal">estás</span><span id="n3" class="pal">negociando.<i id="tacha"></i></span></div>
        <div id="estas" class="grande"><span id="p1">Estás</span></div>
        <div id="sello">pidiendo.</div>
      </div>
      <!-- 4 · el logo -->
      <div id="b4" class="capa">
        <div id="lacre">
          <svg viewBox="0 0 300 300">
            <defs>
              <radialGradient id="cera" cx="42%" cy="36%" r="70%"><stop offset="0" stop-color="#d4473a"/><stop offset="0.55" stop-color="#b3261e"/><stop offset="1" stop-color="#6e130d"/></radialGradient>
              <radialGradient id="hueco" cx="50%" cy="50%" r="50%"><stop offset="0.7" stop-color="#9c1f17"/><stop offset="1" stop-color="#7a1610"/></radialGradient>
            </defs>
            <path id="gota" fill="url(#cera)"/>
            <circle cx="150" cy="150" r="104" fill="url(#hueco)"/>
            <circle cx="150" cy="150" r="104" fill="none" stroke="#e0685a" stroke-opacity="0.35" stroke-width="2"/>
            <circle cx="150" cy="150" r="92" fill="none" stroke="#5a0f0a" stroke-opacity="0.55" stroke-width="2"/>
          </svg>
          <div class="ini">BfM</div>
        </div>
        <div id="nombre"><span>B</span><span>u</span><span>s</span><span>i</span><span>n</span><span>e</span><span>s</span><span>s</span><span>F</span><span>o</span><span>r</span><span>M</span><span>e</span><span>n</span></div>
        <div id="lema">Mentalidad de negocios.</div>
        <div id="ia">Voz generada con IA</div>
      </div>
      <div id="grano" class="capa"></div>

      <!-- Sonido -->
      <audio id="voz" class="clip" src="assets/audio/voz.wav" data-start="{{VOZ0}}" data-duration="{{e:FINVOZ - VOZ0}}" data-track-index="10"
        data-volume="1"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;highpass&quot;,&quot;id&quot;:&quot;v1&quot;,&quot;params&quot;:{&quot;frequency&quot;:90}},{&quot;type&quot;:&quot;peaking&quot;,&quot;id&quot;:&quot;v2&quot;,&quot;params&quot;:{&quot;frequency&quot;:3000,&quot;gain&quot;:2,&quot;q&quot;:1}},{&quot;type&quot;:&quot;limiter&quot;,&quot;id&quot;:&quot;v3&quot;,&quot;params&quot;:{&quot;limit&quot;:-1}}]}"></audio>
      <audio id="musica" class="clip" src="assets/audio/musica.wav" data-start="0" data-duration="{{DUR}}" data-track-index="11"
        data-timeline-role="music"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.4,&quot;v&quot;:0.42},{&quot;t&quot;:1.0,&quot;v&quot;:0.3},{&quot;t&quot;:{{e:FINVOZ}},&quot;v&quot;:0.3},{&quot;t&quot;:{{e:FINVOZ + 0.4}},&quot;v&quot;:0.64},{&quot;t&quot;:{{e:DUR - 0.9}},&quot;v&quot;:0.6},{&quot;t&quot;:{{DUR}},&quot;v&quot;:0}]}]}"></audio>
      <audio id="s-punto" class="clip" src="assets/sfx/click-soft.mp3" data-start="{{e:f('mesa') - 0.05}}" data-duration="0.37" data-track-index="12" data-volume="0.22"></audio>
      <audio id="s-maan" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="{{e:w('maan') - 0.08}}" data-duration="1.6" data-track-index="13" data-volume="0.2"></audio>
      <audio id="s-tacha" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="{{e:f('negociando') - 0.04}}" data-duration="0.57" data-track-index="14" data-volume="0.2"></audio>
      <audio id="s-sello" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="{{e:w('pidiendo') + 0.1}}" data-duration="1.8" data-track-index="15" data-volume="0.4"></audio>
      <audio id="s-lacre" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="{{e:FINVOZ + 0.5}}" data-duration="1.6" data-track-index="16" data-volume="0.34"></audio>
    </div>
    <script>
      (function () {
        const W = { neg: {{w:negociación}}, gana: {{w:gana}}, quien: {{w:quien}}, puede: {{w:puede}}, lev: {{w:levantarse}}, de: {{w:de}},
          mesaf: {{f:mesa}}, harvard: {{w:Járvard}}, maan: {{w:maan}}, mejor: {{w:mejor}}, alt: {{w:alternativa}}, a: {{w:a}},
          acuerdo: {{w:acuerdo}}, nego: {{w:negociado}}, negof: {{f:negociado}}, si: {{w:Si}}, no2: {{w:no#2}}, estas1: {{w:estás}},
          negociando: {{w:negociando}}, negociandof: {{f:negociando}}, estas2: {{w:estás#2}}, pidiendo: {{w:pidiendo}}, fin: {{FINVOZ}} };
        const T12 = W.harvard - 0.35, T23 = W.si - 0.3, T34 = W.fin + 0.15, DUR = {{DUR}};
        // El borde de la gota de lacre: un círculo deformado con armónicos fijos (el mismo en cada render).
        let d = "";
        for (let k = 0; k <= 96; k++) {
          const a = (k / 96) * Math.PI * 2, r = 136 + 7 * Math.sin(3 * a + 0.6) + 4 * Math.sin(7 * a + 1.9) + 2.5 * Math.sin(13 * a);
          d += (k ? "L" : "M") + (150 + r * Math.cos(a)).toFixed(1) + "," + (150 + r * Math.sin(a)).toFixed(1);
        }
        document.getElementById("gota").setAttribute("d", d + "Z");
        const tl = gsap.timeline({ paused: true });
        const golpe = (sel, t) => tl.fromTo(sel, { autoAlpha: 0, scale: 1.18, filter: "blur(8px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out", transformOrigin: "left bottom" }, t);
        // 1 · la mesa, cálida, con la sombra teñida de rojo; las palabras golpean una a una.
        tl.fromTo("#foto", { scale: 1.06 }, { scale: 1.12, duration: T12 - 0.3, ease: "sine.inOut" }, 0);
        tl.fromTo("#c1", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.neg - 0.1);
        golpe("#w1", W.gana - 0.06); golpe("#w2", W.quien - 0.06); golpe("#w3", W.puede - 0.06);
        tl.fromTo("#w4", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.lev - 0.08);
        tl.fromTo("#w5", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out" }, W.de - 0.08);
        tl.fromTo("#punto", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, W.mesaf - 0.05);
        // Paso: la foto se acerca de golpe y se va a negro mientras entran las letras.
        tl.to("#foto", { scale: 1.5, duration: 0.35, ease: "power3.in" }, T12 - 0.3);
        tl.to("#b1", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, T12 - 0.25);
        // 2 · la MAAN: las letras caen en «maan»; cada una se enciende con su palabra, que aparece debajo.
        tl.fromTo("#b2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, T12);
        tl.fromTo("#c2", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.harvard - 0.05);
        tl.fromTo("#b2 .letra", { autoAlpha: 0, yPercent: -18, scale: 1.12 }, { autoAlpha: 1, yPercent: 0, scale: 1, duration: 0.34, ease: "power4.out", stagger: 0.07 }, W.maan - 0.1);
        const enciende = (l, s, t) => {
          tl.fromTo(l, { color: "#f1ebe1" }, { color: "#b3261e", duration: 0.25, ease: "power2.out" }, t);
          tl.fromTo(s, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
        };
        enciende("#l1", "#s1", W.mejor - 0.06); enciende("#l2", "#s2", W.alt - 0.06); enciende("#l3", "#s3", W.acuerdo - 0.06); enciende("#l4", "#s4", W.nego - 0.06);
        tl.fromTo("#aun", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, W.a - 0.04);
        tl.fromTo("#nota", { autoAlpha: 0 }, { autoAlpha: 0.85, duration: 0.5 }, W.maan + 0.5);
        tl.to("#b2", { autoAlpha: 0, duration: 0.25, ease: "power2.in" }, T23 - 0.2);
        // 3 · la frase cae palabra a palabra; «negociando» se tacha; «pidiendo» se estampa como un sello.
        tl.fromTo("#b3", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, T23);
        tl.fromTo("#pre", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, W.si - 0.06);
        golpe("#n1", W.no2 - 0.06); golpe("#n2", W.estas1 - 0.06); golpe("#n3", W.negociando - 0.06);
        tl.fromTo("#tacha", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, W.negociandof + 0.02);
        tl.to("#neg", { opacity: 0.35, duration: 0.5 }, W.negociandof + 0.3);
        golpe("#p1", W.estas2 - 0.06);
        tl.fromTo("#sello", { autoAlpha: 0, scale: 1.7, rotation: -11 }, { autoAlpha: 1, scale: 1, rotation: -5, duration: 0.2, ease: "power4.in" }, W.pidiendo - 0.08);
        tl.fromTo("#b3", { x: 0 }, { keyframes: [{ x: -9, duration: 0.04 }, { x: 7, duration: 0.05 }, { x: -3, duration: 0.05 }, { x: 0, duration: 0.06 }] }, W.pidiendo + 0.12);
        tl.to("#b3", { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, T34 - 0.25);
        // 4 · el sello de lacre se estampa, el nombre se compone letra a letra y llega el lema.
        tl.fromTo("#b4", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, T34);
        tl.fromTo("#lacre", { autoAlpha: 0, scale: 1.6, rotation: -14 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.34, ease: "power4.in" }, T34 + 0.05);
        tl.fromTo("#nombre span", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.03 }, T34 + 0.55);
        tl.fromTo("#lema", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: "power3.out" }, T34 + 1.15);
        tl.fromTo("#ia", { autoAlpha: 0 }, { autoAlpha: 0.75, duration: 0.5 }, T34 + 0.9);
        tl.to("#b4", { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, DUR - 0.55);
        const F = Math.round(DUR * 30);
        tl.fromTo("#grano", { backgroundPosition: "0px 0px" }, { backgroundPosition: `${137 * F}px ${251 * F}px`, duration: DUR, ease: `steps(${F})` }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
