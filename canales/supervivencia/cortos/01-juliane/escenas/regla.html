<template>
  <!-- La regla del padre, en una ficha a máquina.
       oculta  «le había enseñado una regla»: la ficha con la regla tachada en negro; «Una sola»: 1; «salvar la vida»: la
               barra late en naranja (el bucle abierto, que se cierra 13 s después)
       revela  «si te pierdes en la selva»: la primera línea, a máquina; «busca el agua»: la barra se va y aparece la regla;
               «El agua lleva a un río. Y el río, a la gente»: la cadena AGUA → RÍO → GENTE -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} .fondo { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; visibility: hidden; filter: brightness(0.55); }
    #{{ID}} .ficha { position: absolute; left: 60px; top: 330px; width: 960px; padding: 60px 64px 68px; background: #ebe4d6; color: #141210;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6); visibility: hidden; }
    #{{ID}} .ficha::after { content: ""; position: absolute; inset: 0; background: url("assets/img/grano.png"); opacity: 0.18; mix-blend-mode: multiply; }
    #{{ID}} .cab { font: 400 40px/1.2 "Special Elite", monospace; letter-spacing: 0.12em; color: #8a3b14; }
    #{{ID}} .linea { font: 400 62px/1.3 "Special Elite", monospace; margin-top: 34px; min-height: 81px; white-space: nowrap; }
    #{{ID}} .tapada { position: relative; display: inline-block; font: 800 136px/1 "Barlow Condensed", sans-serif; text-transform: uppercase;
      margin-top: 26px; color: #c2410c; }
    #{{ID}} .barra { position: absolute; left: -10px; right: -10px; top: 6px; bottom: 0; background: #141210; transform-origin: right center; }
    #{{ID}} .uno { position: absolute; right: 90px; top: 820px; font: 800 340px/0.84 "Barlow Condensed", sans-serif; color: #ff5e1a; visibility: hidden; }
    #{{ID}} .cadena { position: absolute; left: 60px; top: 700px; width: 960px; display: flex; align-items: center; gap: 24px; }
    #{{ID}} .eslabon { font: 800 104px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; text-shadow: 0 4px 28px rgba(0, 0, 0, 0.85);
      visibility: hidden; }
    #{{ID}} .flecha { font: 800 80px/1 "Barlow", sans-serif; color: #ff5e1a; visibility: hidden; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc" data-modo="{{p:modo}}">
      <img class="fondo" src="assets/img/arroyo.jpg" alt="" />
      <div class="ficha">
        <div class="cab">La regla de su padre</div>
        <div class="linea"><span class="t"></span></div>
        <div class="tapada">Busca el agua<div class="barra"></div></div>
      </div>
      <div class="uno">1</div>
      <div class="cadena">
        <div class="eslabon e1">Agua</div><div class="flecha f1">→</div>
        <div class="eslabon e2">Río</div><div class="flecha f2">→</div>
        <div class="eslabon e3 bengala">Gente</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const modo = RAIZ.dataset.modo;
      const escribe = (texto, t0, t1) => {
        const el = $(".linea .t");
        alBuscar((t) => { const k = Math.round(texto.length * Math.min(1, Math.max(0, (t - t0) / (t1 - t0)))); el.textContent = texto.slice(0, k); });
      };
      if (modo === "oculta") {
        tl.fromTo($(".ficha"), { autoAlpha: 0, y: 60, rotation: -2 }, { autoAlpha: 1, y: 0, rotation: -1, duration: 0.45, ease: "expo.out" }, w("regla") - 0.35);
        tl.fromTo($(".barra"), { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, w("regla") + 0.05);
        tl.fromTo($(".uno"), { autoAlpha: 0, scale: 1.4 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "power4.in" }, w("Una", 3) - 0.08);
        tl.fromTo($(".barra"), { backgroundColor: "#141210" }, { keyframes: [{ backgroundColor: "#ff5e1a", duration: 0.2 }, { backgroundColor: "#141210", duration: 0.25 }, { backgroundColor: "#ff5e1a", duration: 0.2 }, { backgroundColor: "#141210", duration: 0.25 }] }, w("salvar") - 0.05);
      } else {
        tl.fromTo($(".ficha"), { autoAlpha: 0, y: 40, rotation: -1 }, { autoAlpha: 1, y: 0, rotation: -1, duration: 0.35, ease: "expo.out" }, 0.02);
        gsap.set($(".barra"), { scaleX: 1 });
        escribe("Si te pierdes en la selva,", w("si") - 0.05, f("selva", 2) + 0.05);
        tl.to($(".barra"), { scaleX: 0, duration: 0.35, ease: "power3.inOut" }, w("busca") - 0.08);
        tl.fromTo($(".tapada"), { scale: 1 }, { scale: 1.06, duration: 0.15, yoyo: true, repeat: 1, transformOrigin: "left center" }, w("agua") - 0.05);
        // «El agua lleva a un río»: el arroyo aparece detrás y la ficha sube para dejarle sitio.
        tl.fromTo($(".fondo"), { autoAlpha: 0, scale: 1.12 }, { autoAlpha: 1, scale: 1.0, duration: 1.6, ease: "power2.out" }, w("agua", 2) - 0.3);
        tl.to($(".ficha"), { y: -70, scale: 0.82, transformOrigin: "left top", duration: 0.5, ease: "expo.inOut" }, w("agua", 2) - 0.3);
        [["e1", w("agua", 2)], ["f1", w("río") - 0.1], ["e2", w("río")], ["f2", w("gente") - 0.1], ["e3", w("gente")]].forEach(([c, t]) =>
          tl.fromTo($("." + c), { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.25, ease: "expo.out" }, t - 0.06));
      }
      fin();
    })();
  </script>
</template>
