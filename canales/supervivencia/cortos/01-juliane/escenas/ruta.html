  <script>
    (function () {

      const A = {{p:lima}}, B = {{p:pucallpa}};

      const txt = { n: 0 }, todo = partes.map((p) => p[0]).join("");

      entra($(".l-lima"), w("Yuliane"), 0.3, 10);

      $(".ruta").setAttribute("d", `M${A[0]},${A[1]} L${B[0]},${B[1]}`);
      tl.fromTo($(".ruta"), { autoAlpha: 0, strokeDashoffset: 200 }, { autoAlpha: 1, strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, w("vuela") - 0.1);
      gsap.set($(".avion"), { left: A[0], top: A[1], rotation: ang });
      tl.set($(".avion"), { visibility: "visible" }, w("vuela"));
      tl.fromTo($(".avion"), { x: 0, y: 0 }, { x: 0.8 * (B[0] - A[0]), y: 0.8 * (B[1] - A[1]), duration: f("padre") - w("vuela"), ease: "power1.inOut", immediateRender: false }, w("vuela"));
