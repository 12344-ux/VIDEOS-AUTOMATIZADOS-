<template>
  <!-- El corte del mar, dibujado (no a escala de barco: la profundidad sí, 22 px por metro). Modos:
       vuelco  el remolcador se mece; «baño»: Harrison, dentro; «vuelca»: da la vuelta; «hunde»: baja boca abajo hasta
               el fondo, con la sonda de 0 a 30 m; «fondo»: toca la arena
       bolsa   de cerca, a oscuras; «aire»: la bolsa atrapada contra el casco, con Harrison dentro; «casco»: el casco
       camara  «presión»: PRESIÓN ×4; «subir»: la flecha hacia la superficie; «mataría»: tachada; «cámara»: la cámara de
               descompresión con él dentro; «días»: MÁS DE 2 DÍAS -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} svg.corte { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #{{ID}} .agua { fill: url(#agua-{{ID}}); }
    #{{ID}} .arena { fill: #231e19; stroke: #3b3731; stroke-width: 3; }
    #{{ID}} .ola { fill: none; stroke: rgba(190, 220, 220, 0.55); stroke-width: 4; }
    #{{ID}} .casco { fill: #2b2621; stroke: #8c8174; stroke-width: 3; }
    #{{ID}} .cabina { fill: #24201c; stroke: #8c8174; stroke-width: 3; }
    #{{ID}} .ventana { fill: #e9c27a; opacity: 0.85; }
    #{{ID}} .interior { fill: rgba(9, 22, 24, 0.92); }
    #{{ID}} .bolsa { fill: rgba(205, 230, 228, 0.42); }
    #{{ID}} .persona { fill: #ff5e1a; }
    #{{ID}} .regla line { stroke: rgba(242, 237, 228, 0.55); stroke-width: 3; }
    #{{ID}} .regla text { fill: rgba(242, 237, 228, 0.75); font: 400 30px "Special Elite", monospace; }
    #{{ID}} .flecha { fill: none; stroke: #f2ede4; stroke-width: 6; stroke-dasharray: 18 14; }
    #{{ID}} .cruz { stroke: #ff5e1a; stroke-width: 14; stroke-linecap: round; }
    #{{ID}} .camara-d .cil { fill: #2b2621; stroke: #8c8174; stroke-width: 4; }
    #{{ID}} .camara-d .ojo { fill: #0b0a09; stroke: #8c8174; stroke-width: 4; }
    #{{ID}} .camara-d .ojo-luz { fill: rgba(233, 194, 122, 0.55); }
    #{{ID}} .prof { position: absolute; left: 130px; top: 0; font: 800 64px/1 "Barlow Condensed", sans-serif; color: #ff5e1a;
      text-shadow: 0 3px 20px rgba(0, 0, 0, 0.9); visibility: hidden; white-space: nowrap; }
    #{{ID}} .nota { position: absolute; font: 400 44px/1.25 "Special Elite", monospace; text-shadow: 0 3px 20px rgba(0, 0, 0, 0.95); visibility: hidden;
      white-space: nowrap; }
    #{{ID}} .et { position: absolute; font: 800 56px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.03em; visibility: hidden;
      white-space: nowrap; }
    #{{ID}} .et span { display: inline-block; background: rgba(11, 10, 9, 0.88); padding: 0.1em 0.3em 0.04em; border-left: 6px solid #ff5e1a; }
    #{{ID}} .sello { position: absolute; font: 800 110px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; visibility: hidden; white-space: nowrap; }
    #{{ID}} .sello span { display: inline-block; background: #ff5e1a; color: #0b0a09; padding: 0.04em 0.14em 0; }
    #{{ID}} .oscuro { position: absolute; inset: 0; background: #050606; opacity: 0; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc" data-modo="{{p:modo}}">
      <svg class="corte" viewBox="0 0 1080 1920">
        <defs>
          <linearGradient id="agua-{{ID}}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#12302f" /><stop offset="1" stop-color="#060c0d" />
          </linearGradient>
        </defs>
        <g class="mundo">
          <rect class="agua" x="-400" y="480" width="1880" height="1600" />
          <path class="arena" d="M-400,1112 C-100,1090 120,1130 380,1106 C620,1084 820,1126 1080,1102 C1250,1090 1400,1110 1480,1106 L1480,2100 L-400,2100 Z" />
          <path class="ola" />
          <g class="regla">
            <line x1="90" y1="480" x2="90" y2="1100" />
            <line x1="76" y1="480" x2="104" y2="480" /><line x1="80" y1="687" x2="100" y2="687" />
            <line x1="80" y1="893" x2="100" y2="893" /><line x1="76" y1="1100" x2="104" y2="1100" />
            <text class="cero" x="114" y="470">0 m</text>
          </g>
          <g class="tug">
            <path class="casco" d="M-205,-18 L205,-18 L176,46 Q140,74 0,78 Q-150,75 -190,38 Z" />
            <path class="interior" d="M-182,-8 L182,-8 L160,40 Q128,64 0,67 Q-138,64 -170,34 Z" style="opacity: 0" />
            <path class="bolsa" d="M-150,40 L150,40 Q124,63 0,66 Q-130,63 -150,40 Z" style="opacity: 0" />
            <rect class="cabina" x="-70" y="-112" width="160" height="94" />
            <rect class="ventana" x="-52" y="-92" width="26" height="22" /><rect class="ventana" x="-14" y="-92" width="26" height="22" />
            <rect class="ventana" x="24" y="-92" width="26" height="22" /><rect class="ventana" x="62" y="-92" width="16" height="22" />
            <rect class="cabina" x="22" y="-160" width="20" height="48" />
            <circle class="persona" cx="-120" cy="22" r="10" style="opacity: 0" />
          </g>
          <path class="flecha" style="visibility: hidden" />
          <g class="cruz-g" style="visibility: hidden"><line class="cruz" x1="-40" y1="-40" x2="40" y2="40" /><line class="cruz" x1="40" y1="-40" x2="-40" y2="40" /></g>
        </g>
        <g class="camara-d" style="visibility: hidden" transform="translate(0,-120)">
          <rect class="cil" x="170" y="760" width="740" height="330" rx="165" />
          <circle class="ojo" cx="300" cy="925" r="54" /><circle class="ojo-luz" cx="300" cy="925" r="40" />
          <circle class="ojo" cx="780" cy="925" r="54" /><circle class="ojo-luz" cx="780" cy="925" r="40" />
          <rect class="cil" x="905" y="850" width="40" height="150" rx="8" />
          <circle class="persona" cx="540" cy="925" r="16" />
        </g>
      </svg>
      <div class="oscuro"></div>
      <div class="prof num"></div>
      <div class="nota n1"></div>
      <div class="et e1"><span></span></div><div class="et e2"><span></span></div>
      <div class="sello s1"><span></span></div><div class="sello s2"><span></span></div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const modo = RAIZ.dataset.modo;
      const tug = $(".tug"), mundo = $(".mundo");
      const X0 = 560, Y0 = 480, YF = 950;           // el remolcador: a flote y en el fondo (boca abajo)
      const PXM = 620 / 30;                         // píxeles por metro de profundidad (de 480 a 1100)
      const pos = (y, giro) => tug.setAttribute("transform", `translate(${X0},${y}) rotate(${giro})`);
      const olas = (t, alto) => {
        let d = "M-400,480";
        for (let x = -400; x <= 1480; x += 40) d += ` L${x},${(480 + alto * Math.sin(x / 70 + t * 2.6) + alto * 0.5 * Math.sin(x / 31 - t * 3.4)).toFixed(1)}`;
        $(".ola").setAttribute("d", d);
      };
      const nota = (sel, html, x, y, t) => { const e = $(sel); e.innerHTML = html; gsap.set(e, { left: x, top: y }); entra(e, t, 0.35, 12); };
      const etiqueta = (sel, txt, x, y, t) => { const e = $(sel); e.querySelector("span").innerHTML = txt; gsap.set(e, { left: x, top: y }); tl.fromTo(e, { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, t - 0.08); };
      const sello = (sel, txt, x, y, t) => {
        const e = $(sel); e.querySelector("span").textContent = txt; gsap.set(e, { left: x, top: y });
        tl.fromTo(e, { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power4.in" }, t - 0.1);
      };
      // La profundidad en la sonda: el rótulo sigue al remolcador.
      const prof = $(".prof");
      const pinta = (m) => { prof.textContent = Math.round(m) ? `−${Math.round(m)} m` : "0 m"; prof.style.top = (480 + m * PXM - 34) + "px"; };
      if (modo === "vuelco") {
        const tv = w("vuelca") - 0.15, th = w("hunde") - 0.1, tf = w("fondo", 2) + 0.05;
        // A flote se mece; al volcar gira 180°; al hundirse baja hasta el fondo (con un rebote en la arena).
        alBuscar((t) => {
          const a = 6 * Math.sin(t * 2.2) * (t < tv ? 1 : Math.max(0, 1 - (t - tv) / 0.6));
          const g = t < tv ? 0 : 180 * paso(t, tv, 0.9, "power2.inOut");
          const k = t < th ? 0 : paso(t, th, tf - th, "power2.in");
          const rebote = t > tf ? 10 * Math.exp(-(t - tf) * 6) * Math.sin((t - tf) * 18) : 0;
          pos(Y0 + (YF - Y0) * k - rebote, g + a);
          olas(t, t < tv + 1.2 ? 16 : 10);
          const m = 30 * Math.max(0, Math.min(1, ((Y0 + (YF - Y0) * k) - Y0) / (YF - Y0)));
          pinta(m);
        });
        tl.fromTo(mundo, { scale: 1.06, transformOrigin: "52% 40%" }, { scale: 1.0, duration: DUR, ease: "power2.out" }, 0);
        tl.fromTo($(".tug .persona"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, w("levanta") - 0.1);
        tl.fromTo($(".tug .persona"), { scale: 1, transformOrigin: "50% 50%" }, { keyframes: [{ scale: 1.8, duration: 0.15 }, { scale: 1, duration: 0.25 }] }, w("baño"));
        nota(".n1", "Harrison, en el baño", 300, 300, w("levanta") - 0.05);
        tl.to($(".n1"), { autoAlpha: 0, duration: 0.2 }, tv - 0.1);
        tl.fromTo(RAIZ, { x: 0, y: 0 }, { keyframes: [{ x: -10, y: 6, duration: 0.05 }, { x: 8, y: -5, duration: 0.05 }, { x: -3, y: 2, duration: 0.05 }, { x: 0, y: 0, duration: 0.07 }] }, tv + 0.25);
        tl.set(prof, { visibility: "visible" }, th);
        tl.to($(".cero"), { autoAlpha: 0, duration: 0.15 }, th);
        tl.to($(".ventana"), { opacity: 0.15, duration: 0.5 }, th + 0.3);
      } else if (modo === "bolsa") {
        // De cerca y boca abajo en el fondo; a oscuras; «aire»: la bolsa contra el casco, con él dentro.
        pos(YF, 180); olas(0, 10); pinta(30);
        gsap.set($(".ventana"), { opacity: 0.12 });
        gsap.set($(".tug .persona"), { opacity: 1, attr: { cx: -40, cy: 52 } });
        gsap.set(mundo, { svgOrigin: "0 0" });
        tl.fromTo(mundo, { scale: 2.0, x: 540 - X0 * 2.0, y: 760 - (YF - 30) * 2.0 }, { scale: 2.2, x: 540 - X0 * 2.2, y: 760 - (YF - 30) * 2.2, duration: DUR, ease: "none" }, 0);
        tl.fromTo($(".oscuro"), { opacity: 0 }, { opacity: 0.7, duration: 0.5, ease: "power2.out" }, Math.max(0, w("oscuras") - 0.2));
        tl.fromTo($(".interior"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, Math.max(0, w("oscuras") - 0.2));
        tl.to($(".oscuro"), { opacity: 0.25, duration: 0.6, ease: "power2.out" }, w("aire") - 0.1);
        tl.fromTo($(".bolsa"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, w("aire") - 0.1);
        tl.fromTo($(".tug .persona"), { scale: 1, transformOrigin: "50% 50%" }, { keyframes: [{ scale: 1.6, duration: 0.15 }, { scale: 1, duration: 0.25 }] }, w("aire"));
        etiqueta(".e1", "Bolsa de aire · 1,2 <span style=\"text-transform: none\">m</span>", 230, 420, w("bolsa"));
        tl.to($(".casco"), { stroke: "#ff5e1a", duration: 0.2, yoyo: true, repeat: 1 }, w("casco") - 0.05);
      } else {
        // La presión y la cámara de descompresión.
        pos(YF, 180); olas(0, 10); pinta(30);
        gsap.set($(".ventana"), { opacity: 0.12 });
        gsap.set(prof, { visibility: "visible" });
        gsap.set($(".tug .persona"), { opacity: 1, attr: { cx: -40, cy: 52 } });
        alBuscar((t) => olas(t, 10));
        const P = [X0 + 40, YF - 52];              // él (el casco está girado 180°)
        sello(".s1", "Presión ×4", 300, 300, w("presión"));
        $(".flecha").setAttribute("d", `M${P[0]},${P[1] - 30} L${P[0]},520`);
        tl.set($(".flecha"), { visibility: "visible" }, w("subir") - 0.1);
        tl.fromTo($(".flecha"), { strokeDashoffset: 0, opacity: 0 }, { opacity: 1, duration: 0.2 }, w("subir") - 0.1);
        tl.fromTo($(".flecha"), { attr: { d: `M${P[0]},${P[1] - 30} L${P[0]},${P[1] - 40}` } }, { attr: { d: `M${P[0]},${P[1] - 30} L${P[0]},520` }, duration: 0.9, ease: "power2.inOut" }, w("subir") - 0.1);
        gsap.set($(".cruz-g"), { x: P[0], y: 700 });
        tl.set($(".cruz-g"), { visibility: "visible" }, w("mataría") - 0.05);
        tl.fromTo($(".cruz-g"), { scale: 1.6, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.in" }, w("mataría") - 0.05);
        tl.to($(".flecha"), { stroke: "#ff5e1a", duration: 0.15 }, w("mataría") - 0.05);
        // «Pasa más de dos días en una cámara de descompresión»
        const tc = w("Pasa", 3) - 0.15;
        tl.to([mundo, prof, $(".s1")], { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, tc);
        tl.set($(".camara-d"), { visibility: "visible" }, tc + 0.2);
        tl.fromTo($(".camara-d"), { opacity: 0, scale: 0.94, transformOrigin: "50% 48%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, tc + 0.2);
        etiqueta(".e2", "Cámara de descompresión", 170, 520, w("cámara"));
        sello(".s2", "Más de 2 días", 170, 1000, w("días"));
      }
      fin();
    })();
  </script>
</template>
