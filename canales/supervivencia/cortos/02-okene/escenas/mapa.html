<template>

  <script>
    (function () {
/*AYUDA*/
      const P = {{p:naufragio}};
      $$(".punto, .onda").forEach((c) => { c.setAttribute("cx", P[0]); c.setAttribute("cy", P[1]); });
      tl.fromTo($("svg.mapa"), { scale: 1.06, transformOrigin: "40% 46%" }, { scale: 1.0, duration: DUR, ease: "power2.out" }, 0);

      const partes = [["26 ", Math.max(0.02, w("Nigeria") + 0.1)], ["MAY ", w("mayo")], ["2013", w("mil")]];
      const todo = partes.map((p) => p[0]).join(""), cortes = []; let acc = 0;
      partes.forEach(([s, t0]) => { for (let i = 0; i < s.length; i++) cortes.push([acc + i + 1, t0 + i * 0.05]); acc += s.length; });

      const t = w("trece") - 0.05;

      tl.fromTo($(".onda"), { scale: 1, opacity: 0, transformOrigin: "50% 50%" }, { keyframes: [{ opacity: 0.9, duration: 0.05 }, { scale: 3.2, opacity: 0, duration: 0.8, ease: "power2.out" }] }, t + 0.1);

    })();
