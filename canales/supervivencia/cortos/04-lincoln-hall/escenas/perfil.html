<template>
  <!-- El Everest por la cara norte, dibujado. La altura va a escala desde 6.000 m (0,239 px por metro): la cima, a 8.849 m
       (y 420); el límite de la zona de la muerte, a 8.000 m (y 623); el collado norte, a unos 7.000 m (y 861). Modos:
       zona    él en la cima; el oxígeno de cada respiración (arriba, menos de un tercio que al nivel del mar); el límite
               de 8.000 m que se dibuja y la zona de la muerte
       noche   de noche y en penumbra; él, solo, a unos 8.600 m; «muerto»: HA MUERTO; las horas de la noche, de 0 a 12
       bajada  de día; doce puntos (los sherpas) suben desde el collado norte hasta él; en «último», bajan todos juntos -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} svg.perfil { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #{{ID}} .cielo { fill: url(#cielo-{{ID}}); }
    #{{ID}} .lejos { fill: #18212c; stroke: rgba(242, 237, 228, 0.12); stroke-width: 2; }
    #{{ID}} .monte { fill: url(#nieve-{{ID}}); stroke: rgba(242, 237, 228, 0.6); stroke-width: 3; }
    #{{ID}} .ruta { fill: none; stroke: rgba(242, 237, 228, 0.5); stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
    #{{ID}} .banda { fill: rgba(255, 94, 26, 0.17); opacity: 0; }
    #{{ID}} .limite { fill: none; stroke: #ff5e1a; stroke-width: 4; stroke-dasharray: 100 100; visibility: hidden; }
    #{{ID}} .guia { stroke: rgba(242, 237, 228, 0.75); stroke-width: 3; visibility: hidden; }
    #{{ID}} .persona { fill: #ff5e1a; }
    #{{ID}} .halo { fill: none; stroke: #ff5e1a; stroke-width: 4; }
    #{{ID}} .sherpa { fill: #f2ede4; visibility: hidden; }
    #{{ID}} .estrellas { opacity: 0; }
    #{{ID}} .estrellas circle { fill: #f2ede4; }
    #{{ID}} .noche { fill: #03050b; opacity: 0; }
    #{{ID}} .barra { fill: #f2ede4; opacity: 0.85; }
    #{{ID}} .barra.o { fill: #ff5e1a; opacity: 1; }
    #{{ID}} .t { position: absolute; visibility: hidden; white-space: nowrap; }
    #{{ID}} .t.nota { font: 400 34px/1.2 "Special Elite", monospace; color: #f2ede4; text-shadow: 0 3px 18px rgba(0, 0, 0, 0.95); }
    #{{ID}} .t.nota.o { color: #ff5e1a; }
    #{{ID}} .t.et { font: 800 56px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
    #{{ID}} .t.et span { display: inline-block; background: rgba(11, 10, 9, 0.88); padding: 0.1em 0.3em 0.04em; border-left: 6px solid #ff5e1a; }
    #{{ID}} .t.sello { font: 800 96px/0.98 "Barlow Condensed", sans-serif; text-transform: uppercase; }
    #{{ID}} .t.sello span { display: inline-block; background: #ff5e1a; color: #0b0a09; padding: 0.04em 0.14em 0; }
    #{{ID}} .t.cifra { font: 800 64px/1 "Barlow Condensed", sans-serif; color: #ff5e1a; text-shadow: 0 3px 18px rgba(0, 0, 0, 0.9); }
    #{{ID}} .t.horas { font: 400 170px/1 "Special Elite", monospace; color: #f2ede4; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9); }
    #{{ID}} .t.horas small { display: block; font-size: 0.2em; letter-spacing: 0.1em; color: #ff5e1a; margin-bottom: 12px; }
    #{{ID}} .t .m { font-style: normal; text-transform: none; }   /* la unidad, en minúscula y sin la caja del rótulo */
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc" data-modo="{{p:modo}}">
      <svg class="perfil" viewBox="0 0 1080 1920">
        <defs>
          <linearGradient id="cielo-{{ID}}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0c1726" /><stop offset="0.55" stop-color="#22324a" /><stop offset="1" stop-color="#3a4a5e" />
          </linearGradient>
          <linearGradient id="nieve-{{ID}}" gradientUnits="userSpaceOnUse" x1="0" y1="420" x2="0" y2="1500">
            <stop offset="0" stop-color="#e9edf2" /><stop offset="0.4" stop-color="#9aa4b0" /><stop offset="1" stop-color="#2a3038" />
          </linearGradient>
        </defs>
        <g class="mundo">
          <rect class="cielo" x="-100" y="-100" width="1280" height="2120" />
          <g class="estrellas"></g>
          <rect class="banda" x="-100" y="-100" width="1280" height="723" />
          <path class="lejos" d="M-60,1380 L120,1180 L230,1240 L360,1090 L470,1180 L560,1120 L660,1260 L800,1060 L900,1130 L1000,1020 L1140,1110 L1140,1920 L-60,1920 Z" />
          <path class="monte" d="M-60,1920 L-60,1500 L150,1320 L300,1150 L420,1000 L520,861 L590,760 L660,623 L715,500 L760,420 L810,470 L870,560 L930,680 L1000,800 L1140,960 L1140,1920 Z" />
          <rect class="noche" x="-100" y="-100" width="1280" height="2120" />
          <path class="ruta" d="M520,861 L590,760 L660,623 L715,500 L760,420" />
          <path class="limite" pathLength="100" d="M0,623 L1080,623" />
          <line class="guia" x1="690" y1="372" x2="750" y2="413" />
          <g class="sherpas"></g>
          <g class="el"><circle class="halo" r="22" /><circle class="persona" r="12" /></g>
        </g>
        <g class="o2" style="visibility: hidden">
          <rect class="barra b1" x="110" y="795" width="330" height="30" />
          <rect class="barra o b2" x="110" y="885" width="110" height="30" />
        </g>
      </svg>
      <div class="t et cima"><span>Cima · 8.849 <i class="m">m</i></span></div>
      <div class="t nota o2t">Oxígeno por respiración</div>
      <div class="t nota l1">Al nivel del mar</div>
      <div class="t nota l2">En la cima</div>
      <div class="t cifra tercio">&lt; 1/3</div>
      <div class="t nota ocho">8.000 m</div>
      <div class="t sello zona"><span>Zona de</span><br /><span>la muerte</span></div>
      <div class="t sello muerto"><span>Ha muerto</span></div>
      <div class="t horas"><small>HORAS, SOLO</small><span class="n">0</span></div>
      <div class="t et solo"><span>+8.500 <i class="m">m</i> · solo</span></div>
      <div class="t sello doce"><span>12 sherpas</span></div>
      <div class="t et collado"><span>Collado norte</span></div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const modo = RAIZ.dataset.modo;
      const NS = "http://www.w3.org/2000/svg";
      // La ruta de la arista norte, del collado (7.000 m) a la cima (8.849 m); él pasa la noche a unos 8.600 m (y 479).
      const RUTA = [[520, 861], [590, 760], [660, 623], [715, 500], [760, 420]];
      const tramos = RUTA.slice(1).map((p, i) => Math.hypot(p[0] - RUTA[i][0], p[1] - RUTA[i][1]));
      const largo = tramos.reduce((a, b) => a + b, 0);
      // Un punto de la ruta: u de 0 (collado) a 1 (cima).
      const enRuta = (u) => {
        let d = Math.max(0, Math.min(1, u)) * largo;
        for (let i = 0; i < tramos.length; i++) {
          if (d <= tramos[i] || i === tramos.length - 1) {
            const k = Math.min(1, d / tramos[i]), a = RUTA[i], b = RUTA[i + 1];
            return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
          }
          d -= tramos[i];
        }
      };
      // u del punto de la noche (y 479, sobre el último tramo).
      const U_NOCHE = (largo - tramos[3] * (479 - 420) / 80) / largo;
      const el = $(".el");
      const pon = (g, p) => g.setAttribute("transform", `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
      const halo = (t, fuerza) => {
        const k = (Math.max(0, t) * 0.9) % 1;          // antes de la escena (t < 0) el resto saldría negativo
        gsap.set($(".halo"), { attr: { r: 14 + 26 * k }, opacity: fuerza * (1 - k) });
      };
      const texto = (sel, x, y) => gsap.set($(sel), { left: x, top: y });
      const entraT = (sel, t) => tl.fromTo($(sel), { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, t - 0.08);
      const sella = (sel, t) => tl.fromTo($(sel), { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" },
        { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power4.in" }, t - 0.1);
      // Estrellas fijas (semilla propia: el mismo cielo en cada render).
      let s = 7;
      const azar = () => ((s = (s * 16807) % 2147483647) / 2147483647);
      for (let i = 0; i < 90; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", (azar() * 1080).toFixed(0)); c.setAttribute("cy", (azar() * 900).toFixed(0));
        c.setAttribute("r", (0.8 + azar() * 1.8).toFixed(1)); c.setAttribute("opacity", (0.35 + azar() * 0.6).toFixed(2));
        $(".estrellas").appendChild(c);
      }
      if (modo === "zona") {
        pon(el, RUTA[4]);
        alBuscar((t) => halo(t, 1));
        tl.fromTo($(".mundo"), { scale: 1.0, transformOrigin: "60% 40%" }, { scale: 1.04, duration: DUR, ease: "none" }, 0);
        texto(".cima", 330, 330); entraT(".cima", 0.15);
        tl.fromTo($(".guia"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, 0.2);
        // El oxígeno: la barra del nivel del mar, entera; la de la cima, menos de un tercio.
        texto(".o2t", 110, 700); texto(".l1", 110, 752); texto(".l2", 110, 842); texto(".tercio", 240, 868);
        const t0 = w("bocanada") - 0.1;
        entraT(".o2t", t0);
        tl.set($(".o2"), { visibility: "visible" }, t0);
        entraT(".l1", w("aire") - 0.05);
        tl.fromTo($(".b1"), { attr: { width: 0 } }, { attr: { width: 330 }, duration: 0.5, ease: "expo.out" }, w("aire"));
        entraT(".l2", w("tercio") - 0.25);
        tl.fromTo($(".b2"), { attr: { width: 0 } }, { attr: { width: 106 }, duration: 0.5, ease: "expo.out" }, w("tercio") - 0.1);
        entraT(".tercio", w("tercio") + 0.15);
        // El límite de 8.000 m se dibuja; la zona de la muerte se tiñe.
        traza($(".limite"), w("ocho") - 0.1, 0.8, "power2.inOut");
        texto(".ocho", 110, 640); entraT(".ocho", w("mil", 2) + 0.1);           // «ocho mil» (la 1.ª, «dos mil seis»)
        tl.to($(".banda"), { opacity: 1, duration: 0.5, ease: "power2.out" }, w("muerte") - 0.2);
        texto(".zona", 110, 430); sella(".zona", w("muerte") - 0.05);
        tl.to([$(".o2"), $(".o2t"), $(".l1"), $(".l2"), $(".tercio")], { autoAlpha: 0.35, duration: 0.3 }, w("muerte") - 0.2);
      } else if (modo === "noche") {
        pon(el, enRuta(U_NOCHE));
        alBuscar((t) => halo(t, 0.55));
        gsap.set($(".noche"), { opacity: 0.62 }); gsap.set($(".estrellas"), { opacity: 1 }); gsap.set($(".banda"), { opacity: 0.5 });
        gsap.set($(".limite"), { visibility: "visible", strokeDashoffset: 0, opacity: 0.5 });
        gsap.set($(".persona"), { opacity: 0.8 });
        tl.fromTo($(".mundo"), { scale: 1.0, x: 0, y: 0, transformOrigin: "67% 25%" }, { scale: 1.1, duration: DUR, ease: "none" }, 0);
        texto(".muerto", 110, 960); sella(".muerto", w("muerto", 2) - 0.05);
        texto(".horas", 110, 230);
        const th = w("Pasa") - 0.1;
        aparece($(".horas"), th, 0.3);
        cuenta($(".horas .n"), 0, 12, th + 0.1, f("metros", 2) - th - 0.1, { ease: "none", crudo: true });
        texto(".solo", 300, 560); entraT(".solo", w("quinientos") - 0.1);
      } else {
        // bajada: él a unos 8.600 m; los doce suben desde el collado y bajan todos.
        const U0 = U_NOCHE, tu = w("suben", 2) - 0.1, tb = w("último") - 0.1, TB = 2.2;
        const sh = [];
        for (let i = 0; i < 12; i++) {
          const c = document.createElementNS(NS, "circle"); c.setAttribute("r", "9"); c.setAttribute("class", "sherpa");
          $(".sherpas").appendChild(c); sh.push(c);
        }
        alBuscar((t) => {
          // Al bajar, el grupo va del punto de la noche al collado.
          const kb = paso(t, tb, TB, "power2.inOut"), ub = U0 * (1 - kb);
          pon(el, enRuta(ub));
          halo(t, 1 - kb);
          sh.forEach((c, i) => {
            const ku = paso(t, tu + i * 0.09, 1.6, "power2.out");
            const u = t < tb ? ku * (U0 - 0.012 * (i + 1)) : Math.max(0, ub - 0.012 * (i + 1));
            const p = enRuta(u);
            c.setAttribute("cx", (p[0] - 10 + (i % 2) * 20).toFixed(1)); c.setAttribute("cy", p[1].toFixed(1));
            c.style.visibility = t >= tu + i * 0.09 ? "visible" : "hidden";
          });
        });
        tl.fromTo($(".mundo"), { scale: 1.0, transformOrigin: "55% 45%" }, { scale: 1.03, duration: DUR, ease: "none" }, 0);
        texto(".doce", 110, 300); sella(".doce", w("Doce", 2) - 0.05);
        texto(".collado", 140, 900); entraT(".collado", w("tramo") - 0.1);
      }
      fin();
    })();
  </script>
</template>
