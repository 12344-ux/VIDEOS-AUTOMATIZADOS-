<template>
  <!-- La costa del Pacífico de Sudamérica (Natural Earth; los datos, de mapa.py) en una sola proyección; la cámara (el grupo
       .mundo) acerca cada sitio. Los rótulos del mapa van dentro del dibujo (escalan con él); las fechas y etiquetas, fijas.
       Modos:
         isla       «septiembre»: la fecha, a máquina; el Pacífico; «Chile»: se enciende Chile y la cámara baja a la isla
         distancia  la isla y Valparaíso; «seiscientos»: la regla de 670 km
         hundido    de la isla al norte, mar adentro, hasta Malpelo (el rumbo, en esquema); «Colombia»: se enciende, el
                    barco se hunde (cruz y ondas); «razón»: TENÍA RAZÓN
         hoy        la isla: «Más a Tierra» se tacha y aparece «Isla Robinson Crusoe» («Robinson», la 3.ª vez) -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} svg.mapa { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #{{ID}} .mar { fill: url(#mar-{{ID}}); }
    #{{ID}} .resto { fill: #26241f; stroke: #5d584b; stroke-width: 1.4; }
    #{{ID}} .chile, #{{ID}} .colombia { fill: #26241f; stroke: #5d584b; stroke-width: 1.4; }
    #{{ID}} .rumbo { fill: none; stroke: rgba(242, 237, 228, 0.35); stroke-width: 2.2; stroke-dasharray: 6 6; visibility: hidden; }
    #{{ID}} .hecho { fill: none; stroke: #ff5e1a; stroke-width: 3; stroke-linecap: round; visibility: hidden; }
    #{{ID}} .punto { fill: #f2ede4; }
    #{{ID}} .isla { fill: #ff5e1a; }
    #{{ID}} .halo { fill: none; stroke: #ff5e1a; stroke-width: 2; opacity: 0; }
    #{{ID}} .barco { fill: #f2ede4; stroke: #0b0a09; stroke-width: 1; }
    #{{ID}} .cruz { stroke: #ff5e1a; stroke-width: 4; stroke-linecap: round; }
    #{{ID}} .regla line { stroke: #f2ede4; stroke-width: 2; }
    #{{ID}} .nom { font-family: "Special Elite", monospace; fill: rgba(242, 237, 228, 0.88); }
    #{{ID}} .nom.grande { font-family: "Barlow Condensed", sans-serif; font-weight: 800; letter-spacing: 0.14em; fill: rgba(242, 237, 228, 0.3); }
    #{{ID}} .nom.naranja { fill: #ff5e1a; }
    #{{ID}} .tachon { stroke: #ff5e1a; stroke-width: 1.6; }
    #{{ID}} .t { position: absolute; visibility: hidden; white-space: nowrap; }
    #{{ID}} .t.et { font: 800 56px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
    #{{ID}} .t.et span { display: inline-block; background: rgba(11, 10, 9, 0.88); padding: 0.1em 0.3em 0.04em; border-left: 6px solid #ff5e1a; }
    #{{ID}} .t.et .m { font-style: normal; text-transform: none; }
    #{{ID}} .t.sello { font: 800 110px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; }
    #{{ID}} .t.sello span { display: inline-block; background: #ff5e1a; color: #0b0a09; padding: 0.04em 0.14em 0; }
    #{{ID}} .t.fecha { font: 400 76px/1 "Special Elite", monospace; letter-spacing: 0.04em; text-shadow: 0 3px 20px rgba(0, 0, 0, 0.95); }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc" data-modo="{{p:modo}}">
      <svg class="mapa" viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="mar-{{ID}}" cx="0.35" cy="0.5" r="0.9">
            <stop offset="0" stop-color="#11222a" /><stop offset="1" stop-color="#070b0d" />
          </radialGradient>
        </defs>
        <rect class="mar" x="-200" y="-200" width="1480" height="2320" />
        <g class="mundo">
          <path class="resto" d="{{p:resto}}" />
          <path class="chile" d="{{p:chile}}" />
          <path class="colombia" d="{{p:colombia}}" />
          <path class="rumbo" d="{{p:rumbo}}" />
          <path class="hecho" d="{{p:rumbo}}" />
          <g class="regla" style="visibility: hidden"><line class="r0" /><line class="r1" /><line class="r2" /></g>
          <circle class="punto valpo" r="3.2" />
          <circle class="halo h-isla" r="4" />
          <circle class="isla p-isla" r="4" />
          <circle class="punto p-malpelo" r="3.2" style="visibility: hidden" />
          <circle class="halo h-malpelo" r="4" />
          <g class="cruz-g" style="visibility: hidden"><line class="cruz" x1="-7" y1="-7" x2="7" y2="7" /><line class="cruz" x1="7" y1="-7" x2="-7" y2="7" /></g>
          <path class="barco" d="M0,-7 L5,6 L-5,6 Z" style="visibility: hidden" />
          <text class="nom n-valpo" font-size="12">Valparaíso</text>
          <text class="nom n-chile grande" font-size="22">CHILE</text>
          <text class="nom n-isla" font-size="12">Más a Tierra</text>
          <line class="tachon" style="visibility: hidden" />
          <text class="nom naranja n-isla2" font-size="13" style="visibility: hidden">Isla Robinson Crusoe</text>
          <text class="nom n-malpelo" font-size="14" style="visibility: hidden">Isla de Malpelo</text>
          <text class="nom n-colombia grande" font-size="20" style="visibility: hidden">COLOMBIA</text>
        </g>
      </svg>
      <div class="t fecha"></div>
      <div class="t et e1"><span></span></div><div class="t et e2"><span></span></div>
      <div class="t sello s1t"><span></span></div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const modo = RAIZ.dataset.modo;
      const ISLA = {{p:isla}}, VALPO = {{p:valparaiso}}, MALPELO = {{p:malpelo}};
      const at = (sel, o) => Object.entries(o).forEach(([k, v]) => $(sel).setAttribute(k, v));
      at(".valpo", { cx: VALPO[0], cy: VALPO[1] }); at(".p-isla", { cx: ISLA[0], cy: ISLA[1] }); at(".h-isla", { cx: ISLA[0], cy: ISLA[1] });
      at(".p-malpelo", { cx: MALPELO[0], cy: MALPELO[1] }); at(".h-malpelo", { cx: MALPELO[0], cy: MALPELO[1] });
      at(".n-valpo", { x: VALPO[0] + 7, y: VALPO[1] + 4 }); at(".n-isla", { x: ISLA[0] - 74, y: ISLA[1] + 20 });
      at(".n-isla2", { x: ISLA[0] - 64, y: ISLA[1] + 38 }); at(".tachon", { x1: ISLA[0] - 76, y1: ISLA[1] + 16, x2: ISLA[0] + 6, y2: ISLA[1] + 16 });
      at(".n-chile", { x: VALPO[0] + 18, y: VALPO[1] - 70 }); at(".n-malpelo", { x: MALPELO[0] + 10, y: MALPELO[1] + 5 });
      at(".n-colombia", { x: MALPELO[0] + 100, y: MALPELO[1] + 60 });
      // La cámara: el punto (px, py) del mapa en (sx, sy) de la pantalla, con escala k.
      const cam = (px, py, k, sx = 540, sy = 860) => ({ x: sx - k * px, y: sy - k * py, scale: k });
      const mundo = $(".mundo"); gsap.set(mundo, { transformOrigin: "0px 0px" });
      const centro = [(ISLA[0] + VALPO[0]) / 2, (ISLA[1] + VALPO[1]) / 2];
      const et = (sel, html, x, y, t) => { const e = $(sel); e.querySelector("span").innerHTML = html; gsap.set(e, { left: x, top: y }); tl.fromTo(e, { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, t - 0.08); };
      const sello = (sel, txt, x, y, t) => { const e = $(sel); e.querySelector("span").textContent = txt; gsap.set(e, { left: x, top: y }); tl.fromTo(e, { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power4.in" }, t - 0.1); tl.fromTo(RAIZ, { x: 0 }, { keyframes: [{ x: -7, duration: 0.05 }, { x: 5, duration: 0.05 }, { x: 0, duration: 0.06 }] }, t + 0.12); };
      const late = (sel, t) => tl.fromTo($(sel), { attr: { r: 4 }, opacity: 0.9 }, { attr: { r: 26 }, opacity: 0, duration: 0.9, ease: "power2.out", repeat: 2, immediateRender: false }, t);
      const enciende = (sel, t) => tl.to($(sel), { fill: "#4a3f2c", stroke: "#e0b77a", strokeWidth: 2, duration: 0.35 }, t);
      if (modo === "isla") {
        // Del Pacífico entero a la isla, frente a Chile.
        const f = $(".fecha"); gsap.set(f, { left: 80, top: 190 });
        const txt = "SEP 1704"; f.style.visibility = "visible";
        const t0 = w("Septiembre") - 0.05;
        alBuscar((x) => { f.textContent = txt.slice(0, Math.round(txt.length * Math.min(1, Math.max(0, (x - t0) / 1.0)))); });
        const tc = w("Chile") - 0.1;
        tl.fromTo(mundo, cam(560, 1250, 1.0, 540, 980), Object.assign(cam(centro[0], centro[1], 2.4), { duration: Math.max(0.6, DUR - tc), ease: "power2.inOut" }), Math.min(tc, DUR - 0.6));
        enciende(".chile", tc);
        late(".h-isla", tc + 0.3);
        et(".e1", "Océano Pacífico", 80, 290, w("Océano") - 0.05);
      } else if (modo === "distancia") {
        // La isla y Valparaíso; la regla de 670 km.
        gsap.set(mundo, cam(centro[0], centro[1], 2.4));
        tl.fromTo(mundo, cam(centro[0], centro[1], 2.4), Object.assign(cam(centro[0], centro[1], 2.55), { duration: DUR, ease: "none" }), 0);
        gsap.set($(".chile"), { fill: "#4a3f2c", stroke: "#e0b77a", strokeWidth: 2 });
        const y = Math.max(ISLA[1], VALPO[1]) + 22;
        at(".r0", { x1: ISLA[0], y1: y, x2: ISLA[0], y2: y }); at(".r1", { x1: ISLA[0], y1: y - 6, x2: ISLA[0], y2: y + 6 }); at(".r2", { x1: VALPO[0], y1: y - 6, x2: VALPO[0], y2: y + 6 });
        const tr = w("seiscientos") - 0.1;
        tl.set($(".regla"), { visibility: "visible" }, tr);
        tl.fromTo($(".r0"), { attr: { x2: ISLA[0] } }, { attr: { x2: VALPO[0] }, duration: 0.6, ease: "power2.inOut" }, tr);
        late(".h-isla", 0.2);
        et(".e1", '670 <i class="m">km</i> de la costa', 80, 290, tr + 0.2);
      } else if (modo === "hundido") {
        // De la isla al norte por el rumbo (esquema) hasta Malpelo; Colombia; el barco se hunde.
        const hecho = $(".hecho"), L0 = hecho.getTotalLength(), barco = $(".barco");
        hecho.setAttribute("stroke-dasharray", `${L0} ${L0}`);
        gsap.set([hecho, $(".rumbo")], { visibility: "visible" });
        const t1 = Math.max(0.6, w("Colombia") - 0.3);
        alBuscar((x) => {
          const u = paso(x, 0.05, t1 - 0.05, "sine.inOut"), pt = hecho.getPointAtLength(L0 * u);
          hecho.setAttribute("stroke-dashoffset", (L0 * (1 - u)).toFixed(1));
          barco.setAttribute("transform", `translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)}) scale(1.4)`);
          barco.style.visibility = x >= t1 + 0.35 ? "hidden" : "visible";
        });
        const medio = [(ISLA[0] + MALPELO[0]) / 2, (ISLA[1] + MALPELO[1]) / 2];
        tl.fromTo(mundo, cam(ISLA[0], ISLA[1], 2.4, 540, 900), Object.assign(cam(medio[0], medio[1], 0.85, 540, 820), { duration: (t1 - 0.05) * 0.5, ease: "power2.inOut" }), 0.05);
        tl.to(mundo, Object.assign(cam(MALPELO[0], MALPELO[1], 2.2, 500, 760), { duration: (t1 - 0.05) * 0.5 + 0.3, ease: "power2.inOut" }), 0.05 + (t1 - 0.05) * 0.5);
        tl.set([$(".p-malpelo"), $(".n-malpelo"), $(".n-colombia")], { visibility: "visible" }, t1 - 0.3);
        enciende(".colombia", t1);
        gsap.set($(".cruz-g"), { x: MALPELO[0] - 8, y: MALPELO[1] - 10 });
        tl.set($(".cruz-g"), { visibility: "visible" }, t1 + 0.35);
        tl.fromTo($(".cruz-g"), { scale: 2, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.in" }, t1 + 0.35);
        late(".h-malpelo", t1 + 0.4);
        et(".e1", "Se hundió aquí", 80, 290, t1 + 0.35);
        sello(".s1t", "Tenía razón", 80, 960, w("razón") - 0.05);
      } else {
        // hoy: la isla cambia de nombre.
        gsap.set($(".chile"), { fill: "#4a3f2c", stroke: "#e0b77a", strokeWidth: 2 });
        tl.fromTo(mundo, cam(ISLA[0], ISLA[1], 2.6, 560, 860), Object.assign(cam(ISLA[0], ISLA[1], 3.0, 560, 860), { duration: DUR, ease: "none" }), 0);
        const tn = w("Robinson", 3) - 0.05;
        tl.set($(".tachon"), { visibility: "visible" }, tn - 0.3);
        tl.fromTo($(".tachon"), { attr: { x2: ISLA[0] - 76 } }, { attr: { x2: ISLA[0] + 6 }, duration: 0.25, ease: "power2.out" }, tn - 0.3);
        tl.set($(".n-isla2"), { visibility: "visible" }, tn);
        tl.fromTo($(".n-isla2"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, tn);
        late(".h-isla", tn);
        et(".e1", "Chile · desde 1966", 80, 290, tn + 0.1);
      }
      fin();
    })();
  </script>
</template>
