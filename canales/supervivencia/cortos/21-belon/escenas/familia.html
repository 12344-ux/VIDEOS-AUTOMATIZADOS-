<template>
  <!-- La familia como cinco figuras dibujadas (sin cara): María, Quique y sus tres hijos, Lucas (10), Tomás (8) y Simón (5).
       Modos: juntos (aparecen con sus nombres), separados (la ola los partió: María y Lucas en un hospital; Quique encuentra
       a Tomás y a Simón) y cinco (Simón llega al hospital de su madre, después el padre y Tomás; los cinco, vivos, en naranja). -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} svg.dib { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #{{ID}} .fondo-d { fill: url(#f-{{ID}}); }
    #{{ID}} .ola { fill: none; stroke: rgba(242, 237, 228, 0.08); stroke-width: 3; stroke-linecap: round; }
    #{{ID}} .cuerpo { fill: #f2ede4; }
    #{{ID}} .viva .cuerpo { fill: #ff5e1a; }
    #{{ID}} .nom { font: 800 40px "Barlow Condensed", sans-serif; letter-spacing: 0.04em; fill: #f2ede4; text-transform: uppercase; }
    #{{ID}} .edad { font: 400 32px "Special Elite", monospace; fill: rgba(242, 237, 228, 0.75); }
    #{{ID}} .hosp rect { fill: rgba(242, 237, 228, 0.06); stroke: rgba(242, 237, 228, 0.55); stroke-width: 3; }
    #{{ID}} .hosp .cruz { fill: #ff5e1a; }
    #{{ID}} .hosp text { font: 800 34px "Barlow Condensed", sans-serif; letter-spacing: 0.08em; fill: rgba(242, 237, 228, 0.8); }
    #{{ID}} .pisc { fill: rgba(70, 175, 195, 0.55); stroke: rgba(150, 225, 235, 0.7); stroke-width: 3; }
    #{{ID}} .pisc-o { fill: none; stroke: rgba(225, 248, 250, 0.75); stroke-width: 3; stroke-linecap: round; }
    #{{ID}} .grieta { fill: none; stroke: rgba(120, 170, 200, 0.55); stroke-width: 5; stroke-dasharray: 14 12; stroke-linecap: round; }
    #{{ID}} .t { position: absolute; visibility: hidden; white-space: nowrap; }
    #{{ID}} .t.grande { left: 80px; top: 230px; font: 800 150px/0.9 "Barlow Condensed", sans-serif; text-transform: uppercase; }
    #{{ID}} .t.grande .u { font-size: 0.46em; margin-left: 0.12em; }
    #{{ID}} .t.sello { left: 500px; top: 252px; font: 800 120px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; }
    #{{ID}} .t.sello span { display: inline-block; background: #ff5e1a; color: #0b0a09; padding: 0.04em 0.16em 0; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc" data-modo="{{p:modo}}">
      <svg class="dib" viewBox="0 0 1080 1920">
        <defs><linearGradient id="f-{{ID}}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3038" /><stop offset="0.6" stop-color="#14222a" /><stop offset="1" stop-color="#0b1216" /></linearGradient></defs>
        <rect class="fondo-d" x="0" y="0" width="1080" height="1920" />
        <g class="olas"></g>
        <g class="hosp" style="visibility: hidden"><rect x="60" y="420" width="500" height="700" rx="18" /><path class="cruz" d="M292,460 h36 v32 h32 v36 h-32 v32 h-36 v-32 h-32 v-36 h32 Z" /><text x="310" y="600" text-anchor="middle">HOSPITAL</text></g>
        <path class="grieta" d="M605,330 C565,500 655,640 595,800 C545,940 645,1040 605,1130" style="visibility: hidden" />
        <g class="figs"></g>
        <g class="pisc-g" style="visibility: hidden"><rect class="pisc" x="270" y="930" width="790" height="70" rx="14" /><path class="pisc-o" d="M290,950 q20,-8 40,0 q20,8 40,0 q20,-8 40,0 q20,8 40,0 q20,-8 40,0 q20,8 40,0 q20,-8 40,0 q20,8 40,0 q20,-8 40,0 q20,8 40,0 q20,-8 40,0 q20,8 40,0 q20,-8 40,0 q20,8 40,0 q20,-8 40,0 q20,8 40,0 q20,-8 40,0 q20,8 40,0 q20,-8 40,0" /></g>
      </svg>
      <div class="t grande num"><span class="g">5</span><span class="u">de 5</span></div>
      <div class="t sello"><span>Vivos</span></div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const modo = RAIZ.dataset.modo, NS = "http://www.w3.org/2000/svg";
      // Olas tenues abajo, a la deriva.
      let ol = ""; for (let i = 0; i < 7; i++) { const y = 1360 + i * 82, x0 = -200 + (i % 2) * 90; let d = `M${x0},${y}`;
        for (let x = x0; x < 1300; x += 180) d += " q45,-14 90,0 q45,14 90,0"; ol += `<path class="ola" d="${d}" opacity="${(1 - i * 0.09).toFixed(2)}"/>`; }
      $(".olas").innerHTML = ol; tl.fromTo($(".olas"), { x: 0 }, { x: -60, duration: DUR, ease: "none" }, 0);
      // Una figura: cabeza y cuerpo, con su nombre (y su edad, los niños) debajo; los pies en y = 0.
      const F = { m: ["María", "", 1], q: ["Quique", "", 1.08], l: ["Lucas", "10", 0.78], t: ["Tomás", "8", 0.7], s: ["Simón", "5", 0.6] };
      const figs = {};
      Object.entries(F).forEach(([k, [nom, edad, e]]) => {
        const g = document.createElementNS(NS, "g"); g.setAttribute("class", "fig f-" + k);
        const h = 250 * e, r = 39 * e;
        g.innerHTML = `<g class="cuerpo-g"><circle class="cuerpo" cx="0" cy="${-h + r}" r="${r}"/>` +
          `<path class="cuerpo" d="M${-r * 1.25},0 L${-r * 1.25},${-h * 0.62 + r * 0.6} Q${-r * 1.25},${-h + r * 2.6} 0,${-h + r * 2.6} Q${r * 1.25},${-h + r * 2.6} ${r * 1.25},${-h * 0.62 + r * 0.6} L${r * 1.25},0 Z"/></g>` +
          `<text class="nom" x="0" y="56" text-anchor="middle">${nom}</text>` + (edad ? `<text class="edad" x="0" y="96" text-anchor="middle">${edad} años</text>` : "");
        $(".figs").appendChild(g); figs[k] = g;
      });
      const pon = (k, x, y) => gsap.set(figs[k], { x, y });
      const mueve = (k, x, y, t, d = 0.7) => tl.to(figs[k], { x, y, duration: d, ease: "power2.inOut" }, t);
      const asoma = (k, t) => tl.fromTo(figs[k], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, t);
      const Y = 1000, H = 1050;
      if (modo === "juntos") {
        // María ya está (la voz acaba de nombrarla); los demás, cuando la voz los dice.
        // María, junto a la piscina; Quique y los niños, en el agua.
        [["m", 150], ["q", 380], ["l", 580], ["t", 760], ["s", 920]].forEach(([k, x]) => pon(k, x, Y));
        gsap.set($(".pisc-g"), { visibility: "visible" }); tl.fromTo($(".pisc-g"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, w("agua") - 0.2);
        asoma("m", 0.05); asoma("q", w("Quique") - 0.1); asoma("l", w("Lucas") - 0.1); asoma("t", w("Tomás") - 0.1); asoma("s", w("Simón") - 0.1);
      } else if (modo === "separados") {
        // La ola los partió: María y Lucas en el hospital (a la izquierda); Quique al otro lado, y Tomás y Simón más lejos.
        gsap.set([$(".hosp"), $(".grieta")], { visibility: "visible" });
        pon("m", 190, H); pon("l", 410, H); pon("q", 740, Y); pon("t", 1180, Y); pon("s", 1300, Y);
        const te = w("encuentra", 2) - 0.1;
        mueve("t", 885, Y, te); mueve("s", 1000, Y, te + 0.1);
      } else {
        // cinco: Simón baja en el hospital de su madre; después llegan el padre y Tomás; los cinco, vivos.
        gsap.set($(".hosp"), { visibility: "visible" });
        pon("m", 150, H); pon("l", 310, H); pon("s", 1180, H); pon("q", 1280, Y); pon("t", 1380, Y);
        mueve("s", 455, H, w("baja") - 0.2, 0.8);
        tl.to($(".hosp rect"), { attr: { width: 960 }, duration: 0.6, ease: "power2.inOut" }, w("llega") - 0.35);
        mueve("q", 640, H, w("llega") - 0.25, 0.8); mueve("t", 840, H, w("llega") - 0.15, 0.8);
        const tc = w("cinco", 4) - 0.1, g = $(".grande");
        tl.fromTo(g, { autoAlpha: 0, scale: 1.15, transformOrigin: "0% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "expo.out" }, tc);
        Object.values(figs).forEach((f, i) => tl.to(f.querySelectorAll(".cuerpo"), { fill: "#ff5e1a", duration: 0.3 }, w("Vivos") - 0.1 + 0.06 * i));
        tl.fromTo($(".sello"), { autoAlpha: 0, scale: 1.3, transformOrigin: "left center" }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power4.in" }, w("Vivos") - 0.12);
        tl.fromTo(RAIZ, { x: 0 }, { keyframes: [{ x: -7, duration: 0.05 }, { x: 5, duration: 0.05 }, { x: 0, duration: 0.06 }] }, w("Vivos") + 0.1);
      }
      fin();
    })();
  </script>
</template>
