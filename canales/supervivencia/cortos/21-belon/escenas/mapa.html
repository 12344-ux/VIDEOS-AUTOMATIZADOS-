<template>
  <!-- El mapa del corto (mapa.py, Natural Earth): el norte de Sumatra, el mar de Andamán y Tailandia, con la cámara en escala
       logarítmica y svgOrigin; los nombres y los puntos guardan su tamaño en pantalla. Modos: lugar (Tailandia se enciende,
       la fecha a máquina y la cámara baja a Khao Lak) y ola (el terremoto frente a Sumatra y las ondas, en esquema, que
       llegan a Khao Lak; casi 4.000 muertos). -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} .mar { fill: url(#mar-{{ID}}); }
    #{{ID}} .pais { fill: #26241f; stroke: #5d584b; stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
    #{{ID}} .resto { fill: #201e1a; stroke: #4a463d; stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
    #{{ID}} .tai.luz { fill: #3a352c; stroke: #ff5e1a; }
    #{{ID}} .punto { fill: #f2ede4; }
    #{{ID}} .meta { fill: #ff5e1a; }
    #{{ID}} .onda { fill: none; stroke: #ff5e1a; stroke-width: 3px; vector-effect: non-scaling-stroke; }
    #{{ID}} .anillo { fill: none; stroke: rgba(160, 205, 235, 0.85); stroke-width: 4px; vector-effect: non-scaling-stroke; visibility: hidden; }
    #{{ID}} .cruz { stroke: #f2ede4; stroke-width: 5px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    #{{ID}} .nom { font-family: "Special Elite", monospace; fill: #e3ded5; paint-order: stroke; stroke: rgba(11, 10, 9, 0.85);
      stroke-width: 3px; stroke-linejoin: round; }
    #{{ID}} .nom.naranja { fill: #ff5e1a; }
    #{{ID}} .grande { font-family: "Barlow Condensed", sans-serif; font-weight: 800; letter-spacing: 0.14em; fill: #8f8a80; paint-order: stroke;
      stroke: rgba(11, 10, 9, 0.6); stroke-width: 2px; }
    #{{ID}} .t { position: absolute; visibility: hidden; white-space: nowrap; }
    #{{ID}} .t.et { font: 800 56px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
    #{{ID}} .t.et span { display: inline-block; background: rgba(11, 10, 9, 0.88); padding: 0.1em 0.3em 0.04em; border-left: 6px solid #ff5e1a; }
    #{{ID}} .t.fecha { font: 400 76px/1 "Special Elite", monospace; letter-spacing: 0.04em; text-shadow: 0 3px 20px rgba(0, 0, 0, 0.95); }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc" data-modo="{{p:modo}}">
      <svg class="mapa" viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="mar-{{ID}}" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#15222b" /><stop offset="1" stop-color="#0b0a09" /></radialGradient>
        </defs>
        <rect class="mar" x="0" y="0" width="1080" height="1920" />
        <g class="mundo">
          <path class="resto" d="{{p:resto}}" />
          <path class="pais tai" d="{{p:tailandia}}" />
          <text class="grande g-tai" text-anchor="middle" font-size="54">TAILANDIA</text>
          <text class="grande g-sum" text-anchor="middle" font-size="40">SUMATRA</text>
          <text class="grande g-mar" text-anchor="middle" font-size="26">MAR DE ANDAMÁN</text>
          <circle class="anillo a0" r="0" /><circle class="anillo a1" r="0" /><circle class="anillo a2" r="0" />
          <g class="cruz-e" style="visibility: hidden"><line class="cruz" x1="-11" y1="-11" x2="11" y2="11" /><line class="cruz" x1="11" y1="-11" x2="-11" y2="11" /></g>
          <circle class="punto fijo p-phu" data-r="6" />
          <circle class="onda" r="0" style="visibility: hidden" />
          <circle class="punto fijo p-kl" data-r="9" />
          <text class="nom fijo n-phu" data-px="28">Phuket</text>
          <text class="nom fijo n-kl" data-px="36">Khao Lak</text>
          <text class="nom fijo n-epi" data-px="30" style="visibility: hidden">Terremoto</text>
        </g>
      </svg>
      <div class="t fecha"></div>
      <div class="t et e1"><span></span></div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const modo = RAIZ.dataset.modo;
      const EPI = {{p:epicentro}}, KL = {{p:khao_lak}}, PHU = {{p:phuket}}, KM = {{p:km}}, PXKM = {{p:px_km}};
      const ET = {{p:et_tailandia}}, ES = {{p:et_sumatra}}, EM = {{p:et_mar}};
      const at = (sel, o) => Object.entries(o).forEach(([k, v]) => $(sel).setAttribute(k, v));
      [[".p-kl", KL], [".p-phu", PHU], [".onda", KL]].forEach(([s, p]) => at(s, { cx: p[0], cy: p[1] }));
      $$(".anillo").forEach((e) => at("." + e.classList[1], { cx: EPI[0], cy: EPI[1] }));
      at(".g-tai", { x: ET[0], y: ET[1] }); at(".g-sum", { x: ES[0], y: ES[1] }); at(".g-mar", { x: EM[0], y: EM[1] });
      const mundo = $(".mundo"); gsap.set(mundo, { svgOrigin: "0 0" });
      // Nombres y puntos con su tamaño en pantalla, sea cual sea el acercamiento (k).
      const nombres = [], fijos = $$(".fijo");
      const nombre = (sel, p, dx, dy) => nombres.push([$(sel), p, dx, dy]);
      const fija = (k) => {
        fijos.forEach((e) => { if (e.dataset.px) e.setAttribute("font-size", (e.dataset.px / k).toFixed(3)); else e.setAttribute("r", (e.dataset.r / k).toFixed(3)); });
        nombres.forEach(([e, p, dx, dy]) => { e.setAttribute("x", (p[0] + dx / k).toFixed(2)); e.setAttribute("y", (p[1] + dy / k).toFixed(2)); });
        $(".cruz-e").setAttribute("transform", `translate(${EPI[0]},${EPI[1]}) scale(${(1 / k).toFixed(4)})`);
      };
      const pon = (fx, fy, k) => { gsap.set(mundo, { x: 540 - k * fx, y: 760 - k * fy, scale: k }); fija(k); return k; };
      const vuelo = (a, b, u) => {
        const k = Math.exp(Math.log(a[2]) + (Math.log(b[2]) - Math.log(a[2])) * u), v = (k - a[2]) / (b[2] - a[2]);
        return pon(a[0] + (b[0] - a[0]) * v, a[1] + (b[1] - a[1]) * v, k);
      };
      const et = (sel, html, x, y, t) => { const e = $(sel); e.querySelector("span").innerHTML = html; gsap.set(e, { left: x, top: y });
        tl.fromTo(e, { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, t - 0.08); return e; };
      nombre(".n-kl", KL, 18, 12); nombre(".n-phu", PHU, 14, 30); nombre(".n-epi", EPI, 20, 10);
      const enciende = (t) => { tl.set($(".onda"), { visibility: "visible" }, t);
        tl.fromTo($(".onda"), { attr: { r: 0.5 }, opacity: 1 }, { attr: { r: 30 }, opacity: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, t);
        tl.to($(".p-kl"), { fill: "#ff5e1a", duration: 0.2 }, t); tl.to($(".n-kl"), { fill: "#ff5e1a", duration: 0.2 }, t); };
      if (modo === "lugar") {
        // Tailandia entera; se enciende y la cámara baja a Khao Lak mientras la fecha se escribe a máquina.
        const LEJOS = [(KL[0] + EPI[0]) / 2 + 60, KL[1] - 60, 0.62], CERCA = [KL[0] + 20, KL[1] + 30, 2.2];
        const tz = 0.4, dz = DUR - 0.6;
        gsap.set([$(".g-sum"), $(".g-mar")], { autoAlpha: 0 });
        tl.to($(".tai"), { fill: "#3a352c", stroke: "#ff5e1a", duration: 0.5 }, 0.1);
        tl.to($(".g-tai"), { autoAlpha: 0, duration: 0.4 }, tz + 1.4);
        const fe = $(".fecha"); gsap.set(fe, { left: 80, top: 190 }); fe.style.visibility = "visible";
        const txt = "26 DIC 2004", t0 = w("veintiséis") - 0.05;
        alBuscar((x) => {
          fe.textContent = txt.slice(0, Math.round(txt.length * Math.min(1, Math.max(0, (x - t0) / 1.2))));
          vuelo(LEJOS, CERCA, paso(x, tz, dz, "power2.inOut"));
        });
        enciende(w("Tailandia") + 0.6);
      } else {
        // ola: el terremoto frente a Sumatra y tres ondas que crecen; la primera llega a Khao Lak con la palabra.
        gsap.set($(".tai"), { fill: "#3a352c", stroke: "#ff5e1a" });
        gsap.set([$(".cruz-e"), $(".n-epi")], { visibility: "visible" });
        gsap.set($(".g-tai"), { autoAlpha: 0 });
        const CAM = [(KL[0] + EPI[0]) / 2, (KL[1] + EPI[1]) / 2 + 20, 1.3];
        const t0 = w("tsunami", 2) - 0.15, t1 = w("Kao", 2) - 0.05, R1 = KM * PXKM, v = R1 / (t1 - t0);
        $$(".anillo").forEach((e, i) => tl.set(e, { visibility: "visible" }, t0 + 0.2 * i));
        alBuscar((x) => {
          pon(CAM[0], CAM[1], CAM[2] * (1 + 0.04 * paso(x, 0, DUR, "none")));
          $$(".anillo").forEach((e, i) => { const r = Math.max(0, (x - t0 - 0.2 * i) * v);
            e.setAttribute("r", r.toFixed(1)); e.style.opacity = Math.max(0, Math.min(1, 1.6 - r / (R1 * 1.1))).toFixed(3); });
        });
        enciende(t1);
        et(".e1", "Casi 4.000 muertos", 80, 300, w("cuatro", 2) - 0.05);
      }
      fin();
    })();
  </script>
</template>
