<template>
  <!-- Plantilla común del canal: el gancho (el final contado en el fotograma 0) y la vuelta al principio para el bucle.
       Parámetros (conf): foto, camara [escala1, x1, y1] (desde escala 1), cifra (admite <br>), tam (px de la cifra),
       unidad, linea, modo y:
         inicio  todo a la vista en el fotograma 0; sonda {en, prof} (opcional: la profundidad baja de 0 a prof metros)
         vuelta  la imagen y los textos vuelven (en_cifra, en_linea) y el último fotograma es el primero del vídeo
       Un ancla es un número (segundos desde que empieza la escena) o ["palabra", n, desfase]. -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} .foto { transform-origin: 50% 60%; }
    /* Sin subtítulos encima, el velo de abajo puede ser más leve: que se vea quién está en la imagen. */
    #{{ID}} .velo { opacity: 0.55; }
    #{{ID}} .techo { background: linear-gradient(180deg, rgba(11, 10, 9, 0.82) 0%, rgba(11, 10, 9, 0.55) 22%, rgba(11, 10, 9, 0) 42%); }
    #{{ID}} .bloque-g { position: absolute; left: 76px; top: 290px; }
    #{{ID}} .cifra { font: 800 300px/0.84 "Barlow Condensed", sans-serif; letter-spacing: -0.02em; text-transform: uppercase; white-space: nowrap;
      text-shadow: 0 6px 44px rgba(0, 0, 0, 0.75); }
    #{{ID}} .cifra .u { font-size: 0.46em; margin-left: 0.12em; letter-spacing: 0; }
    #{{ID}} .linea { margin-top: 18px; font: 800 92px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; white-space: nowrap; }
    #{{ID}} .linea span { display: inline-block; background: #ff5e1a; color: #0b0a09; padding: 0.05em 0.16em 0; }
    #{{ID}} .sonda { position: absolute; left: 880px; top: 660px; width: 60px; height: 340px; visibility: hidden; }
    #{{ID}} .sonda .eje { position: absolute; left: 40px; top: 0; width: 4px; height: 340px; background: rgba(242, 237, 228, 0.7); }
    #{{ID}} .sonda .marca { position: absolute; left: 28px; width: 28px; height: 3px; background: rgba(242, 237, 228, 0.7); }
    #{{ID}} .sonda .m { position: absolute; right: 44px; transform: translateY(-50%); font: 400 30px/1 "Special Elite", monospace; color: rgba(242, 237, 228, 0.8);
      white-space: nowrap; }
    #{{ID}} .sonda .cursor { position: absolute; left: 26px; top: 0; width: 32px; height: 32px; margin-top: -16px; background: #ff5e1a;
      clip-path: polygon(0 0, 100% 50%, 0 100%); }
    #{{ID}} .sonda .prof { position: absolute; right: 70px; top: 0; transform: translateY(-50%); font: 800 64px/1 "Barlow Condensed", sans-serif;
      color: #ff5e1a; white-space: nowrap; text-shadow: 0 3px 20px rgba(0, 0, 0, 0.9); }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc">
      <div class="capa vista">
        <img class="foto" src="assets/img/{{p:foto}}.jpg" alt="" />
        <div class="capa velo"></div>
        <div class="capa techo"></div>
        <div class="bloque-g">
          <div class="cifra num"><span class="g"></span><span class="u"></span></div>
          <div class="linea"><span></span></div>
        </div>
        <div class="sonda"><div class="eje"></div><div class="cursor"></div><div class="prof num"></div></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const C = {{p:conf}};
      const A = (a) => (typeof a === "number" ? a : (a[3] === "fin" ? f(a[0], a[1] || 1) : w(a[0], a[1] || 1)) + (a[2] || 0));
      // cifra admite <br> (unas palabras en dos renglones, «Dado por<br>muerto») y tam, su tamaño en px (300 por defecto).
      if (C.tam) $(".cifra").style.fontSize = C.tam + "px";
      $(".cifra .g")[String(C.cifra).includes("<br>") ? "innerHTML" : "textContent"] = C.cifra;
      $(".cifra .u").textContent = C.unidad || "";
      $(".linea span").textContent = C.linea;
      const cam = C.camara || [1.12, 0, -40];
      if (C.modo === "vuelta") {
        // La imagen vuelve a escala 1 justo al acabar: el último fotograma es el primero del vídeo.
        tl.fromTo($(".vista"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 0);
        tl.fromTo($(".foto"), { scale: 1.07, x: 0, y: 30 }, { scale: 1.0, x: 0, y: 0, duration: DUR, ease: "power2.out" }, 0);
        tl.fromTo($(".cifra"), { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "expo.out" }, A(C.en_cifra));
        tl.fromTo($(".linea"), { autoAlpha: 0, scaleX: 0.3, transformOrigin: "left center" }, { autoAlpha: 1, scaleX: 1, duration: 0.3, ease: "expo.out" }, A(C.en_linea));
      } else {
        tl.fromTo($(".foto"), { scale: 1.0, x: 0, y: 0 }, { scale: cam[0], x: cam[1], y: cam[2], duration: DUR, ease: "none" }, 0);
        if (C.sonda) {
          const s = C.sonda, alto = 340, t = A(s.en);
          [0, 10, 20, 30].filter((m) => m <= s.prof).forEach((m) => {
            const y = alto * m / s.prof;
            const k = document.createElement("div"); k.className = "marca"; k.style.top = y + "px"; $(".sonda").appendChild(k);
            if (!m) { const e = document.createElement("div"); e.className = "m"; e.style.top = "0px"; e.textContent = "0 m"; $(".sonda").appendChild(e); }
          });
          aparece($(".sonda"), t - 0.15, 0.25);
          tl.fromTo($(".sonda .cursor"), { y: 0 }, { y: alto, duration: 1.0, ease: "power2.inOut" }, t);
          tl.fromTo($(".sonda .prof"), { y: 0 }, { y: alto, duration: 1.0, ease: "power2.inOut" }, t);
          cuenta($(".sonda .prof"), 0, s.prof, t, 1.0, { ease: "power2.inOut", pre: "−", suf: " m", crudo: true });
        }
      }
      fin();
    })();
  </script>
</template>
