<template>
  <!-- La balsa de Poon Lim vista desde arriba (un esquema): de madera, cuadrada, de 2,4 m por lado (Wikipedia en inglés y en
       español). Modos (parámetro modo):
         inventario  «horas»: 2 HORAS EN EL AGUA; «balsa»: aparece la balsa con sus medidas; «agua», «galletas», «linterna»:
                     lo que llevaba; «ata»: la cuerda atada a la balsa; «cuenta»: los nudos de los días, con el contador
         lunas       sobre la foto de la noche (fondo): la cuerda de nudos; «contar»: se apaga; «lunas»: cuatro lunas llenas
                     (las que hubo entre el 23 de noviembre de 1942 y el 5 de abril de 1943)
       Lo que se mueve va en función del tiempo (alBuscar). -->
  <style>
/*MARCA*/
/*CORTO*/
    #{{ID}} svg.dib { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #{{ID}} .mar { fill: url(#mar-{{ID}}); }
    #{{ID}} .ola { fill: none; stroke: rgba(170, 205, 215, 0.16); stroke-width: 3; }
    #{{ID}} .tabla { fill: #6e5c45; stroke: #2b231a; stroke-width: 3; }
    #{{ID}} .tabla.b { fill: #7a664c; }
    #{{ID}} .sombra { fill: rgba(0, 0, 0, 0.45); }
    #{{ID}} .cota { stroke: #f2ede4; stroke-width: 3; fill: none; }
    #{{ID}} .cotat { font: 400 42px "Special Elite", monospace; fill: #f2ede4; }
    #{{ID}} .obj { fill: #d9cfb8; stroke: #2a2620; stroke-width: 3; }
    #{{ID}} .obj.o { fill: #ff5e1a; }
    #{{ID}} .objt { font: 400 34px "Special Elite", monospace; fill: #f2ede4; paint-order: stroke; stroke: rgba(11, 10, 9, 0.9); stroke-width: 6px; }
    #{{ID}} .cuerda { fill: none; stroke: #c9b48a; stroke-width: 7; stroke-linecap: round; }
    #{{ID}} .nudo { fill: #e3cf9f; stroke: #5a4a2c; stroke-width: 3; }
    #{{ID}} .luna { fill: #f4efe2; }
    #{{ID}} .halo { fill: url(#halo-{{ID}}); }
    #{{ID}} .fondo { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; filter: brightness(0.42); }
    #{{ID}} .t { position: absolute; visibility: hidden; white-space: nowrap; }
    #{{ID}} .t.et { font: 800 56px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
    #{{ID}} .t.et span { display: inline-block; background: rgba(11, 10, 9, 0.88); padding: 0.1em 0.3em 0.04em; border-left: 6px solid #ff5e1a; }
    #{{ID}} .t.dias { font: 400 150px/1 "Special Elite", monospace; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9); }
    #{{ID}} .t.dias small { display: block; font-size: 0.3em; letter-spacing: 0.1em; color: #ff5e1a; margin-bottom: 8px; }
  </style>
  <div data-composition-id="{{ID}}" data-width="{{ANCHO}}" data-height="{{ALTO}}">
    <div id="{{ID}}" class="esc" data-modo="{{p:modo}}">
      <img class="fondo" src="assets/img/{{p:fondo}}.jpg" alt="" />
      <svg class="dib" viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="mar-{{ID}}" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#16323b" /><stop offset="1" stop-color="#050b0e" /></radialGradient>
          <radialGradient id="halo-{{ID}}"><stop offset="0.55" stop-color="#f4efe2" stop-opacity="0.35" /><stop offset="1" stop-color="#f4efe2" stop-opacity="0" /></radialGradient>
        </defs>
        <rect class="mar" x="0" y="0" width="1080" height="1920" />
        <g class="olas"></g>
        <g class="balsa" style="visibility: hidden">
          <rect class="sombra" x="300" y="500" width="520" height="520" rx="8" />
          <g class="tablas"></g>
          <g class="objs">
            <g class="o-agua" style="visibility: hidden"><rect class="obj" x="352" y="540" width="120" height="160" rx="18" /><rect class="obj" x="390" y="516" width="44" height="30" rx="6" />
              <text class="objt" x="412" y="752" text-anchor="middle">agua</text></g>
            <g class="o-gall" style="visibility: hidden"><rect class="obj" x="536" y="560" width="190" height="130" rx="6" /><path d="M536,604 L726,604" style="stroke: #2a2620; stroke-width: 3" />
              <text class="objt" x="631" y="740" text-anchor="middle">galletas</text></g>
            <g class="o-lint" style="visibility: hidden"><rect class="obj" x="560" y="842" width="150" height="46" rx="10" /><path class="obj o" d="M710,836 L752,822 L752,908 L710,894 Z" />
              <text class="objt" x="645" y="950" text-anchor="middle">linterna</text></g>
          </g>
        </g>
        <g class="cotas" style="visibility: hidden">
          <path class="cota" d="M280,430 L800,430 M280,412 L280,448 M800,412 L800,448" />
          <text class="cotat" x="540" y="406" text-anchor="middle">2,4 m</text>
          <path class="cota" d="M232,470 L232,990 M214,470 L250,470 M214,990 L250,990" />
          <text class="cotat" x="-730" y="212" text-anchor="middle" transform="rotate(-90)">2,4 m</text>
        </g>
        <path class="cuerda c-ata" d="M800,930 C880,960 900,1010 860,1060 C820,1100 900,1120 960,1110" pathLength="100" stroke-dasharray="100 100" style="visibility: hidden" />
        <path class="cuerda c-nudos" d="M80,400 L1000,400" style="visibility: hidden" />
        <g class="nudos"></g>
        <g class="lunas"></g>
      </svg>
      <div class="t dias"><small>DÍA</small><span class="n">1</span></div>
      <div class="t et e1"><span></span></div>
      <div class="t et e2"><span></span></div>
    </div>
  </div>
  <script>
    (function () {
/*AYUDA*/
      const modo = RAIZ.dataset.modo;
      const NS = "http://www.w3.org/2000/svg";
      const nuevo = (tag, attrs, padre) => { const e = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); $(padre).appendChild(e); return e; };
      const et = (sel, html, x, y, t, hasta) => { const e = $(sel); e.querySelector("span").innerHTML = html; gsap.set(e, { left: x, top: y });
        tl.fromTo(e, { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, t - 0.08);
        if (hasta != null) tl.to(e, { autoAlpha: 0, duration: 0.25, ease: "power2.in" }, hasta); };
      // Las olas, de lado a lado, que se mueven despacio.
      const olas = [];
      for (let i = 0; i < 16; i++) olas.push(nuevo("path", { class: "ola" }, ".olas"));
      const pintaOlas = (x) => olas.forEach((o, i) => {
        const y0 = 140 + i * 118, fase = x * 0.9 + i * 1.7;
        let d = "";
        for (let px = -40; px <= 1120; px += 40) d += (px === -40 ? "M" : "L") + px + "," + (y0 + Math.sin(px / 140 + fase) * 10).toFixed(1);
        o.setAttribute("d", d);
      });
      if (modo === "inventario") {
        $(".fondo").style.display = "none";
        // Las tablas de la balsa (siete), un poco giradas como si flotara.
        for (let i = 0; i < 7; i++) nuevo("rect", { class: "tabla" + (i % 2 ? " b" : ""), x: 280 + i * (520 / 7), y: 470, width: 520 / 7 - 4, height: 520, rx: 6 }, ".tablas");
        nuevo("rect", { class: "tabla", x: 270, y: 520, width: 540, height: 40, rx: 6 }, ".tablas");
        nuevo("rect", { class: "tabla", x: 270, y: 900, width: 540, height: 40, rx: 6 }, ".tablas");
        const tb = w("balsa", 2) - 0.1;
        tl.set($(".balsa"), { visibility: "visible" }, tb);
        tl.fromTo($(".balsa"), { autoAlpha: 0, scale: 0.86, rotation: -9, svgOrigin: "540 730" }, { autoAlpha: 1, scale: 1, rotation: -3, svgOrigin: "540 730", duration: 0.6, ease: "expo.out", immediateRender: false }, tb);
        tl.fromTo($(".cotas"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, tb + 0.35);
        tl.to($(".cotas"), { autoAlpha: 0, duration: 0.3 }, w("Como") - 0.1);
        [["agua", 3, ".o-agua"], ["galletas", 1, ".o-gall"], ["linterna", 1, ".o-lint"]].forEach(([p, n, sel]) => {
          tl.set($(sel), { visibility: "visible" }, w(p, n) - 0.08);
          tl.fromTo($(sel), { autoAlpha: 0, y: -26 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, w(p, n) - 0.08);
        });
        // La cuerda: atada a la balsa (se dibuja con «ata»).
        traza($(".c-ata"), w("ata") - 0.1, 0.7);
        // Los nudos de los días, sobre la cuerda de arriba, con el contador.
        const tc = w("cuenta") - 0.08, nudos = [];
        tl.fromTo($(".c-nudos"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, tc);
        for (let i = 0; i < 6; i++) nudos.push(nuevo("circle", { class: "nudo", cx: 140 + i * 150, cy: 400, r: 0 }, ".nudos"));
        const d = $(".dias"); gsap.set(d, { left: 80, top: 176 });
        aparece(d, tc, 0.25);
        et(".e1", "2 horas en el agua", 80, 300, w("horas") - 0.05, w("balsa", 2) - 0.3);
        et(".e2", "Atado a la balsa", 80, 1040, w("ata") - 0.05);
        alBuscar((x) => {
          pintaOlas(x);
          const k = Math.max(0, Math.min(6, Math.floor((x - tc) / 0.2) + 1));
          nudos.forEach((n, i) => n.setAttribute("r", i < k ? 16 : 0));
          d.querySelector(".n").textContent = String(Math.max(1, k));
          // El contador y la cuerda de nudos tapan el rótulo de las 2 horas: el rótulo ya se fue.
        });
      } else {
        // lunas: la cuerda de nudos (los días) se apaga y salen las cuatro lunas llenas.
        $(".mar").style.display = "none"; $(".olas").style.display = "none";
        gsap.set($(".c-nudos"), { visibility: "visible" });
        const nudos = [];
        for (let i = 0; i < 18; i++) nudos.push(nuevo("circle", { class: "nudo", cx: 110 + i * 50, cy: 400, r: 13 }, ".nudos"));
        et(".e1", "Los días, en nudos", 80, 280, 0.0, w("Ahora") - 0.2);
        tl.to([$(".c-nudos"), $(".nudos")], { opacity: 0.18, duration: 0.5, ease: "power2.inOut" }, w("contar") - 0.05);
        const tL = w("lunas") - 0.1;
        for (let i = 0; i < 4; i++) {
          // Entre la luna de la foto (y 200–880) y el horizonte (1060): encima de la luna se confundían con ella.
          const g = nuevo("g", { transform: `translate(${210 + i * 220},960)` }, ".lunas");
          const h = document.createElementNS(NS, "circle"); h.setAttribute("class", "halo"); h.setAttribute("r", "92"); g.appendChild(h);
          const l = document.createElementNS(NS, "circle"); l.setAttribute("class", "luna"); l.setAttribute("r", "60"); g.appendChild(l);
          tl.fromTo(g, { autoAlpha: 0, scale: 0.5, svgOrigin: "0 0" }, { autoAlpha: 1, scale: 1, svgOrigin: "0 0", duration: 0.3, ease: "back.out(1.8)" }, tL + i * 0.16);
        }
        et(".e2", "Lunas llenas", 80, 1066, tL + 0.1);
      }
      fin();
    })();
  </script>
</template>
